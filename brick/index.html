<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1420">
<meta name="description" content="方块消消 BRICK —— 经典打砖块，多球、加宽、激光道具，关卡递进。">
<title>方块消消 · BRICK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1420'/%3E%3Crect x='6' y='8' width='9' height='5' fill='%234db8ff'/%3E%3Crect x='17' y='8' width='9' height='5' fill='%23ff6b9d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{--ac:#4db8ff;--bg:#0a1420;--paper:#e6f0fa;--dim:#8296ad;--line:#1e3448}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#12273d 0%,var(--bg) 64%);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
.wrap{width:min(100%,480px)}
.head{text-align:center;margin-bottom:10px}.logo{font-size:22px;letter-spacing:.3em;margin:0;color:var(--ac)}.sub{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:4px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12px}
.bar b{color:var(--ac);font-size:15px}.bar .stat{display:flex;gap:12px;flex-wrap:wrap}
.stage{position:relative;width:100%;
aspect-ratio:4/5;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#0d1c2b,#08111b);touch-action:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(6,14,22,.86);text-align:center;padding:20px}
.overlay[hidden]{display:none}.overlay h2{margin:0;font-size:22px;letter-spacing:.14em;color:var(--ac)}
.overlay p{margin:0;font-size:12px;color:var(--dim);line-height:1.8}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:12px;min-height:42px;padding:0 16px;font:inherit;font-size:13px;cursor:pointer;background:var(--ac);color:#06121f;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:400}
.msg{text-align:center;min-height:18px;font-size:11px;margin:6px 0;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
  <link rel="stylesheet" href="../shared/screen-fit.css">
</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="logo">BRICK</h1><p class="sub">方 块 消 消 · 道 具 与 关 卡</p></div>
  <div class="bar"><div class="stat"><span>最高 <b id="best">0</b></span><span>关卡 <b id="level">1</b></span><span>生命 <b id="lives">3</b></span></div><button class="btn ghost" id="btn-info" style="min-height:30px;padding:0 10px">规则</button></div>
  <div class="stage"><canvas id="cv" width="400" height="500"></canvas>
    <div class="overlay" id="overlay"><h2 id="ov-title">方块消消</h2><p id="ov-text">移动挡板接球，打碎所有砖块。点击开始 / ← → 移动 / 空格发球</p><div class="controls"><button class="btn" id="ov-btn">开始游戏</button></div></div>
  </div>
  <div class="msg" id="msg">道具：多球 ● 加宽 ▬ 激光 ↑</div>
  <div class="controls"><button class="btn" id="btn-start">开始</button><button class="btn ghost" id="btn-daily">每日关卡</button></div>
</div>
<div class="overlay" id="info" hidden style="position:fixed;z-index:50"><div style="width:min(90%,380px);background:#122437;border:1px solid var(--line);border-radius:16px;padding:22px"><h2 style="margin:0 0 10px;color:var(--ac);font-size:18px">玩法</h2><p style="font-size:12px;line-height:1.9;color:var(--dim);margin:0">鼠标/手指拖动或 ← → 移动挡板，空格或点击发球。打碎全部砖块进入下一关。掉落道具：多球、加宽挡板、激光（自动发射）。漏球扣一条命，三命耗尽结束。每日关卡按日期固定布局。</p><div class="controls" style="margin-top:16px"><button class="btn" id="info-close">知道了</button></div></div></div>
<script>
(function(){
'use strict';
var KEY='mg_brick.v1',$=function(i){return document.getElementById(i)};
var S=(function(){try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')return o}catch(e){}return {best:0,runs:0,level:1,daily:null}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seedFrom(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){var x=seed>>>0||1;return function(){x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
var cv=$('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
var W_=Math.floor(W),H_=Math.floor(H);
var pad={x:W/2-40,y:H-34,w:80,h:12},balls=[],bricks=[],parts=[],lasers=[];
var score=0,level=1,lives=3,running=false,daily=false,paused=false,raf=null,wideT=0,laserT=0;
var colors=['#4db8ff','#5cc08a','#d6ab58','#ff6b9d','#a89ae6'];
function HUD(){$('best').textContent=S.best;$('level').textContent=level;$('lives').textContent=lives}
function buildLevel(){
  bricks=[];var rows=4+Math.min(level-1,3),cols=9,bw=(W-20)/cols,bh=18;
  var seed=daily?seedFrom('brick-'+today()+'-'+level):seedFrom('brick-'+level+'-'+Date.now());var rand=rng(seed);
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    if(rand()<0.08)continue;
    bricks.push({x:10+c*bw,y:44+r*(bh+4),w:bw-3,h:bh,color:colors[(r+level)%colors.length],hp:1});
  }
}
function serveBall(){balls=[{x:pad.x+pad.w/2,y:pad.y-4,vx:(Math.random()*2-1)*2.6,vy:-4.4,r:5,stuck:true}]}
function start(dailyFlag){
  daily=!!dailyFlag;score=0;level=1;lives=3;wideT=0;laserT=0;pad.w=80;parts=[];lasers=[];
  S.runs++;save();buildLevel();serveBall();running=true;paused=false;HUD();
  $('overlay').hidden=true;loop();
}
function spawnParts(x,y,color,n){for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()*2-1)*3,vy:(Math.random()*2-1)*3,life:1,color:color})}
function draw(){
  ctx.clearRect(0,0,W_,H_);
  // 砖块
  bricks.forEach(function(b){ctx.fillStyle=b.color;ctx.globalAlpha=.9;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1});
  // 挡板
  ctx.fillStyle='#e6f0fa';ctx.fillRect(pad.x,pad.y,pad.w,pad.h);
  if(laserT>0){ctx.fillStyle='#ff6b9d';ctx.fillRect(pad.x+4,pad.y-4,6,8);ctx.fillRect(pad.x+pad.w-10,pad.y-4,6,8)}
  // 球
  balls.forEach(function(b){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()});
  // 激光
  lasers.forEach(function(l){ctx.fillStyle='#ff6b9d';ctx.fillRect(l.x-2,l.y,4,12)});
  // 粒子
  parts.forEach(function(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1});
}
function step(){
  if(wideT>0&&--wideT===0){pad.x+=15;pad.w=80}
  if(laserT>0)laserT--;
  // 挡板
  pad.x=Math.max(0,Math.min(W-pad.w,pad.x));
  // 球
  balls.forEach(function(b){
    if(b.stuck){b.x=pad.x+pad.w/2;b.y=pad.y-6;return}
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r||b.x>W-b.r)b.vx*=-1;
    if(b.y<b.r)b.vy*=-1;
    if(b.y>pad.y&&b.y<pad.y+pad.h&&b.x>pad.x&&b.x<pad.x+pad.w){b.vy=-Math.abs(b.vy);b.vx+=(b.x-(pad.x+pad.w/2))/12}
  });
  balls=balls.filter(function(b){return b.y<H+12});
  // 碰撞砖块
  balls.forEach(function(b){
    for(var i=0;i<bricks.length;i++){var k=bricks[i];
      if(b.x>k.x&&b.x<k.x+k.w&&b.y>k.y&&b.y<k.y+k.h){
        b.vy*=-1;spawnParts(b.x,b.y,k.color,7);score+=10;bricks.splice(i,1);
        if(Math.random()<0.14){var kd=Math.floor(Math.random()*3);if(kd===0){var extra=balls.length;balls.push({x:b.x,y:b.y,vx:2.5,vy:-4,r:5,stuck:false});if(extra<balls.length)balls.push({x:b.x,y:b.y,vx:-2.5,vy:-4,r:5,stuck:false})}
          else if(kd===1){pad.w=120;wideT=300;pad.x-=20}else laserT=300}
        break;
      }
    }
  });
  // 激光
  if(laserT>0&&Math.random()<0.25){lasers.push({x:pad.x+6,y:pad.y-6},{x:pad.x+pad.w-6,y:pad.y-6})}
  lasers.forEach(function(l){l.y-=8;bricks.forEach(function(k,i){if(l.x>k.x&&l.x<k.x+k.w&&l.y>k.y&&l.y<k.y+k.h){spawnParts(l.x,l.y,k.color,4);score+=10;bricks.splice(i,1);l.y=-99}})});
  lasers=lasers.filter(function(l){return l.y>-10});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=.03});parts=parts.filter(function(p){return p.life>0});
  if(!balls.length){lives--;HUD();if(lives<=0){gameOver();return}serveBall()}
  if(!bricks.length){level++;S.level=Math.max(S.level,level);if(score>S.best){S.best=score}save();buildLevel();serveBall()}
  if(score>S.best){S.best=score}
}
function loop(){if(!running)return;step();draw();raf=requestAnimationFrame(loop)}
function gameOver(){running=false;cancelAnimationFrame(raf);if(score>S.best){S.best=score;save()}save();
  $('ov-title').textContent='游戏结束';$('ov-text').textContent='得分 '+score+' · 到达第 '+level+' 关'+(daily?' · 每日关卡':'');$('ov-btn').textContent='再来一局';$('overlay').hidden=false;HUD()}
function launch(){if(!running)return;balls.forEach(function(b){if(b.stuck){b.stuck=false}})}
// 输入
function moveTo(clientX){var r=cv.getBoundingClientRect();pad.x=(clientX-r.left)/r.width*W-pad.w/2}
cv.addEventListener('pointermove',function(e){if(running)moveTo(e.clientX)});
cv.addEventListener('pointerdown',function(e){if(!running)return;moveTo(e.clientX);launch()});
window.addEventListener('keydown',function(e){if(!running)return;if(e.key==='ArrowLeft')pad.x-=22;if(e.key==='ArrowRight')pad.x+=22;if(e.code==='Space'){e.preventDefault();launch()}});
$('ov-btn').addEventListener('click',function(){$('ov-btn').textContent='开始游戏';start($('ov-btn').getAttribute('data-daily')==='1')});
$('btn-start').addEventListener('click',function(){start(false)});
$('btn-daily').addEventListener('click',function(){$('ov-btn').setAttribute('data-daily','1');$('ov-title').textContent='每日关卡';$('ov-text').textContent='按日期固定布局，今天 '+today();$('ov-btn').textContent='开始每日关卡';$('overlay').hidden=false});
$('btn-info').addEventListener('click',function(){$('info').hidden=false});
$('info-close').addEventListener('click',function(){$('info').hidden=true});
HUD();buildLevel();draw();
})();
</script>
<script>window.MG_SCREEN_FIT={"title":"方块消消","tagline":"BRICK · 道具与关卡","tip":"拖动挡板或按 ← → 接球，空格发球，打碎全部砖块进入下一关。","accent":"#4db8ff","bg":"#0a1420","mainWidth":"520px","cover":"../covers/brick-v2.png","left":[{"title":"操作","body":"鼠标 / 手指拖动挡板\n← → 移动 · 空格发球\n漏球扣一命，三命耗尽结束"},{"title":"道具","body":"多球 ● · 加宽挡板 ▬ · 激光 ↑（自动发射）"}],"right":[{"title":"关卡","body":"关卡递进难度提升；每日关卡按日期固定布局，可反复挑战。"}]};window.MG_SCREEN_FIT_FRIENDS=["metro-runner","tap","sudoku","slide","territory","trio","liar","doudizhu","wuyouk","tongxin","diner","shanhai","paper-maze","sleeper","legion","brick"];</script>

</body>
