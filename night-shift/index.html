<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0e14">
<title>夜班便利店 NIGHT SHIFT · 垂直切片</title>
    <meta name="description" content="夜班便利店 —— 模拟经营 + 顾客剧情线，3 位常客多段推进。">
<link rel="stylesheet" href="./shared/tokens.css">
  <link rel="stylesheet" href="./styles/tokens.css">
<!-- 无构建步骤：原生 ESM + importmap 指向本地 Three.js 副本（离线可跑，见 ADR-001） -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app" role="main">
  <canvas id="scene-canvas"></canvas>
  <!-- HUD 由 src/hud.mjs 动态挂载 -->
  <div id="hud-root"></div>
  <!-- P0-4：首次加载指示（纯文字 + CSS 转圈，不新增图片/字体；首帧后由 main.mjs 移除） -->
  <div id="boot"><div class="ring"></div><div>加载中…</div></div>
</div>
<noscript>本游戏需要启用 JavaScript。</noscript>
<script type="module" src="./src/main.mjs">
// 页面可见性变化时暂停/恢复游戏循环（避免后台继续消耗资源）
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    // 暂停逻辑：停止 requestAnimationFrame / setInterval
    if (typeof pauseGame === 'function') pauseGame();
  } else {
    // 恢复逻辑：重新开始游戏循环
    if (typeof resumeGame === 'function') resumeGame();
  }
});


// 页面卸载时清理游戏循环（避免后台继续消耗资源）
window.addEventListener('pagehide', function() {
  try {
    if (typeof cancelAnimationFrame === 'function' && window.__mgRAF) cancelAnimationFrame(window.__mgRAF);
  } catch(e) {}
  try {
    if (typeof clearInterval === 'function' && window.__mgIntervals) {
      for (var i = 0; i < window.__mgIntervals.length; i++) clearInterval(window.__mgIntervals[i]);
      window.__mgIntervals = [];
    }
  } catch(e) {}
});


// 全局错误捕获（非破坏性：只记录，不阻断游戏）
window.addEventListener('error', function(e) {
  try { console.error('[Game Error]', e.message, e.filename, e.lineno); } catch(err) {}
});
window.addEventListener('unhandledrejection', function(e) {
  try { console.error('[Unhandled Rejection]', e.reason); } catch(err) {}
});

</script>

<!-- PWA：Service Worker（离线可用 / 可安装到主屏） -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 离线能力不可用不影响游戏 */ });
  });
}
</script>
</body>
</html>
