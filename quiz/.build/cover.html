<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{--paper:#ece6da;--gold:#d6ab58;--dim:#8d8378;--pur:#a89ae6;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:600px;height:800px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% -10%,#241d33 0%,#12101a 55%,#0d0c0b 100%);
    color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;padding:54px 46px 40px;position:relative}
  .frame{position:absolute;inset:20px;border:1px solid rgba(214,171,88,.26);border-radius:10px}
  .glow{position:absolute;width:460px;height:460px;border-radius:50%;right:-140px;top:-110px;
    background:radial-gradient(circle,rgba(124,92,255,.36),transparent 66%);filter:blur(6px)}
  .kicker{font-size:12.5px;letter-spacing:.42em;color:var(--gold)}
  h1{font-size:58px;letter-spacing:.1em;font-weight:600;margin:16px 0 8px;line-height:1.05}
  .sub{font-size:14.5px;letter-spacing:.26em;color:var(--dim)}
  .rule{width:60px;height:2px;background:var(--gold);margin:22px 0 0;opacity:.85}

  .qcard{margin:30px 0 26px;flex:1;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
    border:1px solid rgba(168,154,230,.26);border-radius:18px;padding:20px 18px 18px}
  .pbar{height:6px;background:rgba(255,255,255,.10);border-radius:99px;overflow:hidden}
  .pbar i{display:block;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,#9d80ff,#7c5cff)}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:12px 2px 0;letter-spacing:.06em}
  .q{font-size:34px;font-weight:600;text-align:center;margin:20px 0 22px;letter-spacing:.06em}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;text-align:center;
    font-size:19px;font-weight:600;color:#cfc6e6;background:rgba(255,255,255,.03)}
  .opt.ok{border-color:rgba(214,171,88,.75);background:rgba(214,171,88,.14);color:var(--gold)}
  .unk{margin-top:14px;border:1px solid rgba(214,171,88,.30);background:rgba(214,171,88,.07);
    border-radius:12px;padding:13px;text-align:center;font-size:13.5px;letter-spacing:.08em;color:#c9a86a}
  .foot{margin-top:0;display:flex;align-items:center;justify-content:space-between}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:11.5px;letter-spacing:.08em;color:var(--pur);border:1px solid rgba(168,154,230,.35);
    border-radius:999px;padding:6px 11px}
  .badge{font-size:12px;letter-spacing:.2em;color:var(--gold);border:1px solid rgba(214,171,88,.45);
    border-radius:999px;padding:8px 14px}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="glow"></div>
  <div class="kicker">KNOWLEDGE QUIZ</div>
  <h1>知识问答</h1>
  <div class="sub">百词斩式分类刷题</div>
  <div class="rule"></div>

  <div class="qcard">
    <div class="pbar"><i></i></div>
    <div class="meta"><span>🔢 数学 · 🎒 小学</span><span>第 4/10</span></div>
    <div class="q">8 × 7 = ?</div>
    <div class="opts">
      <div class="opt">54</div>
      <div class="opt ok">56</div>
      <div class="opt">58</div>
      <div class="opt">63</div>
    </div>
    <div class="unk">😵 不会 · 记入薄弱题</div>
  </div>

  <div class="foot">
    <div class="tags">
      <span class="tag">实力检测</span>
      <span class="tag">AI 建题库</span>
      <span class="tag">错题本</span>
    </div>
    <div class="badge">已上线</div>
  </div>
</body>
</html>
