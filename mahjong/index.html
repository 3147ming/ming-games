<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10231d">
<title>麻将 · 四人局</title>
<meta name="description" content="136 张简版麻将：碰、杠、胡、七对与番型结算，本地 AI 对手，断线可续局。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f3ead8'/%3E%3Crect x='12' y='8' width='30' height='44' rx='5' fill='%23e8f1ea' stroke='%23264b3a' stroke-width='2'/%3E%3Ctext x='20' y='38' font-size='22' fill='%23b23a2e'%3E%E4%B8%87%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{--felt:#173b2f;--felt2:#0e2b22;--paper:#f7f2e6;--ink:#25352d;--gold:#d9b66a;--red:#b23a2e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#1e4a3a,#0b1d17 75%);color:#f0e9d8;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:12px 12px 24px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:19px;margin:0;color:var(--gold);letter-spacing:2px}
.bar{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
button,select{min-height:44px;padding:0 13px;border-radius:10px;border:1px solid #52705e;background:#1c3b2e;color:#eef3e8;font:inherit;font-size:13px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--gold)}button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:#9c7d3c;border-color:#d9b66a;color:#fff}
.table{position:relative;background:radial-gradient(ellipse at 50% 45%,#215240,#0f2a21);border:2px solid #3d6b53;border-radius:18px;padding:10px;min-height:520px}
.seats{display:grid;grid-template-columns:1fr minmax(260px,1.6fr) 1fr;gap:8px;align-items:start}
.seat{background:#0c231cc9;border:1px solid #355b48;border-radius:12px;padding:8px;min-height:96px}
.seat.me{background:#173d30;border-color:#7e9b52}
.seat h3{margin:0 0 6px;font-size:12px;color:#cdd9bf;font-weight:600;display:flex;justify-content:space-between}
.seat h3 span{color:var(--gold)}
.backrow{display:flex;gap:2px;flex-wrap:wrap}
.back{width:17px;height:25px;border-radius:3px;background:linear-gradient(135deg,#2f6a52,#164331);border:1px solid #0d2a20;box-shadow:inset 0 0 0 2px #ffffff10}
.center{display:flex;flex-direction:column;gap:8px}
.river{min-height:120px;background:#0a2119aa;border:1px dashed #3e6a53;border-radius:10px;padding:6px}
.river h4{margin:0 0 5px;font-size:11px;color:#a8c0ad;font-weight:500}
.river .tiles{display:flex;flex-wrap:wrap;gap:2px}
.meldline{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#b8c9b6}
.status{text-align:center;font-size:13px;color:#d8e2cf;min-height:24px}
.hand{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;justify-content:center;min-height:70px}
.tile{position:relative;width:34px;height:48px;border-radius:5px;background:linear-gradient(#fffdf6,#e9e2d0);border:1px solid #b8ad91;box-shadow:0 2px 0 #8c836e,0 3px 6px #0006;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;flex:none;font-family:"Songti SC","SimSun",serif}
.tile.small{width:24px;height:34px;font-size:11px}
.tile.picked{transform:translateY(-7px);border-color:var(--gold);box-shadow:0 0 0 2px #d9b66a,0 5px 8px #0008}
.tile.suggest:after{content:"";position:absolute;inset:-4px;border:2px dashed #ffd166;border-radius:8px;pointer-events:none}
.tile.drawn{animation:drawIn .2s ease-out}
.tile.discardIn{animation:discardIn .2s ease-out}
@keyframes drawIn{from{opacity:0;transform:translate(28px,-16px) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes discardIn{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
.wan{font-size:19px;font-weight:700}.wan small{display:block;font-size:10px;line-height:8px;text-align:center}
.honor{font-size:19px;font-weight:700;color:#1f4b6b}.honor.red{color:var(--red)}.honor.green{color:#26703f}
.bamboo,.pins{display:flex;flex-wrap:wrap;width:24px;height:34px;align-content:center;justify-content:center;gap:1px;padding:2px}
.bamboo i{width:3px;height:8px;background:#26703f;border-radius:2px;display:block}
.bamboo i.one{width:5px;height:16px}
.pins i{width:7px;height:7px;border-radius:50%;background:#245b86;display:block;box-shadow:inset 0 0 0 2px #cfe0ec}
.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:46px}
.result{position:fixed;inset:0;background:#06120edb;display:none;place-items:center;padding:16px;z-index:20}
.result.show{display:grid}.panel{background:#f7f2e6;color:#25352d;border-radius:16px;padding:20px;max-width:460px;width:100%;max-height:86vh;overflow:auto}
.panel h2{margin:0 0 8px;color:#8c6b2e}.panel table{width:100%;border-collapse:collapse;font-size:13px}.panel td{padding:4px 0;border-bottom:1px solid #ddd2b8}
.hint{font-size:12px;opacity:.75;line-height:1.6;margin:8px 0 0}
@media(pointer:coarse){button,select{min-height:48px}.tile{width:32px;height:46px}}
@media(max-width:600px){.table{padding:7px;min-height:0}.seats{grid-template-columns:1fr 1fr;gap:6px}.seat{padding:6px;min-height:82px}.seat.left{grid-column:1}.seat.right{grid-column:2}.seat.top{grid-column:1/-1}.center{grid-column:1/-1;order:3}.tile{width:29px;height:42px}.tile.small{width:22px;height:31px}.back{width:14px;height:21px}h1{font-size:16px}.bar{margin-left:0;width:100%}.bar button,.bar select{flex:1;padding:0 6px;font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>麻将 · 四人局</h1><p class="hint" style="margin:0">136 张 · 碰杠胡 · 七对 · 番型封顶 8</p></div>
  <div class="bar">
    <select id="chi" aria-label="吃牌设置"><option value="off">吃牌：关</option><option value="on">吃牌：开</option></select>
    <select id="listen" aria-label="听牌提示"><option value="on">听牌提示：开</option><option value="off">听牌提示：关</option></select>
    <button id="hintBtn" type="button">出牌建议</button>
    <button id="rulesBtn" type="button">规则</button>
    <button id="newBtn" type="button" class="primary">新局</button>
  </div>
</header>

<div class="table">
  <div class="seats">
    <div class="seat right" id="seat1"><h3>下家 · AI</h3><div class="backrow"></div><div class="river"><h4>牌河</h4><div class="tiles"></div></div><div class="meldline"></div></div>
    <div class="seat top" id="seat2"><h3>对家 · AI</h3><div class="backrow"></div><div class="river"><h4>牌河</h4><div class="tiles"></div></div><div class="meldline"></div></div>
    <div class="seat left" id="seat3"><h3>上家 · AI</h3><div class="backrow"></div><div class="river"><h4>牌河</h4><div class="tiles"></div></div><div class="meldline"></div></div>
    <div class="center">
      <div class="status" id="status">发牌中…</div>
      <div class="seat me" id="seat0"><h3>我（庄家）<span id="listenTip"></span></h3><div class="river"><h4>我的牌河</h4><div class="tiles"></div></div><div class="meldline"></div></div>
    </div>
  </div>
  <div class="hand" id="hand" aria-label="我的手牌"></div>
  <div class="actions" id="actions"></div>
</div>
<p class="hint" id="msg">点选手牌后再次点击打出；摸到的牌会浮起。断线重开自动续局。</p>
</div>

<div class="result" id="result"><div class="panel"><h2 id="rtitle"></h2><div id="rbody"></div><button id="rclose" type="button" class="primary">再来一局</button></div></div>

<script type="module">
import {
  createMatch, drawTile, discard, resolveClaim, passClaim, selfDrawWin,
  declareKong, claimOptions, waitingTiles, scoreHand, settle, discardAdvice,
  aiStep, sortHand, tileName, isHonor, suitOf, rankOf, tileCountCheck,
} from './src/mahjong-core.mjs';

const $ = (id) => document.getElementById(id);
const SAVE = 'mg_mahjong.v1';
const CFG = 'mg_mahjong.settings.v1';
const cfg = Object.assign({ chi: false, listen: true }, (() => {
  try { return JSON.parse(localStorage.getItem(CFG) || '{}'); } catch { return {}; }
})());
let m = null, picked = null, suggestTile = null, busy = false, timer = null;

const CN = ['一','二','三','四','五','六','七','八','九'];
function face(t, small = false) {
  const suit = suitOf(t), n = rankOf(t);
  let inner = '';
  if (suit === 'z') {
    const cls = t === 31 ? ' red' : t === 32 ? ' green' : '';
    inner = `<span class="honor${cls}">${tileName(t)}</span>`;
  } else if (suit === 'w') inner = `<span class="wan">${CN[n-1]}<small>萬</small></span>`;
  else if (suit === 's') {
    let bars = '';
    if (n === 1) bars = '<i class="one"></i>';
    else for (let k = 0; k < n; k++) bars += '<i></i>';
    inner = `<div class="bamboo">${bars}</div>`;
  } else {
    let dots = '';
    for (let k = 0; k < n; k++) dots += '<i></i>';
    inner = `<div class="pins">${dots}</div>`;
  }
  return `<div class="tile${small ? ' small' : ''}" data-tile="${t}">${inner}</div>`;
}
function save() {
  try { localStorage.setItem(SAVE, JSON.stringify(m)); } catch { /* 配额满不拦局 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && Array.isArray(d.wall) && Array.isArray(d.hands) ? d : null;
  } catch { return null; }
}

function render() {
  for (let s = 0; s < 4; s++) {
    const seat = $(`seat${s}`);
    const who = s === 0 ? '我' : ['下家','对家','上家'][s-1];
    const turnMark = m.turn === s && m.phase !== 'end' ? ' ●' : '';
    seat.querySelector('h3').innerHTML = `${who}${s === 0 ? '（庄家）' : ' · AI'}${turnMark}${s === 0 ? '<span id="listenTip"></span>' : ''}<span>${m.hands[s].length} 张</span>`;
    const backEl = seat.querySelector('.backrow');
    if (backEl) backEl.innerHTML = s === 0 ? '' :
      Array.from({ length: Math.min(m.hands[s].length, 13) }, () => '<div class="back"></div>').join('');
    seat.querySelector('.river .tiles').innerHTML = m.discards[s].map((t, i) =>
      face(t, true).replace('class="tile', `class="tile${i === m.discards[s].length - 1 ? ' discardIn' : ''}`)).join('');
    seat.querySelector('.meldline').innerHTML = m.melds[s].map((x) =>
      `<span>${x.hidden ? '暗杠' : ({pung:'碰',kong:'杠',chow:'吃'}[x.kind] || '')} ${tileName(x.tile)}</span>`).join('');
  }
  const h = m.hands[0];
  // 按牌序展示（真实索引保留在 data-i，点击仍打出手牌数组里的对应张）
  const view = h.map((t, i) => ({ t, i })).sort((a, b) => a.t - b.t);
  $('hand').innerHTML = view.map(({ t, i }) => {
    const cls = [];
    if (picked === i) cls.push('picked');
    if (suggestTile === t) cls.push('suggest');
    if (t === m.lastDraw && m.turn === 0) cls.push('drawn');
    const s = face(t);
    return s.replace('class="tile', `class="tile ${cls.join(' ')}`).replace('data-tile=', `data-i="${i}" data-tile=`);
  }).join('');
  let status = '';
  if (m.phase === 'end') status = m.result?.type === 'win' ? '本局结束' : '流局';
  else if (m.phase === 'claim' && m.claim?.options.some((o) => o.seat === 0)) status = '可以鸣牌 / 胡牌';
  else status = m.turn === 0 ? (m.phase === 'draw' ? '轮到你摸牌' : '轮到你出牌') : `${['下家','对家','上家'][m.turn-1]}行动中…`;
  $('status').textContent = `牌墙 ${m.wall.length} · ${status}`;
  // 听牌提示
  let tip = '';
  if (cfg.listen && h.length === 13) {
    const w = waitingTiles(h, m.melds[0].length);
    if (w.length) tip = `听 ${w.map(tileName).join('、')}`;
  }
  $('listenTip').textContent = tip;
  renderActions();
}

function renderActions() {
  const a = $('actions');
  a.innerHTML = '';
  const add = (label, fn, primary = false) => {
    const b = document.createElement('button');
    b.textContent = label; b.type = 'button';
    if (primary) b.className = 'primary';
    b.addEventListener('click', fn);
    a.appendChild(b);
  };
  if (m.phase === 'end') return;
  if (m.phase === 'claim') {
    const mine = m.claim?.options.find((o) => o.seat === 0);
    if (mine) {
      if (mine.options.includes('win')) add('胡！', () => doClaim('win'), true);
      if (mine.options.includes('kong')) add('杠', () => doClaim('kong'));
      if (mine.options.includes('pung')) add('碰', () => doClaim('pung'));
      if (mine.options.includes('chow') && cfg.chi) add('吃', () => doClaim('chow'));
      add('过', () => doClaim('pass'));
    }
    return;
  }
  if (m.turn === 0 && m.phase === 'discard') {
    const w = scoreHand(m.hands[0], m.melds[0].length, { selfDraw: true, rinshan: m.rinshan, melds: m.melds[0] });
    if (w.ok) add('自摸胡', () => { selfDrawWin(m, 0); finish(); }, true);
    const c = {}; for (const t of m.hands[0]) c[t] = (c[t] || 0) + 1;
    const kong = Object.keys(c).find((t) => c[t] === 4);
    if (kong && m.wall.length) add('暗杠', () => { declareKong(m, 0, +kong, true); save(); render(); advance(); });
  }
}

function doClaim(action) {
  if (action === 'pass') passClaim(m);
  else resolveClaim(m, 0, action);
  picked = null; suggestTile = null; save(); render(); advance();
}

function finish() {
  const r = m.result;
  if (!r) return;
  const deltas = settle(0, r, 1);
  $('rtitle').textContent = r.type === 'draw-game' ? '流局' :
    (r.winner === 0 ? '自摸胡牌！' : (r.selfDraw ? `${r.winner} 自摸` : `放炮给 ${r.winner}`));
  const rows = (r.fans || []).map((f) => `<tr><td>${f.name}</td><td>${f.fan} 番</td></tr>`).join('');
  const handStr = (r.hand || []).map(tileName).join(' ');
  $('rbody').innerHTML = `
    <p>${r.type === 'draw-game' ? '牌墙摸完，本局流局。' : `和牌：${handStr}`}</p>
    <table>${rows}<tr><td><b>合计${r.capped ? '（封顶）' : ''}</b></td><td><b>${r.total || 0} 番</b></td></tr></table>
    <p>本局收支：${deltas.deltas.map((v, i) => `${['我','下家','对家','上家'][i]} ${v > 0 ? '+' : ''}${v}`).join(' · ')}</p>`;
  $('result').classList.add('show');
  save();
}

/** 自动推进 AI，直到玩家可操作或终局 */
function advance() {
  clearTimeout(timer);
  if (m.phase === 'end') { render(); finish(); return; }
  if (m.phase === 'claim') {
    const mine = m.claim?.options.find((o) => o.seat === 0);
    if (mine) { render(); return; }
    aiStep(m); save(); timer = setTimeout(advance, 120); return;
  }
  if (m.phase === 'draw') { aiStep(m); save(); timer = setTimeout(advance, 120); return; }
  if (m.turn !== 0) { aiStep(m); save(); timer = setTimeout(advance, 170); return; }
  render();
}

$('hand').addEventListener('click', (e) => {
  const el = e.target.closest('.tile');
  if (!el || busy || m.phase !== 'discard' || m.turn !== 0) return;
  const i = Number(el.dataset.i);
  if (picked === i) {
    discard(m, 0, m.hands[0][i]);
    picked = null; suggestTile = null; save(); advance();
  } else { picked = i; render(); }
});
$('hintBtn').addEventListener('click', () => {
  if (!m || m.turn !== 0) return;
  const a = discardAdvice(m, 0);
  suggestTile = a.tile;
  $('msg').textContent = `建议打出：${tileName(a.tile)}（现物 / 孤张 / 花色倾向综合判断）`;
  render();
});
$('newBtn').addEventListener('click', () => {
  clearTimeout(timer);
  m = createMatch(Math.random, { allowChi: cfg.chi });
  picked = null; suggestTile = null;
  $('result').classList.remove('show');
  save(); render();
});
$('rclose').addEventListener('click', () => $('newBtn').click());
$('rulesBtn').addEventListener('click', () => { location.href = './rules.html'; });
for (const [id, key] of [['chi','chi'], ['listen','listen']]) {
  $(id).value = cfg[key] ? 'on' : 'off';
  $(id).addEventListener('change', (e) => {
    cfg[key] = e.target.value === 'on';
    try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch {}
    if (m) m.allowChi = cfg.chi;
    render();
  });
}

m = load() || createMatch(Math.random, { allowChi: cfg.chi });
m.allowChi = cfg.chi;
if (m.phase === 'claim' && !m.claim?.options.some((o) => o.seat === 0)) advance();
else render();

window.__MJ__ = {
  get match() { return m; },
  snapshot: () => ({ phase: m.phase, turn: m.turn, wall: m.wall.length,
    hand: sortHand(m.hands[0]).map(tileName), wait: m.phase === 'end' ? null :
      waitingTiles(m.hands[0], m.melds[0].length).map(tileName),
    result: m.result }),
  advice: () => discardAdvice(m, 0),
  tileCheck: tileCountCheck,
  newGame: () => $('newBtn').click(),
};
</script>
</body>
</html>
