<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111513">
<meta name="description" content="民间棋 —— 憋死牛（区字棋）、西瓜棋，两款可查规则的民间棋类，AI 对弈。">
<title>民间棋 · 山海拾遗</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111513'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23c8a96b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23b24b36'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{--gold:#c8a96b;--red:#b24b36;--ink:#111513;--paper:#ece6d8;--dim:#9a927f;--line:#3a3226;--win:#5cc08a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#1e211b 0%,var(--ink) 64%);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
.wrap{width:min(100%,480px)}
.head{text-align:center;margin-bottom:10px}.logo{font-size:22px;letter-spacing:.2em;margin:0;color:var(--gold)}.sub{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:4px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12px}
.modebar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.modebar .chip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;min-height:38px;padding:0 14px;font:inherit;font-size:12px;cursor:pointer}
.modebar .chip.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
.boardwrap{position:relative;width:min(100%,400px);margin:0 auto;aspect-ratio:1;background:#18201a;border:2px solid var(--line);border-radius:16px;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
.status{text-align:center;min-height:22px;font-size:12px;color:var(--dim);margin:10px 0}
.status.win{color:var(--win)}.status.lose{color:var(--red)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:12px;min-height:44px;padding:0 16px;font:inherit;font-size:13px;cursor:pointer;background:var(--gold);color:#1a1206;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:400}
.btn:disabled{opacity:.4;cursor:default}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
.sheet[hidden]{display:none}.panel{width:min(100%,440px);max-height:84vh;overflow:auto;background:linear-gradient(180deg,#242820,#111513);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{margin:0 0 8px;color:var(--gold);font-size:18px}.panel p,.panel li{font-size:12px;line-height:1.85;color:var(--dim)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:8px;min-height:38px;font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="logo">民间棋</h1><p class="sub">憋 死 牛 · 西 瓜 棋</p></div>
  <div class="bar"><span id="who">红方（你）先手</span><button class="btn ghost" id="btn-info" style="min-height:32px;padding:0 10px">规则</button></div>
  <div class="modebar"><button class="chip on" data-mode="niu">憋死牛</button><button class="chip" data-mode="gua">西瓜棋</button></div>
  <div class="boardwrap"><canvas id="cv"></canvas></div>
  <div class="status" id="status">点击己方棋子走子</div>
  <div class="controls"><button class="btn ghost" id="btn-undo">悔棋</button><button class="btn" id="btn-new">新局</button></div>
</div>
<div class="sheet" id="info" hidden><div class="panel">
  <h2 id="r-title">规则</h2><div id="r-body"></div>
  <p style="color:var(--gold);font-weight:600;margin-top:10px">AI 难度</p>
  <div class="seg" id="levelSeg"><button data-l="casual">休闲</button><button data-l="pro">老手</button></div>
  <div class="controls"><button class="btn" id="info-close">知道了</button></div>
</div></div>
<script type="module">
import { createGame, actionsAt, allActions, applyAction, aiAction, niuNeighbors, guaNeighbors } from './src/folk-chess.mjs';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let mode='niu',state=null,history=[],level='casual',selected=-1,validTargets=[],over=false;
const KEY='mg_folk.v1';
let save=(()=>{try{return Object.assign({level:'casual'},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{level:'casual'}}})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function resize(){const r=cv.parentElement.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',()=>{resize();draw()});
function newGame(){state=createGame(mode);history=[];selected=-1;validTargets=[];over=false;resize();draw();setStatus('红方（你）先手')}
function setStatus(t,c){$('status').textContent=t;$('status').className='status'+(c?' '+c:'')}
let W=0,H=0;
function layout(){
  W=cv.width/(Math.min(2,devicePixelRatio||1));H=cv.height/(Math.min(2,devicePixelRatio||1));
  const cx=W/2,cy=H/2;
  if(mode==='niu'){
    // 5点：4角+中心。角在正方形四角内缩，中心居中
    const m=Math.min(W,H)*0.22;
    return [[cx-m,cy-m],[cx,cy-m],[cx+m,cy-m],[cx+m,cy+m],[cx,cy+m],[cx-m,cy+m],[cx,cy]].map((p,i)=>({x:p[0],y:p[1]}));
  }
  // 西瓜：12圆点+中心。注意 folk-chess 里圆周索引 0..11 顺时针，中心12
  const pts=[],R=Math.min(W,H)*0.38;
  for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI/6;pts.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R})}
  pts.push({x:cx,y:cy});return pts;
}
function draw(){
  if(!state)return;resize();W=cv.width/Math.min(2,devicePixelRatio||1);H=cv.height/Math.min(2,devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  const pts=layout();
  // 连线
  ctx.strokeStyle='rgba(200,169,107,.35)';ctx.lineWidth=2;
  if(mode==='niu'){
    for(const [a,b] of [[0,1],[1,2],[2,5],[5,4],[4,3],[3,0],[0,6],[1,6],[2,6],[5,6],[4,6],[3,6]]){ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke()}
  }else{
    for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[(i+1)%12].x,pts[(i+1)%12].y);ctx.stroke();ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[12].x,pts[12].y);ctx.stroke()}
  }
  // 目标点
  for(const a of validTargets){const p=pts[a.to];ctx.fillStyle='rgba(92,192,138,.45)';ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill()}
  if(selected>=0){const p=pts[selected];ctx.strokeStyle='#c8a96b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,20,0,Math.PI*2);ctx.stroke()}
  // 棋子
  const R=Math.min(W,H)*0.055;
  state.board.forEach((q,i)=>{
    if(!q)return;const p=pts[i];
    ctx.fillStyle=q.side==='r'?'#b24b36':'#3b6ea8';ctx.strokeStyle='#0a0a08';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(p.x-R*0.3,p.y-R*0.3,R*0.4,0,Math.PI*2);ctx.fill();
  });
}
function clickAt(px,py){
  if(over||state.turn!=='r')return;
  const pts=layout();let hit=-1,best=1e9;
  pts.forEach((p,i)=>{const d=(p.x-px)**2+(p.y-py)**2;if(d<best){best=d;hit=i}});
  if(best>Math.min(W,H)*0.09**2*1e2){} // noop
  if(hit<0)return;
  if(selected<0){
    if(state.board[hit]&&state.board[hit].side==='r'){selected=hit;validTargets=actionsAt(state,hit).map(a=>a.to);draw()}
  }else{
    const act=actionsAt(state,selected).find(a=>a.to===hit);
    if(act){history.push(cloneS(state));state=applyAction(state,act);selected=-1;validTargets=[];
      if(state.status==='over'){over=true;setStatus(state.winner==='r'?'你赢了！':'AI 获胜',state.winner==='r'?'win':'lose');draw();return}
      draw();setTimeout(aiTurn,450);
    }else{
      if(state.board[hit]&&state.board[hit].side==='r'){selected=hit;validTargets=actionsAt(state,hit).map(a=>a.to);draw()}
      else{selected=-1;validTargets=[];draw()}
    }
  }
}
function aiTurn(){
  if(over||state.turn!=='b')return;
  const a=aiAction(state,level);if(!a)return;
  history.push(cloneS(state));state=applyAction(state,a);draw();
  if(state.status==='over'){over=true;setStatus(state.winner==='b'?'AI 获胜':'你赢了！',state.winner==='b'?'lose':'win');return}
  setStatus('红方（你）走子');
}
function cloneS(s){return JSON.parse(JSON.stringify(s))}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();clickAt(e.clientX-r.left,e.clientY-r.top)});
$('btn-new').addEventListener('click',newGame);
$('btn-undo').addEventListener('click',()=>{
  if(!history.length){setStatus('没有可悔的棋');return}
  // 悔 2 步（玩家+AI）回到玩家回合
  if(history.length>=2)state=history[history.length-2];else state=history[history.length-1];
  history=history.slice(0,Math.max(0,history.length-2));over=state.status==='over';selected=-1;validTargets=[];draw();setStatus('已悔棋');
});
document.querySelectorAll('.modebar .chip').forEach(c=>c.addEventListener('click',()=>{
  mode=c.dataset.mode;document.querySelectorAll('.modebar .chip').forEach(x=>x.classList.toggle('on',x===c));newGame();
}));
const RULES={
  niu:{title:'憋死牛（区字棋）',body:'<p>"区"字形棋盘共 5 个点：4 个角 + 中心。每人 2 子，红先。</p><p>沿连线每次走一格。<b>把对方两子全部堵死、使其一步都走不了即胜</b>；若对方还有一步能脱身，则不算死。</p><p>先占中心者先手。AI 分休闲 / 老手两档，支持悔棋。</p>'},
  gua:{title:'西瓜棋',body:'<p>圆形 12 个点 + 中心，共 13 点。每人 6 子，红先。</p><p>沿圆周或径向每次走一格。<b>夹吃</b>：己方两子夹住对方一子（或把对方逼出场边）即可吃掉。<b>吃光对方或让其无子可动即胜</b>。</p><p>AI 分休闲 / 老手两档，支持悔棋。</p>'},
};
$('btn-info').addEventListener('click',()=>{$('r-title').textContent=RULES[mode].title;$('r-body').innerHTML=RULES[mode].body;paintSeg();$('info').hidden=false});
$('info-close').addEventListener('click',()=>{$('info').hidden=true});
function paintSeg(){document.querySelectorAll('#levelSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===level))}
document.querySelectorAll('#levelSeg button').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.l;save.level=level;persist();paintSeg()}));
level=save.level||'casual';paintSeg();
window.__FOLK__={get state(){return state},newGame,aiTurn,clickAt,actionsAt,allActions,applyAction,
  simulate:function(n){let mx=0;for(let k=0;k<n;k++){let st=createGame(k%2?'gua':'niu'),steps=0;while(st.status==='playing'&&steps<80){const a=aiAction(st,'pro');if(!a)break;st=applyAction(st,a);steps++}mx=Math.max(mx,steps)}return mx}};
newGame();
</script>
</body>
</html>
