<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1a14">
<meta name="description" content="数独速递 —— 4×4 / 6×6 / 9×9 三级数独，计时挑战、提示与每日一题。">
<title>数独速递 · SUDOKU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1a14'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%235cc08a'%3E9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{--ac:#5cc08a;--bg:#0e1a14;--paper:#ece6da;--dim:#8fa79a;--line:#264634;--bad:#e0736b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#16301f 0%,var(--bg) 64%);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:18px 12px calc(22px + env(safe-area-inset-bottom))}
.wrap{width:min(100%,480px)}
.head{text-align:center;margin-bottom:12px}.logo{font-size:24px;letter-spacing:.28em;margin:0;color:var(--ac)}.sub{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:5px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:12px}
.bar b{color:var(--ac);font-size:15px}.bar .stat{display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:transparent;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;min-height:36px}
.tab.on{border-color:var(--ac);color:var(--ac);background:rgba(92,192,138,.1)}
.board{display:grid;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:10px;padding:2px;margin:0 auto;width:min(100%,396px);aspect-ratio:1}
.cell{background:#122319;border:none;color:var(--ac);font:inherit;font-size:clamp(16px,5vw,24px);font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0;padding:0}
.cell.given{color:var(--paper);background:#182c20}
.cell.sel{background:rgba(92,192,138,.28);outline:2px solid var(--ac);outline-offset:-2px}
.cell.peer{background:rgba(92,192,138,.09)}
.cell.same{background:rgba(92,192,138,.18)}
.cell.err{color:var(--bad)}
.cell.bd-r{border-right:2px solid var(--line)}.cell.bd-b{border-bottom:2px solid var(--line)}
.pad{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.num{border:1px solid var(--line);border-radius:10px;background:#15271c;color:var(--paper);font:inherit;font-size:17px;min-width:42px;min-height:44px;cursor:pointer}
.num:active{background:rgba(92,192,138,.25)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:12px;min-height:44px;padding:0 16px;font:inherit;font-size:13px;cursor:pointer;background:var(--ac);color:#0b1a11;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:400}
.msg{text-align:center;min-height:20px;font-size:12px;margin:8px 0;color:var(--dim)}
.msg.win{color:var(--ac)}
.done{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72)}
.done[hidden]{display:none}.done .inner{width:min(100%,360px);background:linear-gradient(180deg,#173023,#0e1a14);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.done h2{margin:0 0 12px;color:var(--ac);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="logo">SUDOKU</h1><p class="sub">数 独 速 递 · 计 时 挑 战</p></div>
  <div class="bar"><div class="stat"><span>最佳 <b id="best">—</b></span><span>用时 <b id="time">0:00</b></span><span>胜局 <b id="wins">0</b></span></div><button class="btn ghost" id="btn-info" style="min-height:32px;padding:0 10px">规则</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="board" id="board"></div>
  <div class="pad" id="pad"></div>
  <div class="msg" id="msg">选一个难度开始</div>
  <div class="controls">
    <button class="btn" id="btn-new">新局</button>
    <button class="btn ghost" id="btn-hint">提示</button>
    <button class="btn ghost" id="btn-erase">擦除</button>
    <button class="btn ghost" id="btn-daily">每日题</button>
  </div>
</div>
<div class="done" id="done" hidden><div class="inner"><h2>完成！</h2><p id="done-info" style="font-size:13px;color:var(--dim);line-height:1.8"></p><div class="controls"><button class="btn" id="done-again">再来一局</button></div></div></div>
<div class="done" id="info" hidden><div class="inner" style="text-align:left"><h2>玩法</h2><p id="info-body" style="font-size:12px;line-height:1.9;color:var(--dim)"></p><div class="controls"><button class="btn" id="info-close">知道了</button></div></div></div>
<script>
(function(){
'use strict';
var KEY='mg_sudoku.v1',$=function(i){return document.getElementById(i)};
var S=(function(){try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')return o}catch(e){}return {best:{},wins:0,runs:0,daily:null}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rng(seed){var x=seed>>>0||1;return function(){x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function seedFrom(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
var SIZES=[{n:4,w:2,h:2,key:'4'},{n:6,w:3,h:2,key:'6'},{n:9,w:3,h:3,key:'9'}];
var size=SIZES[0],puzzle=[],solution=[],grid=[],given=[],sel=-1,start=0,timer=null,daily=false;
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function makeSolution(n,rand){
  var b=new Array(n*n).fill(0);
  var boxOf=function(r,c){return Math.floor(r/size.h)*size.w+Math.floor(c/size.w)};
  function ok(r,c,v){for(var i=0;i<n;i++){if(b[r*n+i]===v||b[i*n+c]===v)return false}var br=Math.floor(r/size.h)*size.h,bc=Math.floor(c/size.w)*size.w;for(var i=0;i<size.h;i++)for(var j=0;j<size.w;j++)if(b[(br+i)*n+bc+j]===v)return false;return true}
  function fill(k){if(k===n*n)return true;var r=Math.floor(k/n),c=k%n,order=[];for(var v=1;v<=n;v++)order.push(v);for(var i=order.length-1;i>0;i--){var j=Math.floor(rand()*(i+1));var t=order[i];order[i]=order[j];order[j]=t}for(var v of order){if(ok(r,c,v)){b[k]=v;if(fill(k+1))return true;b[k]=0}}return false}
  fill(0);return b;
}
function makePuzzle(n,rand){
  var sol=makeSolution(n,rand),puz=sol.slice();
  var remove=Math.floor(n*n*0.55);
  var idx=[];for(var i=0;i<n*n;i++)idx.push(i);
  for(var i=idx.length-1;i>0;i--){var j=Math.floor(rand()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t}
  for(var k=0;k<remove;k++)puz[idx[k]]=0;
  return {puz:puz,sol:sol};
}
function newGame(isDaily){
  daily=!!isDaily;
  var seed=daily?seedFrom('sudoku-'+today()+'-'+size.key):(Date.now()^Math.random()*1e9|0);
  var r=makePuzzle(size.n,rng(seed));
  puzzle=r.puz;solution=r.sol;grid=puzzle.slice();given=puzzle.map(function(v){return v>0});sel=-1;
  start=Date.now();clearInterval(timer);timer=setInterval(function(){if(!doneFlag)$('time').textContent=fmt(Date.now()-start)},500);
  doneFlag=false;render();$('msg').className='msg';$('msg').textContent=daily?'每日题 · '+today():'进行中';
}
var doneFlag=false;
function render(){
  $('best').textContent=S.best[size.key]?fmt(S.best[size.key]):'—';$('wins').textContent=S.wins;
  var n=size.n;var board=$('board');board.style.gridTemplateColumns='repeat('+n+',1fr)';board.innerHTML='';
  var sr=sel>=0?Math.floor(sel/n):-1,sc=sel>=0?sel%n:-1;
  for(var i=0;i<n*n;i++){
    var r=Math.floor(i/n),c=i%n,cell=document.createElement('button');cell.className='cell'+(given[i]?' given':'');
    if(given[i]||grid[i])cell.textContent=grid[i]||'';
    else cell.textContent='';
    if(!given[i]&&grid[i]&&grid[i]!==solution[i])cell.classList.add('err');
    if(i===sel)cell.classList.add('sel');
    else if(sel>=0&&(r===sr||c===sc||boxOf(r,c)===boxOf(sr,sc)))cell.classList.add('peer');
    else if(sel>=0&&grid[i]&&grid[i]===grid[sel])cell.classList.add('same');
    if((c+1)%size.w===0&&c<n-1)cell.classList.add('bd-r');
    if((r+1)%size.h===0&&r<n-1)cell.classList.add('bd-b');
    cell.setAttribute('data-i',i);board.appendChild(cell);
  }
  $('tabs').innerHTML=SIZES.map(function(s){return '<button class="tab'+(s.key===size.key?' on':'')+'" data-k="'+s.key+'">'+s.n+'×'+s.n+'</button>'}).join('');
  Array.prototype.forEach.call($('tabs').children,function(b){b.addEventListener('click',function(){size=SIZES.filter(function(s){return s.key===b.getAttribute('data-k')})[0];newGame(false)})});
  $('pad').innerHTML=Array.from({length:n},function(_,k){return '<button class="num" data-v="'+(k+1)+'">'+(k+1)+'</button>'}).join('');
  Array.prototype.forEach.call($('pad').children,function(b){b.addEventListener('click',function(){input(+b.getAttribute('data-v'))})});
  Array.prototype.forEach.call(board.children,function(c){c.addEventListener('click',function(){sel=+c.getAttribute('data-i');render()})});
}
function boxOf(r,c){return Math.floor(r/size.h)+'_'+Math.floor(c/size.w)}
function input(v){
  if(sel<0||doneFlag)return;if(given[sel])return;
  grid[sel]=v;
  var okAll=true;for(var i=0;i<size.n*size.n;i++)if(grid[i]&&grid[i]!==solution[i]){okAll=false;break}
  if(okAll&&grid.every(function(x){return x>0})){
    doneFlag=true;clearInterval(timer);
    var t=Date.now()-start;S.runs++;S.wins++;if(daily)S.daily=today();
    if(!S.best[size.key]||t<S.best[size.key])S.best[size.key]=t;save();
    $('done-info').innerHTML=size.n+'×'+size.n+' 用时 <b style="color:var(--ac)">'+fmt(t)+'</b><br>'+(daily?'每日题已完成 ✓':'新纪录已保存');
    $('done').hidden=false;render();return;
  }
  render();
}
$('btn-new').addEventListener('click',function(){newGame(false)});
$('btn-daily').addEventListener('click',function(){newGame(true)});
$('btn-hint').addEventListener('click',function(){if(sel<0||doneFlag)return;grid[sel]=solution[sel];render()});
$('btn-erase').addEventListener('click',function(){if(sel<0||given[sel]||doneFlag)return;grid[sel]=0;render()});
$('done-again').addEventListener('click',function(){$('done').hidden=true;newGame(false)});
$('btn-info').addEventListener('click',function(){$('info-body').textContent='在空格填入 1~'+size.n+'，使每行、每列、每个粗线宫内的数字都不重复。点击格子选中，再点下方数字填入。「提示」会填入正确答案，「擦除」清空当前格。每日题按日期固定盘面，同一天所有人题目一致。';$('info').hidden=false});
$('info-close').addEventListener('click',function(){$('info').hidden=true});
newGame(false);render();
})();
</script>
</body>
</html>
