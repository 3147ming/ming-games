<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="搜打撤 —— 战术撤离类游戏：搜索、打击、撤离" />
    <!-- 内联空图标：避免移动端浏览器请求 /favicon.ico 产生一条 404 console 错误 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1219'/%3E%3Cpath d='M8 8h6v3H11v13h3v3H8z' fill='%23ffb020'/%3E%3C/svg%3E" />
    <title>搜打撤 · SEARCH / STRIKE / EXTRACT</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- 构建产物：node build.js 打包 src 全部模块为单个带哈希文件（详见 build.js），
         弱网下首屏只发 1 个 JS 请求，避开 surge keep-alive 5s 的多请求断连问题。 -->
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <!-- 启动加载占位：模块解析完成前先给反馈，避免白屏无提示 -->
    <div id="boot-loading">
      <div class="boot-spinner"></div>
      <div class="boot-text">加载中…</div>
    </div>
    <noscript>
      <p style="color: #d7dee8; font-family: sans-serif; padding: 24px">
        本游戏需要启用 JavaScript 才能运行。
      </p>
    </noscript>
    <!-- 启动看门狗：弱网下单个资源（如 three.js）被中断会让整个 ES 模块图不执行，页面停在白屏。
         这里检测启动标志，超时先自动重试一次，再失败则给出手动重试入口。 -->
    <script>
      (function () {
        var LIMIT = 8000;
        var autoUsed = false;
        try { autoUsed = sessionStorage.getItem('soudache_boot_retried') === '1'; } catch (e) {}
        function clearLoading() {
          var el = document.getElementById('boot-loading');
          if (el) el.parentNode.removeChild(el);
        }
        function show(msg) {
          clearLoading();
          var box = document.createElement('div');
          box.id = 'boot-watchdog';
          box.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#080c12;color:#d7dee8;font-family:system-ui,sans-serif;text-align:center;padding:24px';
          var t = document.createElement('div');
          t.textContent = msg;
          t.style.cssText = 'font-size:15px;line-height:1.7;max-width:32em';
          box.appendChild(t);
          var b = document.createElement('button');
          b.textContent = '重新加载';
          b.style.cssText = 'min-width:120px;min-height:48px;padding:12px 20px;font-size:16px;border-radius:10px;border:1px solid #2b3a4d;background:#16202c;color:#d7dee8';
          b.addEventListener('click', function () {
            try { sessionStorage.removeItem('soudache_boot_retried'); } catch (e) {}
            location.reload();
          });
          box.appendChild(b);
          document.body.appendChild(box);
        }
        setTimeout(function () {
          if (window.SOUDACHE) { clearLoading(); return; }
          if (!autoUsed) {
            try { sessionStorage.setItem('soudache_boot_retried', '1'); } catch (e) {}
            show('资源加载超时，正在自动重试…');
            setTimeout(function () { location.reload(); }, 800);
          } else {
            show('资源加载失败：网络较慢或连接被中断。请检查网络后重试。');
          }
        }, LIMIT);
      })();
    </script>
    <script type="module" src="./build/soudache.a5071fc8fa.js"></script>
  </body>
</html>
