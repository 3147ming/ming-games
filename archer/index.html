<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2A1740">
<meta name="description" content="影弓对决 —— 站桩拉弓，抛物线射箭，五章百波，能力三选一与四槽装备。">
<title>影弓对决 · SHADOW ARCHER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232A1740'/%3E%3Cpath d='M8 24 L24 8' stroke='%23FFC65C' stroke-width='3'/%3E%3Ccircle cx='9' cy='23' r='3' fill='%23E8464A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{
  --ac:#FFC65C; --ac2:#E8464A; --bg:#1B0F2E; --paper:#F3E9FF; --dim:#A996C4; --line:#3B2A58;
  --panel:rgba(22,12,38,.94); --card:rgba(48,30,78,.9); --ok:#7ED957; --cold:#6FD3FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120A20;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--paper);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:relative;width:100vw;height:100vh;max-width:1600px;margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#3A2260 0%,#1B0F2E 62%,#120A20 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:rgba(12,6,22,.86);
  backdrop-filter:blur(3px);padding:2.2vmin 2.4vmin}
.ov.on{display:flex}
h1,h2,h3,p{margin:0}
.title{display:flex;align-items:center;justify-content:space-between;gap:1.4vmin}
.title h2{font-size:clamp(18px,3.4vmin,30px);letter-spacing:.14em;color:var(--ac);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.title .sub{font-size:clamp(10px,1.5vmin,13px);color:var(--dim);letter-spacing:.2em}
.btn{border:none;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:#2A1740;background:var(--ac);
  padding:.9vmin 2vmin;font-size:clamp(12px,1.9vmin,16px);transition:transform .08s,filter .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:500}
.btn.red{background:var(--ac2);color:#fff}
.btn.sm{padding:.6vmin 1.4vmin;font-size:clamp(11px,1.6vmin,14px)}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:default}
/* ---- 主界面 ---- */
#ov-title{padding:0}
.menu{display:grid;grid-template-columns:15% 1fr 26%;height:100%}
.tabs{display:flex;flex-direction:column;gap:1.2vmin;padding:3vmin 1.2vmin;background:rgba(10,5,20,.55)}
.tab{writing-mode:vertical-rl;letter-spacing:.28em;padding:1.6vmin .8vmin;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-size:clamp(12px,1.9vmin,17px);color:var(--dim);cursor:pointer;text-align:center}
.tab.on{background:var(--ac);color:#2A1740;border-color:var(--ac);font-weight:700}
  .tab:hover{color:#fff}
.hero{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:1.4vmin 0 2.4vmin;min-height:0}
.hero .frame{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.hero .frame canvas{height:100%;width:auto;max-width:100%;object-fit:contain}
.hero .logo{position:absolute;top:1.2vmin;left:0;right:0;text-align:center;pointer-events:none}
.hero .logo b{display:block;font-size:clamp(20px,3.6vmin,34px);letter-spacing:.3em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero .logo small{font-size:clamp(9px,1.4vmin,12px);letter-spacing:.4em;color:var(--dim)}
.hero .name{font-size:clamp(16px,2.8vmin,26px);letter-spacing:.16em;color:#fff}
.hero .rec{font-size:clamp(10px,1.5vmin,13px);color:var(--dim);margin-top:.6vmin}
.side{display:flex;flex-direction:column;gap:1.4vmin;padding:3vmin 2vmin 3vmin 0;overflow-y:auto}
.chcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4vmin;cursor:pointer;
  display:flex;gap:1.2vmin;align-items:center;transition:border-color .15s,transform .1s}
.chcard:hover{border-color:var(--ac)}
.chcard.sel{border-color:var(--ac);background:rgba(255,198,92,.14)}
.chcard.lock{opacity:.45;cursor:not-allowed}
.chcard .no{font-size:clamp(16px,2.4vmin,22px);color:var(--ac);font-weight:800;width:2.4em;text-align:center}
.chcard b{display:block;font-size:clamp(12px,1.9vmin,16px)}
.chcard small{color:var(--dim);font-size:clamp(9px,1.35vmin,12px)}
.panelbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,900px);max-height:82%;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6);
  padding:2.4vmin;display:none;flex-direction:column;gap:1.6vmin;overflow:hidden;z-index:5}
.panelbox.on{display:flex}
.panelbox .ph{display:flex;justify-content:space-between;align-items:center}
.panelbox .ph b{font-size:clamp(14px,2.2vmin,19px);color:var(--ac);letter-spacing:.1em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.4vmin;overflow-y:auto;padding-right:.6vmin}
.itemcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.2vmin;font-size:clamp(10px,1.5vmin,13px)}
.itemcard .q{font-size:.95em;letter-spacing:.06em}
.itemcard b{display:block;margin:.3vmin 0}
.itemcard small{color:var(--dim);display:block;line-height:1.5}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vmin}
.slot{border:1px dashed var(--line);border-radius:10px;padding:1.2vmin;min-height:11vmin;font-size:clamp(10px,1.5vmin,13px)}
.slot b{display:block;color:var(--ac);margin-bottom:.5vmin}
.slot.empty{color:var(--dim)}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vmin;overflow-y:auto}
.branch{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.2vmin}
.branch h4{margin:0 0 1vmin;font-size:clamp(12px,1.8vmin,15px);color:var(--ac);text-align:center;letter-spacing:.1em}
.node{border-radius:8px;padding:.8vmin;margin-bottom:.8vmin;background:rgba(0,0,0,.22);font-size:clamp(9px,1.4vmin,12px);
  display:flex;justify-content:space-between;gap:.6vmin;align-items:center}
.node.on{background:rgba(126,217,87,.16);border:1px solid rgba(126,217,87,.5)}
.node small{color:var(--dim)}
/* ---- 模式 / 技能 / 结算 ---- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;text-align:center}
#ov-result .center,#ov-pause .center{background:rgba(26,14,46,.9);border:1px solid var(--line);border-radius:18px;
  flex:0 0 auto;padding:3.2vmin 4vmin;width:min(640px,84%);max-width:74vmin;margin:auto;box-sizing:border-box;
  box-shadow:0 18px 60px rgba(0,0,0,.5)}
#ov-result .btn{min-width:15vmin}
.modes{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.mode{width:clamp(160px,26vmin,240px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2vmin;
  cursor:pointer;text-align:left}
.mode.on{border-color:var(--ac);background:rgba(255,198,92,.12)}
.mode b{display:block;font-size:clamp(14px,2.1vmin,18px);color:var(--ac)}
.mode small{color:var(--dim);font-size:clamp(10px,1.5vmin,13px);line-height:1.7;display:block;margin-top:.8vmin}
.cards{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.skillcard{width:clamp(150px,24vmin,220px);background:linear-gradient(180deg,rgba(70,44,112,.96),rgba(38,22,62,.96));
  border:1px solid var(--line);border-radius:14px;padding:1.8vmin;cursor:pointer;text-align:center;transition:transform .1s,border-color .15s}
.skillcard:hover{transform:translateY(-3px);border-color:var(--ac)}
.skillcard .cat{font-size:clamp(9px,1.3vmin,11px);letter-spacing:.16em;color:var(--dim)}
.skillcard b{display:block;margin:.8vmin 0;font-size:clamp(14px,2.1vmin,18px)}
.skillcard p{font-size:clamp(10px,1.5vmin,13px);color:#D9C9F2;line-height:1.6;min-height:4.4em}
.skillcard .lv{color:var(--ac);font-size:clamp(10px,1.4vmin,12px)}
.rlist{display:flex;flex-wrap:wrap;gap:.7vmin;justify-content:center;max-width:70%;max-height:26vmin;overflow-y:auto}
.rlist span{font-size:clamp(9px,1.3vmin,12px);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;padding:.3vmin .8vmin}
.big{font-size:clamp(22px,4.4vmin,40px);color:var(--ac);letter-spacing:.1em;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hint{color:var(--dim);font-size:clamp(10px,1.5vmin,13px);line-height:1.8}
.row{display:flex;gap:1.4vmin;flex-wrap:wrap;justify-content:center}
.tag{font-size:clamp(9px,1.3vmin,12px);border:1px solid var(--line);border-radius:6px;padding:.3vmin .8vmin;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-aspect-ratio:1/1){
  .menu{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .tabs{flex-direction:row;padding:1.4vmin;order:2}
  .tab{writing-mode:horizontal-tb;flex:1;padding:1vmin .4vmin;letter-spacing:.1em}
  .side{flex-direction:row;overflow-x:auto;padding:1.4vmin;order:3}
  .chcard{min-width:150px}
  .hero{order:1;padding:0}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1200" height="540"></canvas>

  <!-- 主界面 -->
  <div class="ov on" id="ov-title">
    <div class="menu">
      <div class="tabs">
        <div class="tab" data-tab="shop">商<br>店</div>
        <div class="tab" data-tab="gear">装<br>备</div>
        <div class="tab on" data-tab="fight">战<br>斗</div>
        <div class="tab" data-tab="talent">天<br>赋</div>
        <div class="tab" data-tab="set">设<br>置</div>
      </div>
      <div class="hero">
        <div class="logo"><b>影弓对决</b><small>SHADOW ARCHER</small></div>
        <div class="frame"><canvas id="hero-cv" width="360" height="420" style="max-height:100%"></canvas></div>
        <div class="name">影弓 · 无名弓手</div>
        <div class="rec" id="hero-rec">最高 第 1 章 · 0 层</div>
        <div class="row" style="margin-top:1.4vmin">
          <button class="btn" id="btn-start">开始战斗</button>
          <button class="btn ghost sm" id="btn-mode">模式：普通</button>
        </div>
      </div>
      <div class="side" id="chapter-list"></div>
    </div>

    <div class="panelbox" id="panel-shop">
      <div class="ph"><b>商店 · 装备铺</b><button class="btn ghost sm" data-close="1">关闭</button></div>
      <div class="hint" id="shop-hint">花金币买随机装备。三件同名同品质自动合成升一档。</div>
      <div class="row"><button class="btn sm" id="shop-buy">购买装备（120 金币）</button>
        <button class="btn ghost sm" id="shop-buy10">十连（1080）</button></div>
      <div class="pgrid" id="shop-list"></div>
    </div>

    <div class="panelbox" id="panel-gear">
      <div class="ph"><b>装备 · 四槽</b><button class="btn ghost sm" data-close="1">关闭</button></div>
      <div class="slots" id="gear-slots"></div>
      <div class="hint" id="gear-hint">盾牌只挡正面，头盔只挡上方；披风加生命上限。品质决定等级上限。</div>
      <div class="pgrid" id="gear-list"></div>
    </div>

    <div class="panelbox" id="panel-talent">
      <div class="ph"><b>天赋 · 三系</b><button class="btn ghost sm" data-close="1">关闭</button></div>
      <div class="hint" id="talent-hint">剩余天赋点 0。每通关 1 章 +2 点，每击败 1 名章节首领 +1 点。</div>
      <div class="tree" id="talent-tree"></div>
    </div>

    <div class="panelbox" id="panel-set">
      <div class="ph"><b>设<br>置</b><button class="btn ghost sm" data-close="1">关闭</button></div>
      <div class="hint" id="set-hint">声音开关会写入存档。清空存档不可恢复。</div>
      <div class="row"><button class="btn sm" id="set-mute">声音：开</button>
        <button class="btn ghost sm" id="set-reset">清空存档</button></div>
    </div>
  </div>

  <!-- 模式选择 -->
  <div class="ov" id="ov-mode">
    <div class="title"><h2>选择模式</h2><button class="btn ghost sm" id="mode-back">返回</button></div>
    <div class="center">
      <div class="modes" id="mode-list"></div>
      <div class="hint" id="mode-hint"></div>
      <button class="btn" id="mode-go">进入战斗</button>
    </div>
  </div>

  <!-- 能力三选一 -->
  <div class="ov" id="ov-skill">
    <div class="center">
      <div class="big">点击图标学习新的能力</div>
      <div class="cards" id="skill-cards"></div>
      <div class="hint">点击「换一批」可以更换列表中的能力（每局首次免费，之后 20 金币）</div>
      <div class="row"><button class="btn" id="skill-reroll" style="background:#FFD34D">换一批</button></div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="ov" id="ov-result">
    <div class="center">
      <div class="big" id="r-title">本章结束</div>
      <div class="hint" id="r-sub"></div>
      <div class="rlist" id="r-skills"></div>
      <div class="hint" id="r-loot"></div>
      <div class="row">
        <button class="btn red" id="r-revive">复活（1 次）</button>
        <button class="btn" id="r-retry">重试本章</button>
        <button class="btn ghost" id="r-home">回主界面</button>
      </div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="ov" id="ov-pause">
    <div class="center">
      <div class="big">暂停</div>
      <div class="hint" id="p-info"></div>
      <div class="row"><button class="btn" id="p-resume">继续</button>
        <button class="btn ghost" id="p-quit">退出本章</button></div>
    </div>
  </div>
</div>
<script>
(function () {
'use strict';
/* =========================================================================
 * 影弓对决 · 站桩拉弓（逻辑画布 1200×540，与参考视频 20:9 对齐）
 * 结构：CONFIG(数值) → 存档 → 舞台/绘制 → 输入 → 敌人 AI → 战斗循环 → 界面
 * ========================================================================= */
var W = 1200, H = 540;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var GROUND = 432;
var PLAYER_X = 205;
var PLAYER_H = 68;
var BOW = { x: PLAYER_X + 26, y: GROUND - 58 };

var CONFIG = {
  gravity: 900,
  speedMin: 520, speedMax: 760,
  dragMin: 24, dragMax: 164,
  dotsMin: 4, dotsMax: 15,
  dotGap: 13, dotR: 3.5, dotsMaxLen: 200,
  cooldown: 0.35,
  walkMin: 55, walkMax: 90,
  stopX: 290, spawnX: 1240,
  plankY: [170, 215, 255],
  waveCount: 20,
  chapters: [
    { name: '夜隐沙漠', sky: ['#4B2C7C', '#33205A'], ridge: ['#3E2668', '#2F1C4D'], ground: '#2A1740', accent: '#FFC65C' },
    { name: '风蚀谷',   sky: ['#3C2A78', '#2A1C56'], ridge: ['#33246A', '#241847'], ground: '#241640', accent: '#B9A6FF' },
    { name: '紫松林',   sky: ['#2C356E', '#1F2450'], ridge: ['#2A3568', '#1B2044'], ground: '#1B1B3C', accent: '#7ED9C3' },
    { name: '遗忘工厂', sky: ['#4A2338', '#301426'], ridge: ['#43203A', '#2A0F22'], ground: '#260E1E', accent: '#FF9C6B' },
    { name: '龙岭迷窟', sky: ['#3A1620', '#220A12'], ridge: ['#35121C', '#1C060C'], ground: '#18050A', accent: '#FF6B6B' }
  ]
};

/* ---------- 30 项能力（四类，照原版） ---------- */
var CAT = { atk: '攻击', def: '防御', sum: '召唤', buf: '增益' };
var SKILLS = [
  /* 攻击 13 */
  { id: 'split',   cat: 'atk', name: '分裂',       desc: '命中后向两侧溅出 2 支小箭', max: 3, val: function(l){ return 2; } },
  { id: 'multi',   cat: 'atk', name: '连续投掷',   desc: '每次射击追加 1 支箭', max: 3, val: function(l){ return l; } },
  { id: 'rate',    cat: 'atk', name: '射速',       desc: '射击冷却 −12%', max: 3, val: function(l){ return 1 - 0.12 * l; } },
  { id: 'giant',   cat: 'atk', name: '巨大化',     desc: '箭矢体积与伤害 +18%', max: 3, val: function(l){ return 1 + 0.18 * l; } },
  { id: 'bounce',  cat: 'atk', name: '反弹',       desc: '箭矢落地后弹起一次', max: 3, val: function(l){ return l; } },
  { id: 'ricochet',cat: 'atk', name: '弹射',       desc: '命中后跳向附近敌人', max: 3, val: function(l){ return l; } },
  { id: 'execute', cat: 'atk', name: '秒杀',       desc: '对残血敌人一击必杀（≤12% 血）', max: 3, val: function(l){ return 0.08 + 0.04 * l; } },
  { id: 'explode', cat: 'atk', name: '爆炸',       desc: '命中产生小范围爆炸', max: 3, val: function(l){ return 26 + 10 * l; } },
  { id: 'fury',    cat: 'atk', name: '狂怒',       desc: '血量越低伤害越高（最多 +45%）', max: 3, val: function(l){ return 0.15 * l; } },
  { id: 'crit',    cat: 'atk', name: '暴击',       desc: '暴击率 +12%，暴击 1.6 倍', max: 3, val: function(l){ return 0.12 * l; } },
  { id: 'scatter', cat: 'atk', name: '散射',       desc: '一次射出 3 支扇形箭', max: 3, val: function(l){ return l; } },
  { id: 'pierce',  cat: 'atk', name: '穿透',       desc: '箭矢可多穿透 1 个目标', max: 3, val: function(l){ return l; } },
  { id: 'headshot',cat: 'atk', name: '一击爆头',   desc: '对空中单位伤害 +25%', max: 3, val: function(l){ return 0.25 * l; } },
  /* 防御 7 */
  { id: 'machine', cat: 'def', name: '生命机器',   desc: '最大生命 +18，并立即回复', max: 3, val: function(l){ return 18 * l; } },
  { id: 'regen',   cat: 'def', name: '缓慢回复',   desc: '每秒回复 0.8 生命', max: 3, val: function(l){ return 0.8 * l; } },
  { id: 'armor',   cat: 'def', name: '振奋铠甲',   desc: '受到伤害 −10%', max: 3, val: function(l){ return 1 - 0.1 * l; } },
  { id: 'thorns',  cat: 'def', name: '荆棘锁链',   desc: '被近战攻击时反弹 6 伤害', max: 3, val: function(l){ return 6 * l; } },
  { id: 'revive',  cat: 'def', name: '复活',       desc: '阵亡时原地满血复活一次', max: 2, val: function(l){ return l; } },
  { id: 'firstaid',cat: 'def', name: '急救',       desc: '每波结束回复 12% 生命', max: 3, val: function(l){ return 0.12 * l; } },
  { id: 'dodge',   cat: 'def', name: '闪避',       desc: '12% 概率闪避伤害', max: 3, val: function(l){ return 0.12 * l; } },
  /* 召唤 4 */
  { id: 'shark',   cat: 'sum', name: '鲨鱼人',     desc: '每 8 秒召唤鲨鱼人冲撞最前敌人', max: 3, val: function(l){ return l; } },
  { id: 'turncoat',cat: 'sum', name: '变心',       desc: '命中的敌人有概率倒戈 6 秒', max: 2, val: function(l){ return 0.12 * l; } },

function irnd(a, b) { return Math.floor(rnd(a, b + 1)); }

/* ---------- 音效 ---------- */
var AC = null, muted = !!save.muted;
function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  return AC;
}
function beep(freq, dur, type, vol, slideTo) {
  if (muted) return;
  var a = actx(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), a.currentTime + dur);
    g.gain.value = vol || 0.06;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
  } catch (e) {}
}

var stage = el('stage'), cv = el('cv'), ctx = cv.getContext('2d');
var DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

function fitStage() {
  var r = stage.getBoundingClientRect();
  var s = Math.min(r.width / W, r.height / H);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', function () { setTimeout(fitStage, 120); });
fitStage();

function toLogical(cx, cy) {
  var r = cv.getBoundingClientRect();
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}

/* ---- 背景（按章节缓存一张） ---- */
var bgCache = null, bgCacheArch = -1;
function chapter() { return CONFIG.chapters[clamp((G ? G.arch : 0), 0, 4)]; }

function ridge(g, y0, color, seed, amp, step) {
  g.fillStyle = color; g.beginPath(); g.moveTo(-20, H);
  var s = seed;
  function rr() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
  var x = -20; g.lineTo(-20, y0 + amp * 0.4);
  while (x < W + 30) {
    var w = step * (0.6 + rr() * 0.9);
    var peak = y0 - rr() * amp;
    g.lineTo(x + w * 0.42, peak);
    x += w; g.lineTo(x, y0 + amp * (0.25 + rr() * 0.4));
  }
  g.lineTo(W + 30, H); g.closePath(); g.fill();
}

function buildBg(arch) {
  var ch = CONFIG.chapters[arch];
  var c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  var g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  var sky = g.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, ch.sky[0]); sky.addColorStop(1, ch.sky[1]);
  g.fillStyle = sky; g.fillRect(0, 0, W, GROUND);

  /* 星点 */
  var s = 17 + arch * 131;
  function rr() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
  for (var i = 0; i < 46; i++) {
    var x = rr() * W, y = rr() * GROUND * 0.72;
    g.globalAlpha = 0.12 + rr() * 0.42;
    g.fillStyle = '#E8D9FF';
    g.beginPath(); g.arc(x, y, 0.7 + rr() * 1.4, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;

  /* 远山、近山 */
  ridge(g, GROUND - 108, ch.ridge[0], 91 + arch * 7, 74, 210);
  ridge(g, GROUND - 46, ch.ridge[1], 47 + arch * 13, 52, 150);

  /* 地面带 */
  g.fillStyle = ch.ground; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = 'rgba(255,255,255,.09)'; g.fillRect(0, GROUND, W, 2);
  var s2 = 61 + arch * 37;
  function r2() { s2 = (s2 * 9301 + 49297) % 233280; return s2 / 233280; }
  for (var k = 0; k < 90; k++) {
    var px = r2() * W, py = GROUND + 12 + r2() * (H - GROUND - 20);
    g.globalAlpha = 0.16 + r2() * 0.3;
    g.fillStyle = r2() > 0.5 ? '#8E77B4' : '#4A2F6E';
    g.fillRect(px, py, 1 + r2() * 3, 1 + r2() * 2);
  }
  g.globalAlpha = 1;

  /* 地面装饰：仙人掌 / 枯树 / 石头 */
  var s3 = 203 + arch * 19;
  function r3() { s3 = (s3 * 9301 + 49297) % 233280; return s3 / 233280; }
  for (var d = 0; d < 9; d++) {
    var dx = 40 + r3() * (W - 80), dy = GROUND - 2, kind = d % 3;
    g.fillStyle = 'rgba(12,6,22,.55)';
    if (kind === 0) {
      var hh = 34 + r3() * 26;
      g.fillRect(dx - 3, dy - hh, 6, hh);
      g.fillRect(dx - 12, dy - hh * 0.72, 5, hh * 0.3);
      g.fillRect(dx - 12, dy - hh * 0.72, 14, 5);
      g.fillRect(dx + 8, dy - hh * 0.85, 5, hh * 0.26);
      g.fillRect(dx + 3, dy - hh * 0.85, 10, 5);
    } else if (kind === 1) {
      var th = 40 + r3() * 30;
      g.fillRect(dx - 2, dy - th, 4, th);
      g.fillRect(dx - 14, dy - th + 6, 14, 3);
      g.fillRect(dx + 2, dy - th + 14, 12, 3);
    } else {
      g.beginPath(); g.ellipse(dx, dy - 6, 14 + r3() * 10, 7, 0, 0, 6.284); g.fill();
    }
  }
  /* 骨头装饰 */
  g.strokeStyle = 'rgba(190,175,220,.22)'; g.lineWidth = 3;
  for (var b = 0; b < 4; b++) {
    var bx = 120 + r3() * (W - 240), by = GROUND + 30 + r3() * 40;
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + 16, by + 6); g.stroke();
    g.beginPath(); g.arc(bx - 3, by - 2, 3, 0, 6.284); g.stroke();
    g.beginPath(); g.arc(bx + 19, by + 8, 3, 0, 6.284); g.stroke();
  }
  bgCache = c; bgCacheArch = arch;
}

/* ---- 火柴人（玩家） ---- */
function drawArcher(g, x, y, o) {
  o = o || {};
  var lean = o.lean || 0, bow = o.bow || 0, ang = o.ang === undefined ? -0.2 : o.ang;
  var sc = o.scale || 1, flash = o.flash || 0;
  g.save();
  g.translate(x, y); g.scale(sc, sc);
  g.rotate(lean);
  /* 披风 */
  var sw = Math.sin((o.t || 0) * 6) * 3;
  g.fillStyle = flash ? '#FF8C8C' : '#D93A3A';
  g.beginPath();
  g.moveTo(-4, -52);
  g.quadraticCurveTo(-26 + bow * 8, -44, -40 - bow * 12 + sw, -10 - bow * 6);
  g.quadraticCurveTo(-26, -20, -10, -22);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(0,0,0,.18)';
  g.beginPath(); g.moveTo(-10, -22); g.quadraticCurveTo(-30, -18, -40 - bow * 12 + sw, -10 - bow * 6);
  g.quadraticCurveTo(-24, -12, -10, -16); g.closePath(); g.fill();

  var skin = flash ? '#FFDCDC' : '#120B22';
  g.strokeStyle = skin; g.fillStyle = skin;
  g.lineWidth = 5; g.lineCap = 'round';
  /* 腿 */
  g.beginPath(); g.moveTo(0, -30); g.lineTo(-7, -14); g.lineTo(-11, 0); g.stroke();
  g.beginPath(); g.moveTo(0, -30); g.lineTo(7, -14); g.lineTo(9, 0); g.stroke();
  /* 躯干 */
  g.beginPath(); g.moveTo(0, -30); g.lineTo(-1 - bow * 4, -52); g.stroke();
  /* 头 */
  g.beginPath(); g.arc(-2 - bow * 5, -60, 7.5, 0, 6.284); g.fill();
  /* 弓 */
  g.save();
  g.translate(26, -58);
  g.rotate(ang);
  g.strokeStyle = '#8A5A2B'; g.lineWidth = 4;
  g.beginPath(); g.arc(0, 0, 21, -1.15, 1.15); g.stroke();
  /* 弦：后拉幅度 = bow */
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1.4;
  var tipY = 21 * Math.sin(1.15), tipX = 21 * Math.cos(1.15);
  g.beginPath(); g.moveTo(tipX, -tipY);
  g.lineTo(-bow * 16, 0);
  g.lineTo(tipX, tipY); g.stroke();
  if (bow > 0.02) {
    /* 搭在弦上的箭 */
    g.strokeStyle = '#F0D6A8'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-bow * 16, 0); g.lineTo(20, 0); g.stroke();
    g.fillStyle = '#FFE9B0';
    g.beginPath(); g.moveTo(26, 0); g.lineTo(18, -3.4); g.lineTo(18, 3.4); g.closePath(); g.fill();
  }
  g.restore();
  /* 手臂 */
  g.strokeStyle = skin; g.lineWidth = 5;
  g.beginPath(); g.moveTo(-1, -50); g.lineTo(14, -54); g.lineTo(26, -58); g.stroke();
  g.beginPath(); g.moveTo(-1, -50); g.lineTo(6 - bow * 12, -52 + bow * 4); g.stroke();
  g.restore();
}

/* ---- 敌兵 ---- */
function drawGrunt(g, e, t) {
  var x = e.x, y = GROUND, sc = e.scale || 1;
  var bob = e.mode === 'walk' ? Math.sin(t * 8 + e.seed) * 1.6 : 0;
  g.save(); g.translate(x, y - Math.abs(bob)); g.scale(sc, sc);
  var col = e.color || '#150C26';
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 5; g.lineCap = 'round';
  var swing = e.mode === 'attack' ? Math.sin(e.atkT * 9) * 10 : Math.sin(t * 6 + e.seed) * 5;
  g.beginPath(); g.moveTo(0, -28); g.lineTo(-7 + swing * 0.3, -13); g.lineTo(-10, 0); g.stroke();
  g.beginPath(); g.moveTo(0, -28); g.lineTo(7 - swing * 0.3, -13); g.lineTo(10, 0); g.stroke();
  g.beginPath(); g.moveTo(0, -28); g.lineTo(1, -48); g.stroke();
  g.beginPath(); g.arc(1, -56, 7, 0, 6.284); g.fill();
  /* 帽子 */
  g.fillStyle = e.kind === 'archer' ? '#3A2456' : '#2A1738';
  g.beginPath(); g.moveTo(-8, -60); g.lineTo(10, -60); g.lineTo(1, -68); g.closePath(); g.fill();
  /* 武器 */
  g.save(); g.translate(12, -40); g.rotate(-0.5 + swing * 0.03);
  if (e.kind === 'archer') {
    g.strokeStyle = '#6B4C2A'; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, 14, -1.2, 1.2); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(5, -13); g.lineTo(0, 0); g.lineTo(5, 13); g.stroke();
  } else if (e.kind === 'shield') {
    g.fillStyle = '#4B3A72'; g.strokeStyle = '#7C63A8'; g.lineWidth = 2;
    g.beginPath(); g.roundRect ? g.roundRect(-6, -16, 14, 32, 5) : g.rect(-6, -16, 14, 32);
    g.fill(); g.stroke();
  } else if (e.kind === 'boss') {
    g.fillStyle = '#B03A4A'; g.fillRect(-3, -26, 6, 52);
    g.fillStyle = '#E85D6E'; g.beginPath(); g.moveTo(0, -34); g.lineTo(-9, -20); g.lineTo(9, -20); g.closePath(); g.fill();
  } else {
    g.strokeStyle = '#5A4170'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, 10); g.lineTo(0, -22); g.stroke();
    g.fillStyle = '#C9D4E8'; g.beginPath(); g.moveTo(-5, -26); g.lineTo(5, -26); g.lineTo(0, -36); g.closePath(); g.fill();
  }
  g.restore();
  g.restore();
  /* 血条 */
  if (e.hp < e.maxHp - 0.01) {
    var bw = 42 * sc, bx = x - bw / 2, by = y - 76 * sc;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(bx, by, bw, 5);
    g.fillStyle = e.kind === 'boss' ? '#FF5C6C' : '#8FE36B';
    g.fillRect(bx + 1, by + 1, (bw - 2) * clamp(e.hp / e.maxHp, 0, 1), 3);
  }
}

function drawAirArcher(g, e, t) {

function drawArrow(g, a) {
  var sp = Math.hypot(a.vx, a.vy);
  var ang = Math.atan2(a.vy, a.vx);
  g.save(); g.translate(a.x, a.y); g.rotate(ang);
  var len = 26;
  /* 尾焰 */
  var tail = g.createLinearGradient(-len - 40, 0, -len, 0);
  if (a.foe) { tail.addColorStop(0, 'rgba(255,80,80,0)'); tail.addColorStop(1, 'rgba(255,90,90,.75)'); }
  else { tail.addColorStop(0, 'rgba(255,120,40,0)'); tail.addColorStop(1, 'rgba(255,190,70,.95)'); }
  g.fillStyle = tail;
  g.beginPath(); g.moveTo(-len, 0); g.lineTo(-len - (a.foe ? 34 : 40), 2.4);
  g.lineTo(-len - (a.foe ? 34 : 40), -2.4); g.lineTo(-len, 0); g.fill();
  /* 杆 */
  g.strokeStyle = a.foe ? '#D8C0E8' : '#EBD3A6'; g.lineWidth = 2.6;
  g.beginPath(); g.moveTo(-len, 0); g.lineTo(0, 0); g.stroke();
  /* 箭头 */
  g.fillStyle = a.foe ? '#FF8A8A' : '#FFE7B0';
  g.beginPath(); g.moveTo(6, 0); g.lineTo(-2, -4); g.lineTo(-2, 4); g.closePath(); g.fill();
  g.restore();
}

function drawSmoke(g, x, y, t, scale) {
  for (var i = 0; i < 8; i++) {
    var a = (i / 8) * 6.284 + t * 2;
    var r = (16 + t * 90) * scale;
    var px = x + Math.cos(a) * r * 0.8, py = y + Math.sin(a) * r * 0.5;
    g.globalAlpha = clamp(1 - t / 0.3, 0, 1) * 0.75;
    g.fillStyle = '#F2ECFF';
    g.beginPath(); g.arc(px, py, (10 + t * 26) * scale, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;
}
/* =========================================================================
 * 局内状态
 * ========================================================================= */
var G = null;
var UI = { draw: null, time: 0, hurtFlash: 0, shake: 0, paused: false };
var heroT = 0;

function newRun(arch, mode) {
  var s = stats();
  return {
    arch: arch, mode: mode || save.mode, wave: 1, waveTotal: mode === 'endless' ? 10 : CONFIG.waveCount,
    enemies: [], arrows: [], parts: [], texts: [], coins: 20, xp: 0, lvl: 1, xpNeed: 10,
    hp: s.maxHp, shield: 0, shieldMax: s.shieldMax,
    skills: {}, kills: 0, phase: 'fight', time: 0, spawnQueue: [], spawnT: 0,
    waveGap: 0.8, bossDone: false, rerolls: 0, reviveUsed: false, reviveCount: 0,
    pendingChoices: [], statTick: 0, charge: 0, ult: 0, heroCool: 0, deathT: 0,
    flashT: 0, healAcc: 0
  };
}

function skillLv(id) { return (G && G.skills[id]) || 0; }
function has(id) { return skillLv(id) > 0; }

function stats() {
  var atk = 11, hp = 120, shieldMax = 0, cd = CONFIG.cooldown, crit = 0.05, top = 0, front = 0;
  for (var k in save.loadout) {
    var uid = save.loadout[k];
    if (uid === null || uid === undefined) continue;
    var it = findItem(uid); if (!it) continue;
    var per = 0, base = ITEMS.filter(function (x) { return x.id === it.base; })[0];
    if (!base) continue;
    per = base.per * (1 + it.q * 0.55) + it.level * (1 + it.q * 0.4);
    if (it.base === 'bow') atk += per;
    else if (it.base === 'cloak') hp += per;
    else if (it.base === 'helm') top += per;
    else if (it.base === 'shield') front += per;
    (it.mods || []).forEach(function (m) {
      if (m.stat === 'atk') atk += m.value;
      else if (m.stat === 'hp') hp += m.value * 4;
      else if (m.stat === 'crit') crit += m.value;
      else if (m.stat === 'cd') cd *= (1 - m.value);
    });
  }
  hp += (save.talents.def || 0) * 3;
  atk += (save.talents.atk || 0) * 1.5;
  shieldMax += (save.talents.def || 0) * 1.6;
  if (G) {
    atk *= (1 + (skillLv('giant') * 0.18));
    cd *= (has('rate') ? SKILLS.filter(function (s) { return s.id === 'rate'; })[0].val(skillLv('rate')) : 1);
    crit += skillLv('crit') * 0.12 + (save.talents.atk >= 3 ? 0.05 : 0);
    if (has('machine')) hp += 18 * skillLv('machine');
    if (save.talents.atk >= 1) atk += 4;
  }
  cd = Math.max(0.12, cd - (save.talents.atk >= 4 ? 0.02 : 0));
  return { atk: atk, maxHp: hp, shieldMax: shieldMax, cd: cd, crit: crit, top: top, front: front };
}

/* ---------- 输入：拉弓 ---------- */
function onDown(ev) {
  if (!G || G.phase !== 'fight' || UI.paused) return;
  if (hudTap(ev)) return;
  var q = toLogical(ev.clientX, ev.clientY);
  UI.draw = { sx: q.x, sy: q.y, cx: q.x, cy: q.y, power: 0, dir: { x: 1, y: 0 }, t: 0, showed: 0 };
  if (G.heroCool <= 0) SFX.bow();
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
}
function onMove(ev) {
  if (!UI.draw || !G) return;
  var q = toLogical(ev.clientX, ev.clientY);
  UI.draw.cx = q.x; UI.draw.cy = q.y;
  var dx = q.x - UI.draw.sx, dy = q.y - UI.draw.sy;
  var d = Math.hypot(dx, dy);
  UI.draw.power = clamp((d - CONFIG.dragMin) / (CONFIG.dragMax - CONFIG.dragMin), 0, 1);
  /* 方向：从指针指向弓（后拉射出） */
  var ax = BOW.x - q.x, ay = BOW.y - q.y;
  var ang = Math.atan2(ay, ax);
  if (ang > Math.PI / 2) ang -= Math.PI; else if (ang < -Math.PI / 2) ang += Math.PI;
  ang = clamp(ang, -1.25, 0.42);
  UI.draw.dir = { x: Math.cos(ang), y: Math.sin(ang) };
  UI.draw.d = d;
}
function onUp(ev) {
  if (!UI.draw || !G) return;
  var d = UI.draw.d || 0;
  var wasCd = G.heroCool > 0;
  var p = UI.draw; UI.draw = null;
  if (d < CONFIG.dragMin) { G.heroCool = Math.min(G.heroCool, 0.06); return; }  /* 误触：收弓不出箭 */
  if (wasCd) return;                                                             /* 冷却中不叠箭 */
  fireBow(p.dir, p.power);
}

function fireBow(dir, power) {
  var sp = CONFIG.speedMin + (CONFIG.speedMax - CONFIG.speedMin) * power;
  var st = stats();
  G.heroCool = st.cd;
  var n = 1 + skillLv('multi');
  var fan = skillLv('scatter') > 0 ? 3 : 1;
  var baseAng = Math.atan2(dir.y, dir.x);
  for (var f = 0; f < fan; f++) {
    var off = fan === 1 ? 0 : (f - 1) * 0.11;
    for (var i = 0; i < n; i++) {
      var spread = (n === 1 ? 0 : (i - (n - 1) / 2) * 0.035) + off;
      var a = baseAng + spread;
      G.arrows.push({
        x: BOW.x, y: BOW.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, foe: false,
        pierce: skillLv('pierce'), bounce: skillLv('bounce'), life: 3,
        ring: 0, hit: {}, dmgMul: 1, crit: Math.random() < st.crit, spin: 0
      });
    }
  }
  G.parts.push({ type: 'flash', x: BOW.x, y: BOW.y, t: 0, dur: 0.16 });
  SFX.shoot();
  if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
}

cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', function () { UI.draw = null; });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- 波次 ---------- */
function hpScale() {
  return 1 + G.arch * 0.6 + G.wave * 0.04;
}
function spawnDef(kind, extra) {
  var s = hpScale();
  var base = {
    grunt:  { hp: 32, dmg: 6,  speed: 78, score: 1 },
    shield: { hp: 58, dmg: 5,  speed: 58, score: 2 },
    archer: { hp: 28, dmg: 6,  speed: 0,  score: 2 },
    air:    { hp: 24, dmg: 5,  speed: 0,  score: 2 },
    spear:  { hp: 38, dmg: 9,  speed: 0,  score: 3 },
    mage:   { hp: 46, dmg: 4,  speed: 62, score: 3 },
    boss:   { hp: 420, dmg: 12, speed: 34, score: 12 }
  }[kind] || { hp: 30, dmg: 8, speed: 70, score: 1 };
  var e = {
    id: Math.random().toString(36).slice(2), kind: kind, x: CONFIG.spawnX,
    hp: base.hp * s * (extra && extra.mul ? extra.mul : 1),
    maxHp: base.hp * s * (extra && extra.mul ? extra.mul : 1),
    dmg: base.dmg * (1 + G.arch * 0.28), speed: base.speed,
    mode: 'walk', atkT: 0, atkState: 'move', cd: rnd(0.8, 1.6), seed: rnd(0, 6.28),
    dead: false, dying: 0, smoke: 0.32, plankScale: 0, y: GROUND, scale: 1,
    color: kind === 'shield' ? '#241636' : kind === 'boss' ? '#2A0F1C' : '#170D28',
    slow: 0, burn: 0, burnDmg: 0, charm: 0, hitFlash: 0
  };
  if (kind === 'air' || kind === 'spear') {
    e.mode = 'air';
    var lv = extra.lv || 0;
    e.y = CONFIG.plankY[clamp(lv, 0, 2)];
    e.x = extra.x !== undefined ? extra.x : rnd(700, 1100);
    e.plankScale = 0; e.aim = 0.25; e.pull = 0;
    e.scale = 0.92;
  } else if (kind === 'archer') {
    e.mode = 'stand'; e.x = rnd(700, 1000);
  } else if (kind === 'mage') {
    e.mode = 'stand'; e.x = rnd(600, 760); e.cd = 3;
  } else if (kind === 'boss') {
    e.scale = 1.9; e.hp *= 2.2; e.maxHp = e.hp; e.waveBoss = true;
  }
  return e;
}

function buildWave() {
  var n = clamp(irnd(3, 6) + (G.wave % 5 === 0 ? 1 : 0), 3, 8);
  var list = [];
  var airMax = 3, air = 0;
  var pool = ['grunt', 'grunt', 'grunt'];
  if (G.arch >= 0) pool.push('archer');
  if (G.arch >= 0) pool.push('shield');
  if (G.arch >= 1) pool.push('mage');
  pool.push('air');

  for (var i = 0; i < n; i++) {
    var k = pick(pool);
    if (k === 'air' || k === 'spear') {
      if (air >= airMax) k = 'grunt';
      else { air++; if (G.arch >= 2 && Math.random() < 0.3) k = 'spear'; }
    }
    list.push(k);
  }
  if (G.wave % 5 === 0) { list.push('shield'); if (G.arch >= 1) list.push('spear'); }
  if (G.wave === G.waveTotal) list = ['boss', 'grunt', 'grunt'];
  if (G.mode === 'hero') list = list.map(function (k) { return k; });

  var airUsed = 0;
  return list.map(function (k) {
    var ex = {};
    if (k === 'air' || k === 'spear') { ex.lv = airUsed++ % 3; ex.x = rnd(720, 1080); }
    return { kind: k, ex: ex, delay: rnd(0.15, 0.9) };
  });
}

function startWave() {
  G.spawnQueue = buildWave();
  G.waveKills = 0;
  G.spawnT = 0;
  G.waveGap = 0;
  if (G.wave % 5 === 0 && G.wave !== G.waveTotal) toast('精英波次');
  if (G.wave === G.waveTotal) { toast('首领来袭'); SFX.boss(); }
  if (has('holyshield')) G.shield = Math.min(stats().shieldMax, G.shield + 25 * skillLv('holyshield'));
}

function spawnTick(dt) {
  if (!G.spawnQueue.length) return;
  G.spawnT += dt;
  var q = G.spawnQueue[0];
  if (G.spawnT >= q.delay) {
    G.spawnT = 0; G.spawnQueue.shift();
    var e = spawnDef(q.kind, q.ex);
    G.enemies.push(e);
  }
}

/* ---------- 伤害 ---------- */
function addText(x, y, txt, color, size, vy, life) {
  G.texts.push({ x: x, y: y, txt: txt, color: color || '#fff', size: size || 20, t: 0, life: life || 0.85, vy: vy === undefined ? -34 : vy });
}
function burst(x, y, color, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, 6.28), v = rnd(20, spd || 90);
    G.parts.push({ type: 'spark', x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, dur: rnd(0.2, 0.5), color: color, r: rnd(1.5, 3.4) });
  }
  if (G.parts.length > 220) G.parts.splice(0, G.parts.length - 220);
}

function hurtPlayer(dmg, fromTop) {
  if (!G || G.phase !== 'fight') return;
  if (UI.god) return;
  var st = stats();
  if (has('dodge') && Math.random() < 0.12 * skillLv('dodge')) {
    addText(PLAYER_X, GROUND - 90, '闪避', '#9FE8FF', 18); return;
  }
  if (save.talents.def >= 3) dmg *= 0.96;
  dmg *= (has('armor') ? 1 - 0.1 * skillLv('armor') : 1);
  if (fromTop) dmg *= (1 - clamp(st.top / (st.top + 60), 0, 0.7));
  else dmg *= (1 - clamp(st.front / (st.front + 70), 0, 0.7));
  dmg = Math.max(1, dmg);
  var absorbed = 0;
  if (G.shield > 0) {
    absorbed = Math.min(G.shield, dmg);
    G.shield -= absorbed; dmg -= absorbed;
  }
  if (absorbed > 0) addText(PLAYER_X + 4, GROUND - 96, '-' + fmt(absorbed), '#7FE3FF', 15, -46);
  if (dmg > 0) {
    G.hp -= dmg;
    addText(PLAYER_X, GROUND - 74, '-' + fmt(dmg), '#FF7B7B', 22, -52);
    UI.hurtFlash = 0.15; UI.shake = REDUCED ? 0 : 3;
    SFX.hurt();
  }
  if (G.hp <= 0) onDeath();
}

function onDeath() {
  if (skillLv('revive') > G.reviveCount) {
    G.reviveCount++;
    G.hp = stats().maxHp;
    addText(PLAYER_X, GROUND - 100, '复活！', '#FFD34D', 26, -40, 1.4);
    burst(PLAYER_X, GROUND - 40, '#FFD34D', 18, 150);
    return;
  }
  if (save.talents.rec >= 4 && !G.talentSaved) {
    G.talentSaved = true; G.hp = stats().maxHp * 0.3;
    addText(PLAYER_X, GROUND - 100, '生机', '#7ED957', 22, -40, 1.2);
    return;
  }
  G.hp = 0; G.phase = 'dead'; G.deathT = 0;
  SFX.lose();
  setTimeout(showResult, 620);
}

function hitEnemy(e, ar) {
  if (e.dead || e.charm > 0) return;
  if (ar.hit[e.id]) return;
  ar.hit[e.id] = 1;
  var st = stats();
  var dmg = st.atk;
  var crit = ar.crit;
  if (crit) dmg *= 1.6;
  if (e.mode === 'air' && has('headshot')) dmg *= 1 + 0.25 * skillLv('headshot');
  if (has('fury')) dmg *= 1 + skillLv('fury') * 0.15 * (1 - G.hp / st.maxHp);
  if (e.kind === 'shield' && ar.vx > 0 && Math.random() < 0.6) {
    addText(e.x, GROUND - 74, '盾挡', '#B9A6FF', 16);
    burst(e.x, GROUND - 46, '#B9A6FF', 5, 60);
    ar.dead = true;
    return;
  }
  if (has('execute') && e.hp / e.maxHp <= 0.08 + 0.04 * skillLv('execute') && e.kind !== 'boss') {
    dmg = e.hp + 1;
    addText(e.x, GROUND - 84, '处决', '#FF5C6C', 20);
  }
  e.hp -= dmg;
  e.hitFlash = 0.12;
  if (has('lightning')) e.hp -= 4 * skillLv('lightning');
  if (has('ignite')) { e.burn = Math.max(e.burn, 3); e.burnDmg = Math.max(e.burnDmg, 2.2 * skillLv('ignite')); }
  if (has('freeze')) e.slow = Math.max(e.slow, 2);

  var ty = e.mode === 'air' ? e.y - 70 : GROUND - 78;
  addText(e.x, ty, fmt(dmg), crit ? '#FFE066' : '#FFFFFF', crit ? 25 : 22, -46);
  burst(ar.x, ar.y, '#FFFFFF', 4, 70);
  SFX[crit ? 'crit' : 'hit']();
  if (has('leech')) { G.healAcc += dmg * 0.06 * skillLv('leech'); }

  if (has('explode') && ar.ring === 0) {
    var r = 26 + 10 * skillLv('explode');
    G.parts.push({ type: 'ring', x: ar.x, y: ar.y, t: 0, dur: 0.3, r: r, color: '#FFB347' });
    G.enemies.forEach(function (o) {
      if (o === e || o.dead) return;
      var oy = o.mode === 'air' ? o.y - 30 : GROUND - 30;
      if (Math.hypot(o.x - ar.x, oy - ar.y) < r && !ar.hit[o.id]) {
        o.hp -= st.atk * 0.45;
        if (o.hp <= 0) killEnemy(o, false);
      }
    });
  }
  if (has('split') && ar.ring === 0) {
    for (var s = -1; s <= 1; s += 2) {
      G.arrows.push({ x: ar.x, y: ar.y, vx: s * 190, vy: -150, foe: false, pierce: 0, bounce: 0,
        life: 0.7, ring: 1, hit: {}, crit: false, small: true });
    }
  }
  if (has('ricochet') && ar.jumps === undefined) {
    var near = null, bd = 1e9;
    G.enemies.forEach(function (o) {
      if (o === e || o.dead || ar.hit[o.id]) return;
      var d = Math.hypot(o.x - ar.x, (o.mode === 'air' ? o.y - 30 : GROUND - 30) - ar.y);
      if (d < 180 && d < bd) { bd = d; near = o; }
    });
    if (near) {
      ar.jumps = skillLv('ricochet');
      ar.jumpTarget = near;
    }
  }
  if (has('knock') && e.mode !== 'air' && e.kind !== 'boss') {
    e.x = Math.min(CONFIG.spawnX, e.x + 40 * skillLv('knock'));
    e.atkState = 'move';
  }
  if (e.hp <= 0) killEnemy(e, true);
}

function killEnemy(e, give) {
  if (e.dead) return;
  e.dead = true; e.dying = 1;
  if (e.mode === 'air') {
    G.parts.push({ type: 'smoke', x: e.x, y: e.y - 30, t: 0, dur: 0.25, scale: 1 });
  }
  burst(e.x, e.mode === 'air' ? e.y - 20 : GROUND - 40, '#F2ECFF', 8, 90);
  if (give) {
    G.kills++; G.waveKills = (G.waveKills || 0) + 1;
    var gold = e.kind === 'boss' ? (80 + G.arch * 20) : (6 + G.wave * 2);
    if (has('steal')) gold *= 2;
    gold = Math.round(gold);
    G.coins += gold;
    addText(e.x, GROUND - 108, '+' + gold, '#FFD34D', 17, -40);
    var xp = (e.kind === 'boss' ? 40 : 4) * (has('wise') ? 1 + 0.2 * skillLv('wise') : 1);
    G.xp += xp;
    SFX.coin();
    checkLevel();
    if (e.kind === 'boss') {
      G.bossDone = true;
      setTimeout(function () {
        if (!G) return;
        if (G.phase === 'fight') onChapterClear();
        else G.pendingClear = true;
      }, 900);
    }
  }
}

function checkLevel() {
  while (G.xp >= G.xpNeed && G.phase === 'fight') {
    G.xp -= G.xpNeed;
    G.lvl++;
    G.xpNeed = Math.round(G.xpNeed * 1.18 + 4);
    openSkillPick();
    break;
  }
}
/* =========================================================================
 * 敌人 AI / 投射物 / 主循环
 * ========================================================================= */
function slowFactor(e) {
  var f = 1;
  if (e.slow > 0) f *= 0.7;
  return f;
}

function shootAt(e, speed) {
  var from = { x: e.x, y: e.mode === 'air' ? e.y - 46 : GROUND - 46 };
  var to = { x: PLAYER_X + rnd(-6, 6), y: GROUND - 34 };
  var sol = ballistic(from, to, speed || 520);
  if (!sol) return;
  G.arrows.push({ x: from.x, y: from.y, vx: sol.vx, vy: sol.vy, foe: true, life: 4, hit: {}, pierce: 0, bounce: 0, dmg: e.dmg });
  SFX.shoot();
}

function ballistic(from, to, v) {
  var g = CONFIG.gravity;
  var dx = to.x - from.x, dy = to.y - from.y;
  if (Math.abs(dx) < 1) dx = dx < 0 ? -1 : 1;
  var v2 = v * v;
  var disc = v2 * v2 - g * (g * dx * dx + 2 * dy * v2);
  if (disc < 0) return null;
  var root = Math.sqrt(disc);
  var tan = (v2 - root) / (g * dx);
  var dirx = dx >= 0 ? 1 : -1;
  var cos = dirx / Math.sqrt(1 + tan * tan);
  var sin = tan * cos;
  return { vx: v * cos, vy: v * sin };
}

function updateEnemy(e, dt) {
  if (e.dead) { e.dying -= dt * 1.6; return; }
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.burn > 0) {
    e.burn -= dt; e.hp -= e.burnDmg * dt;
    if (Math.random() < dt * 8) G.parts.push({ type: 'spark', x: e.x + rnd(-10, 10), y: (e.mode === 'air' ? e.y - 30 : GROUND - 40), vx: 0, vy: -40, t: 0, dur: 0.3, color: '#FF8A3D', r: 2 });
    if (e.hp <= 0) { killEnemy(e, true); return; }
  }
  if (e.slow > 0) e.slow -= dt;
  if (e.charm > 0) {
    e.charm -= dt;
    /* 倒戈：向其它敌人开火 */
    e.cd -= dt;
    if (e.cd <= 0) {
      e.cd = 1.1;
      var t = G.enemies.filter(function (o) { return !o.dead && o !== e; })[0];
      if (t) {
        var sol = ballistic({ x: e.x, y: e.mode === 'air' ? e.y - 40 : GROUND - 44 }, { x: t.x, y: t.mode === 'air' ? t.y - 20 : GROUND - 30 }, 560);
        if (sol) G.arrows.push({ x: e.x, y: e.mode === 'air' ? e.y - 40 : GROUND - 44, vx: sol.vx, vy: sol.vy, foe: false, life: 2, hit: {}, pierce: 0, bounce: 0, dmg: 28 });
      }
    }
    return;
  }

  if (e.smoke > 0) { e.smoke -= dt; return; }

  if (e.mode === 'air') {
    if (e.plankScale < 1) e.plankScale = Math.min(1, e.plankScale + dt / 0.2 * 1.1);
    if (e.smoke <= 0 && e.plankScale <= 0) e.plankScale = 1;
    e.cd -= dt;
    if (e.cd <= 0) {
      e.pull = Math.min(1, e.pull + dt * 5);
      if (e.pull >= 1) {
        shootAt(e, e.kind === 'spear' ? 460 : 520);
        e.pull = 0;
        e.cd = e.kind === 'spear' ? rnd(2.2, 3.0) : rnd(1.6, 2.4);
      }
    }
    if (e.kind === 'spear' && e.cd > 0.4 && e.cd < 0.5) {
      /* 落点预警影子 */
      G.parts.push({ type: 'warn', x: PLAYER_X, y: GROUND, t: 0, dur: 0.45 });
    }
    return;
  }

  if (e.mode === 'stand') {
    e.cd -= dt;
    if (e.kind === 'mage') {
      if (e.cd <= 0) {
        e.cd = 4;
        var cnt = 0;
        G.enemies.forEach(function (o) {
          if (o.dead || o === e) return;
          if (Math.abs(o.x - e.x) < 220) { o.buffed = 4; cnt++; }
        });
        if (cnt) {
          G.parts.push({ type: 'ring', x: e.x, y: GROUND - 40, t: 0, dur: 0.4, r: 90, color: '#C084FC' });
          addText(e.x, GROUND - 96, '鼓舞', '#C084FC', 15);
        }
      }
    } else if (e.cd <= 0) {
      shootAt(e, 540); e.cd = rnd(1.8, 2.8);
    }
    return;
  }

  /* 地面行走 */
  var tf = slowFactor(e);
  if (e.kind === 'boss') {
    var phase = e.hp / e.maxHp;
    if (phase > 0.66) e.stop = 300;
    else if (phase > 0.33) e.stop = 340;
    else e.stop = 300;
    if (phase <= 0.33) tf *= 1.6;
    if (phase <= 0.66) {
      e.sumT = (e.sumT || 0) + dt;
      if (e.sumT > 7) {
        e.sumT = 0;
        for (var i = 0; i < 2; i++) {
          var g2 = spawnDef('grunt', {}); g2.x = e.x + rnd(-30, 30); g2.smoke = 0.2; G.enemies.push(g2);
        }
      }
    }
  } else if (e.kind === 'mage') {
    e.stop = 640;
  } else {
    e.stop = CONFIG.stopX;
  }

  if (e.x > e.stop) {
    e.x -= e.speed * tf * dt;
    if (e.x < e.stop) e.x = e.stop;
    e.atkState = 'move';
    e.atkT = 0;
    return;
  }
  if (e.kind === 'mage') return;

  /* 攻击循环：抬手 0.45 → 命中 → 后摇 0.5 */
  e.atkT += dt;
  if (!e.atkState || e.atkState === 'move') { e.atkState = 'wind'; e.atkT = 0; }
  if (e.atkState === 'wind' && e.atkT >= 0.45) {
    e.atkState = 'hit'; e.atkT = 0;
    var dmg = e.dmg * (e.buffed > 0 ? 1.3 : 1);
    hurtPlayer(dmg, false);
    UI.shake = 3;
    G.parts.push({ type: 'slash', x: PLAYER_X + 26, y: GROUND - 40, t: 0, dur: 0.2 });
    if (has('thorns')) {
      e.hp -= 6 * skillLv('thorns');
      addText(e.x, GROUND - 84, '-' + (6 * skillLv('thorns')), '#9FE8FF', 15);
      if (e.hp <= 0) killEnemy(e, true);
    }
  } else if (e.atkState === 'hit' && e.atkT >= 0.5) {
    e.atkState = 'wind'; e.atkT = 0;
  }
  if (e.buffed > 0) e.buffed -= dt;
}

function updateArrow(a, dt) {
  a.life -= dt;
  a.vy += CONFIG.gravity * dt;
  var px = a.x, py = a.y;
  a.x += a.vx * dt; a.y += a.vy * dt;
  a.spin = (a.spin || 0) + dt * 8;

  if (a.life <= 0 || a.x < -80 || a.x > W + 80 || a.y > H + 40) { a.dead = true; return; }

  /* 落地弹跳 */
  if (a.y > GROUND - 2 && !a.foe) {
    if (a.bounce > 0) {
      a.bounce--; a.y = GROUND - 2; a.vy = -Math.abs(a.vy) * 0.55; a.vx *= 0.85;
      G.parts.push({ type: 'spark', x: a.x, y: GROUND, vx: 0, vy: -30, t: 0, dur: 0.3, color: '#C9A15C', r: 2.5 });
    } else { a.dead = true; G.parts.push({ type: 'spark', x: a.x, y: GROUND, vx: 0, vy: -20, t: 0, dur: 0.25, color: '#8A6A9E', r: 2 }); return; }
  }

  if (a.foe) {
    /* 敌方箭：命中玩家 or 误伤同伙 */
    if (a.x > PLAYER_X - 18 && a.x < PLAYER_X + 20 && a.y > GROUND - 66 && a.y < GROUND + 4) {
      hurtPlayer(a.dmg, a.vy > 40);
      a.dead = true; burst(a.x, a.y, '#FF9B9B', 6, 70);
      return;
    }
    if (G.mode === 'normal') {
      for (var i = 0; i < G.enemies.length; i++) {
        var e = G.enemies[i];
        if (e.dead || a.hit[e.id]) continue;
        var ey = e.mode === 'air' ? e.y - 34 : GROUND - 34;
        if (Math.hypot(a.x - e.x, a.y - ey) < 26) {
          a.hit[e.id] = 1;
          e.hp -= a.dmg * 0.8; e.hitFlash = 0.1;
          addText(e.x, ey - 30, fmt(a.dmg * 0.8), '#B9A6FF', 15);
          if (e.hp <= 0) killEnemy(e, false);
          a.dead = true; return;
        }
      }
    }
    return;
  }

  /* 玩家箭：命中敌人 */
  for (var k = 0; k < G.enemies.length; k++) {
    var en = G.enemies[k];
    if (en.dead || a.hit[en.id] || en.charm > 0) continue;
    var hy = en.mode === 'air' ? en.y - 30 : GROUND - 32;
    var rad = en.kind === 'boss' ? 46 : (en.mode === 'air' ? 26 : 30);
    if (Math.hypot(a.x - en.x, a.y - hy) < rad) {
      hitEnemy(en, a);
      if (a.jumpTarget) {
        var t = a.jumpTarget;
        var sol = ballistic({ x: a.x, y: a.y }, { x: t.x, y: t.mode === 'air' ? t.y - 26 : GROUND - 30 }, 620);
        if (sol) { a.vx = sol.vx; a.vy = sol.vy; }
        delete a.jumpTarget;
        return;
      }
      if (a.pierce > 0) { a.pierce--; return; }
      a.dead = true;
      return;
    }
  }
}

function updateParts(dt) {
  for (var i = G.parts.length - 1; i >= 0; i--) {
    var p = G.parts[i];
    p.t += dt;
    if (p.t >= (p.dur || 0.4)) { G.parts.splice(i, 1); continue; }
    if (p.type === 'spark') {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.vx *= 0.98;
    }
  }
  for (var j = G.texts.length - 1; j >= 0; j--) {
    var t = G.texts[j]; t.t += dt; t.y += t.vy * dt; t.vy *= 0.96;
    if (t.t >= t.life) G.texts.splice(j, 1);
  }
}

function update(dt) {
  if (!G || G.phase !== 'fight') return;
  G.time += dt;
  G.heroCool = Math.max(0, G.heroCool - dt);
  if (UI.hurtFlash > 0) UI.hurtFlash -= dt;
  if (UI.shake > 0) UI.shake = Math.max(0, UI.shake - dt * 24);

  /* 回复 */
  var st = stats();
  var regen = 0;
  if (has('regen')) regen += 0.8 * skillLv('regen');
  if (save.talents.def >= 4) regen += 0.4;
  if (save.talents.rec >= 2) regen += 0.3;
  if (regen) G.hp = Math.min(st.maxHp, G.hp + regen * dt);
  if (G.healAcc > 0) { G.hp = Math.min(st.maxHp, G.hp + G.healAcc); G.healAcc = 0; }
  if (G.shield < G.shieldMax && !has('holyshield')) G.shield = Math.min(G.shieldMax, G.shield + 1.2 * dt);

  spawnTick(dt);
  G.enemies.forEach(function (e) { updateEnemy(e, dt); });
  G.arrows.forEach(function (a) { updateArrow(a, dt); });
  G.arrows = G.arrows.filter(function (a) { return !a.dead; });
  G.enemies = G.enemies.filter(function (e) { return !e.dead || e.dying > 0; });

  /* 召唤物技能 */
  if (has('thunder')) {
    G.thunderT = (G.thunderT || 0) + dt;
    if (G.thunderT > 10) {
      G.thunderT = 0;
      var sorted = G.enemies.filter(function (e) { return !e.dead; }).sort(function (a, b) { return b.x - a.x; }).slice(0, 3);
      sorted.forEach(function (e) {
        e.hp -= 16 * skillLv('thunder');
        G.parts.push({ type: 'bolt', x: e.x, y: e.mode === 'air' ? e.y - 20 : GROUND - 30, t: 0, dur: 0.3 });
        addText(e.x, (e.mode === 'air' ? e.y : GROUND) - 92, fmt(16 * skillLv('thunder')), '#A8E6FF', 17);
        if (e.hp <= 0) killEnemy(e, true);
      });
    }
  }
  if (has('shark')) {
    G.sharkT = (G.sharkT || 0) + dt;
    if (G.sharkT > 8) {
      G.sharkT = 0;
      var target = G.enemies.filter(function (e) { return !e.dead && e.mode !== 'air'; }).sort(function (a, b) { return a.x - b.x; })[0];
      if (target) {
        G.parts.push({ type: 'shark', x: 80, y: GROUND - 26, t: 0, dur: 0.9, tx: target.x });
        target.hp -= 30 * skillLv('shark');
        addText(target.x, GROUND - 90, fmt(30 * skillLv('shark')), '#7EE0FF', 18);
        if (target.hp <= 0) killEnemy(target, true);
      }
    }
  }
  updateParts(dt);
  G.ult = Math.min(1, G.ult + dt * 0.06);

  /* 波次完成 */
  if (!G.spawnQueue.length && !G.enemies.some(function (e) { return !e.dead; })) {
    G.waveGap -= dt;
    if (G.waveGap <= 0) {
      if (G.wave >= G.waveTotal) { onChapterClear(); return; }
      G.wave++;
      G.waveGap = 0.9;
      if (has('firstaid')) G.hp = Math.min(st.maxHp, G.hp + st.maxHp * 0.12 * skillLv('firstaid'));
      if (save.talents.def >= 5) G.shield = Math.min(st.shieldMax, G.shield + 6);
      if (save.talents.rec >= 1) G.hp = Math.min(st.maxHp, G.hp + st.maxHp * 0.06);
      startWave();
    }
  }
}

/* ---------- 主循环 ---------- */
var lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  UI.time += dt;
  if (G && !UI.paused && G.phase === 'fight') update(dt);
  else if (G && G.phase === 'dead') { updateParts(dt); }
  render(dt);
  heroT += dt;
}
requestAnimationFrame(loop);

function toast(txt) {
  if (!G) return;
  addText(W / 2, 200, txt, '#FFC65C', 30, -18, 1.4);
}

/* =========================================================================
 * 渲染
 * ========================================================================= */
function render(dt) {
  ctx.save();
  var sh = UI.shake;
  if (sh > 0) ctx.translate(rnd(-sh, sh), rnd(-sh, sh));

  var arch = G ? G.arch : 0;
  if (!bgCache || bgCacheArch !== arch) buildBg(arch);
  ctx.drawImage(bgCache, 0, 0, W, H);

  if (!G) { ctx.restore(); return; }

  /* 悬空板（先画板再画怪） */
  G.enemies.forEach(function (e) {
    if (e.mode !== 'air' || e.dead) return;
    drawPlank(ctx, e.x, e.y, Math.max(0.01, e.plankScale));
  });

  /* 地面敌人 */
  G.enemies.forEach(function (e) {
    if (e.mode === 'air') return;
    if (e.dead) {
      ctx.save(); ctx.globalAlpha = clamp(e.dying, 0, 1) * 0.7;
      ctx.translate(e.x, GROUND); ctx.rotate(-1.35); ctx.scale(e.scale || 1, e.scale || 1);
      ctx.strokeStyle = '#150C26'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -46); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -52, 7, 0, 6.284); ctx.fillStyle = '#150C26'; ctx.fill();
      ctx.globalAlpha = 1; ctx.restore();
      return;
    }
    if (e.smoke > 0) return;
    drawGrunt(ctx, e, UI.time);
    if (e.hitFlash > 0) {
      ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e.x, GROUND - 34 * (e.scale || 1), 20 * (e.scale || 1), 0, 6.284); ctx.fill(); ctx.restore();
    }
  });

  /* 空中敌人 */
  G.enemies.forEach(function (e) {
    if (e.mode !== 'air' || e.dead) return;
    if (e.smoke > 0) { drawSmoke(ctx, e.x, e.y - 20, 0.32 - e.smoke, 0.85); return; }
    if (e.plankScale < 0.35) return;
    drawAirArcher(ctx, e, UI.time);
  });

  /* 玩家 */
  var drawing = UI.draw;
  var power = drawing ? drawing.power : 0;
  var ang = drawing ? Math.atan2(drawing.dir.y, drawing.dir.x) : -0.2;
  if (G.phase === 'dead') {
    ctx.save(); ctx.translate(PLAYER_X, GROUND); ctx.rotate(-1.4); ctx.globalAlpha = 0.9;
    drawArcher(ctx, 0, 0, { scale: 1, ang: -0.2 });
    ctx.restore();
  } else {
    drawArcher(ctx, PLAYER_X, GROUND, {
      bow: drawing ? 0.15 + power * 0.85 : 0,
      lean: drawing ? -0.03 - power * 0.05 : 0,
      ang: ang, t: UI.time, flash: UI.hurtFlash > 0.1 ? 1 : 0
    });
  }

  /* 拉弦锚点 + 虚线 */
  if (drawing) {
    var dx = drawing.cx - drawing.sx, dy = drawing.cy - drawing.sy;
    var dl = Math.hypot(dx, dy) || 1;
    var ax = BOW.x - 110 + dx / dl * Math.min(24, dl * 0.18);
    var ay = BOW.y + 22 + dy / dl * Math.min(18, dl * 0.14);
    ctx.save();
    ctx.globalAlpha = 0.34; ctx.fillStyle = '#E8E2F5';
    ctx.beginPath(); ctx.arc(ax, ay, 16, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 0.72; ctx.strokeStyle = '#E8E2F5'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax, ay, 16, 0, 6.284); ctx.stroke();
    ctx.restore();

    if (G.heroCool <= 0 && dl >= CONFIG.dragMin) {
      var sp = CONFIG.speedMin + (CONFIG.speedMax - CONFIG.speedMin) * power;
      var count = Math.round(CONFIG.dotsMin + (CONFIG.dotsMax - CONFIG.dotsMin) * power);
      var maxLen = Math.min(CONFIG.dotsMaxLen, 55 + 145 * power);
      /* 提示线只画到弓前方一小段：最多 200px / 15 点，绝不描到落点 */
      var px = BOW.x, py = BOW.y;
      var vx = drawing.dir.x * sp, vy = drawing.dir.y * sp;
      var acc = 0, seg = 0.006;
      var pts = [];
      for (var it = 0; it < 900 && acc < maxLen; it++) {
        var nx = px + vx * seg, ny = py + vy * seg;
        acc += Math.hypot(nx - px, ny - py);
        px = nx; py = ny; vy += CONFIG.gravity * seg;
        if (acc >= CONFIG.dotGap) { acc = 0; pts.push({ x: px, y: py }); if (pts.length >= count) break; }
      }
      ctx.save();
      for (var d = 0; d < pts.length; d++) {
        var al = 1 - (d / Math.max(1, pts.length - 1)) * 0.45;
        ctx.globalAlpha = al; ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(pts[d].x, pts[d].y, CONFIG.dotR, 0, 6.284); ctx.fill();
      }
      ctx.restore();
    }
  }

  /* 投射物 */
  G.arrows.forEach(function (a) { drawArrow(ctx, a); });

  /* 粒子 */
  G.parts.forEach(function (p) {
    var k = p.t / (p.dur || 0.4);
    ctx.save();
    if (p.type === 'spark') {
      ctx.globalAlpha = 1 - k; ctx.fillStyle = p.color || '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, 6.284); ctx.fill();
    } else if (p.type === 'flash') {
      ctx.globalAlpha = (1 - k) * 0.7; ctx.strokeStyle = '#FFF3C4'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 8 + k * 26, 0, 6.284); ctx.stroke();
    } else if (p.type === 'ring') {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = p.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.3 + k), 0, 6.284); ctx.stroke();
    } else if (p.type === 'smoke') {
      drawSmoke(ctx, p.x, p.y, p.t, p.scale || 1);
    } else if (p.type === 'slash') {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#FFD9D9'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, 26, -0.9 + k, 0.9 + k); ctx.stroke();
    } else if (p.type === 'warn') {
      ctx.globalAlpha = 0.55 * (1 - k); ctx.fillStyle = '#2A0A14';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 30, 10, 0, 0, 6.284); ctx.fill();
      ctx.globalAlpha = 0.8 * (1 - k); ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 30, 10, 0, 0, 6.284); ctx.stroke();
    } else if (p.type === 'bolt') {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#BFE9FF'; ctx.lineWidth = 3;
      var bx = p.x + (1 - k) * 22;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(p.x - 4, p.y - 8); ctx.lineTo(bx - 8, p.y * 0.5);
      ctx.lineTo(p.x, p.y); ctx.stroke();
    } else if (p.type === 'shark') {
      var sx = p.x + (p.tx - p.x) * k;
      ctx.globalAlpha = 1 - k * 0.4; ctx.fillStyle = '#5AC8E8';
      ctx.beginPath(); ctx.ellipse(sx, p.y, 26, 12, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx - 22, p.y); ctx.lineTo(sx - 40, p.y - 14); ctx.lineTo(sx - 40, p.y + 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx + 12, p.y - 3, 3, 0, 6.284); ctx.fill();
    }
    ctx.restore();
  });

  /* 飘字 */
  G.texts.forEach(function (t) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - Math.pow(t.t / t.life, 2), 0, 1);
    ctx.font = '700 ' + t.size + 'px "PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,4,20,.8)';
    ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
    ctx.restore();
  });

  drawHUD();
  ctx.restore();

  if (UI.hurtFlash > 0) {
    ctx.save();
    var grd = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, W * 0.62);
    grd.addColorStop(0, 'rgba(255,40,40,0)');
    grd.addColorStop(1, 'rgba(255,40,40,' + (0.42 * (UI.hurtFlash / 0.15)) + ')');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

/* ---- HUD ---- */
function rr(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function drawHUD() {
  var st = stats();
  /* 波次条 */
  var bx = 96, by = 26, bw = 240, bh = 16;
  ctx.save();
  ctx.fillStyle = 'rgba(14,6,26,.55)'; rr(ctx, bx, by, bw, bh, 8); ctx.fill();
  var prog = (G.wave - 1 + clamp((G.waveKills || 0) / 6, 0, 0.92)) / G.waveTotal;
  ctx.fillStyle = '#4FC3F7';
  rr(ctx, bx + 2, by + 2, Math.max(4, (bw - 4) * clamp(prog, 0.02, 1)), bh - 4, 6); ctx.fill();
  ctx.font = '700 20px "PingFang SC",system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.fillText(G.wave, 76, by + 15);
  ctx.fillText(G.waveTotal, bx + bw + 10, by + 15);
  crown(ctx, 54, by + 8, '#8FD3FF');
  crown(ctx, bx + bw + 40, by + 8, '#8FD3FF');
  ctx.restore();

  /* 等级与经验 */
  var cx0 = 470, cw = 260;
  ctx.save();
  ctx.textAlign = 'center'; ctx.font = '700 14px "PingFang SC",system-ui';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText('Lv.' + G.lvl, cx0 + cw / 2, 16);
  ctx.fillStyle = 'rgba(14,6,26,.6)'; rr(ctx, cx0, 24, cw, 14, 7); ctx.fill();
  var xr = clamp(G.xp / G.xpNeed, 0, 1);
  var grd = ctx.createLinearGradient(cx0, 0, cx0 + cw, 0);
  grd.addColorStop(0, '#FFD34D'); grd.addColorStop(1, '#FFA726');
  ctx.fillStyle = grd; rr(ctx, cx0 + 2, 26, Math.max(4, (cw - 4) * xr), 10, 5); ctx.fill();
  ctx.restore();

  /* 金币 */
  ctx.save();
  var gx = 900, gy = 20;
  ctx.fillStyle = 'rgba(14,6,26,.62)'; rr(ctx, gx, gy, 150, 32, 16); ctx.fill();
  ctx.fillStyle = '#FFC65C'; ctx.beginPath(); ctx.arc(gx + 18, gy + 16, 12, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#B67A18'; ctx.font = '700 14px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('$', gx + 18, gy + 21);
  ctx.fillStyle = '#fff'; ctx.font = '700 19px "PingFang SC",system-ui'; ctx.textAlign = 'left';
  ctx.fillText(String(G.coins), gx + 38, gy + 23);
  ctx.restore();

  /* 右上按钮：帮助 / 暂停（与 hudTap 判定一一对应，绝不画不可点的按钮） */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  /* 帮助：圆圈 + 问号 */
  ctx.beginPath(); ctx.arc(1176, 36, 13, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.arc(1176, 32, 4.4, 3.5, 5.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1176, 37); ctx.lineTo(1176, 40); ctx.stroke();
  ctx.beginPath(); ctx.arc(1176, 43.5, 1.6, 0, 6.284); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  /* 角色/装备入口：圆圈 + 小人（打开装备面板） */
  ctx.beginPath(); ctx.arc(1176, 78, 13, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.arc(1176, 74, 4.2, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.arc(1176, 89, 7.5, 3.5, 5.9); ctx.stroke();
  ctx.restore();

  /* 左下生命/护盾 */
  ctx.save();
  ctx.fillStyle = 'rgba(20,10,34,.62)'; rr(ctx, 44, 452, 300, 76, 12); ctx.fill();
  heart(ctx, 64, 472, 12, '#FF5C6C');
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(ctx, 84, 464, 200, 16, 8); ctx.fill();
  var hr = clamp(G.hp / st.maxHp, 0, 1);
  ctx.fillStyle = hr > 0.35 ? '#7ED957' : '#FF6B6B';
  rr(ctx, 86, 466, Math.max(3, 196 * hr), 12, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(fmt(G.hp) + '/' + fmt(st.maxHp), 184, 477);

  ctx.fillStyle = '#6FD3FF';
  ctx.beginPath(); ctx.moveTo(56, 494); ctx.lineTo(70, 494); ctx.lineTo(72, 506); ctx.lineTo(54, 506); ctx.closePath(); ctx.fill();

function crown(g, x, y, color) {

  g.lineTo(x, y - 7); g.lineTo(x + 5, y + 1); g.lineTo(x + 11, y - 4); g.lineTo(x + 11, y + 7);

}
function heart(g, x, y, r, color) {

  g.bezierCurveTo(x + r * 0.5, y - r * 1.4, x + r * 1.6, y - r * 0.4, x, y + r * 0.8);

}
/* =========================================================================
 * 局外：背包 / 商店 / 天赋 / 章节 / 界面
 * ========================================================================= */
var curArch = 0, curMode = 'normal';

function findItem(uid) {
  for (var i = 0; i < save.inventory.length; i++) if (save.inventory[i].uid === uid) return save.inventory[i];
  return null;
}
function itemName(it) { return it.name + ' Lv.' + it.level; }
function itemPower(it) {
  var base = ITEMS.filter(function (x) { return x.id === it.base; })[0];
  return Math.round(base.per * (1 + it.q * 0.55) + it.level * (1 + it.q * 0.4));
}

function randQuality() {
  var bonus = (curArch || 0) * 0.05 + save.clears * 0.02;
  var r = Math.random() + bonus;
  if (r > 1.32) return 5;
  if (r > 1.16) return 4;
  if (r > 0.97) return 3;
  if (r > 0.78) return 2;
  if (r > 0.52) return 1;
  return 0;
}
function makeItem(q) {
  var base = pick(ITEMS);
  q = q === undefined ? randQuality() : q;
  var mods = [];
  var mroll = Math.random() + q * 0.1;
  if (mroll > 0.7) {
    var stat = pick(['atk', 'hp', 'crit', 'cd']);
    mods.push({ stat: stat, value: stat === 'crit' ? 0.03 + q * 0.01 : stat === 'cd' ? 0.03 + q * 0.01 : 3 + q * 2 });
  }
  return {
    uid: 'i' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
    base: base.id, name: base.name, slot: base.slot, q: q, level: 0, mods: mods
  };
}
function addItem(it) {
  save.inventory.push(it);
  /* 三件同名同品质自动合成升一档 */
  var same = save.inventory.filter(function (o) { return o.base === it.base && o.q === it.q; });
  if (same.length >= 3 && it.q < 5) {
    same.slice(0, 3).forEach(function (o) {
      var idx = save.inventory.indexOf(o);
      if (idx >= 0) save.inventory.splice(idx, 1);
      for (var k in save.loadout) if (save.loadout[k] === o.uid) save.loadout[k] = null;
    });
    var merged = makeItem(it.q + 1);
    merged.base = it.base; merged.name = it.name; merged.slot = it.slot; merged.mods = it.mods || [];
    save.inventory.push(merged);
    addItemMergeGuard(merged);
    curToast = '合成：' + merged.name + ' · ' + QUAL[merged.q].name;
  }
}
var curToast = '';
function addItemMergeGuard(it) {
  var same = save.inventory.filter(function (o) { return o.base === it.base && o.q === it.q; });
  if (same.length >= 3 && it.q < 5) {
    same.slice(0, 3).forEach(function (o) {
      var idx = save.inventory.indexOf(o);
      if (idx >= 0) save.inventory.splice(idx, 1);
      for (var k in save.loadout) if (save.loadout[k] === o.uid) save.loadout[k] = null;
    });
    var merged = makeItem(it.q + 1);
    merged.base = it.base; merged.name = it.name; merged.slot = it.slot;
    save.inventory.push(merged);
  }
}

    var sp = document.createElement('span'); sp.textContent = s.name + ' ' + G.skills[id];
    box.appendChild(sp);
  });

    save.stars['c' + G.arch] = G.wave;

    save.clears++;

  G.phase = 'fight';
  UI.paused = false;
  G.enemies.forEach(function (e) { if (!e.dead) { e.x += 160; e.atkState = 'move'; } });
  hideAll();
  addText(PLAYER_X, GROUND - 110, '复活', '#FFD34D', 26, -30, 1.2);
};
el('r-retry').onclick = function () { startRun(G ? G.arch : curArch); };
el('r-home').onclick = function () {
  G = null; UI.paused = false; hideAll(); el('ov-title').classList.add('on');
  renderChapters(); drawHero();
};
el('p-resume').onclick = function () {
  UI.paused = false; hideAll();
  el('p-resume').textContent = '继续';
  if (G) G.phase = G.phase === 'dead' ? 'dead' : 'fight';
  if (G && G.phase === 'dead') { showOnly('ov-result'); UI.paused = true; }
};
el('p-quit').onclick = function () { G = null; UI.paused = false; hideAll(); el('ov-title').classList.add('on'); renderChapters(); };

window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && G && G.phase === 'fight') { UI.paused ? el('p-resume').click() : openPause(); }
});

/* ---- HUD 点击（暂停 / 帮助） ---- */
function hudTap(ev) {
  if (!G) return false;
  var q = toLogical(ev.clientX, ev.clientY);
  if (q.x > 1070 && q.x < 1132 && q.y > 452 && q.y < 514) { openPause(); return true; }
  if (q.x > 1132 && q.x < 1196 && q.y > 452 && q.y < 514) { openHelp(); return true; }
  /* 右上两枚圆钮：帮助 / 装备（与绘制坐标一致） */
  if (Math.sqrt((q.x - 1176) * (q.x - 1176) + (q.y - 36) * (q.y - 36)) < 21) { openHelp(); return true; }
  if (Math.sqrt((q.x - 1176) * (q.x - 1176) + (q.y - 78) * (q.y - 78)) < 21) { openGearInRun(); return true; }
  return false;
}

/* ---- 启动 ---- */
renderChapters();
drawHero();
el('btn-mode').textContent = '模式：' + MODES[curMode].name;
el('hero-rec').textContent = '第 1 章 · ' + CONFIG.chapters[0].name;
(function heroLoop() {
  requestAnimationFrame(heroLoop);
  if (!el('ov-title').classList.contains('on')) return;
  drawHero();
})();
buildBg(0);
render(0);
window.archer = {
  get state() { return G; }, get ui() { return UI; },
  start: startRun, stats: stats, cfg: CONFIG,
  dev: {
    god: function (v) { UI.god = v; },
    xp: function (n) { G.xp += n; checkLevel(); },
    wave: function (n) { G.wave = n; G.enemies = []; G.spawnQueue = []; G.waveGap = 0; startWave(); },
    hurt: function (n) { hurtPlayer(n, false); },
    killAll: function () { G.enemies.forEach(function (e) { killEnemy(e, true); }); },
    coins: function (n) { if (G) G.coins += n; save.coins += n; persist(); }
  }
};
})();
</script>
