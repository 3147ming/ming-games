<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0a1c">
<meta name="description" content="节奏拍打 TAP —— 4 键下落式打拍，内置曲谱、音效反馈、连击评级。">
<title>节奏拍打 · TAP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f0a1c'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%23ff6b9d'/%3E%3Ccircle cx='22' cy='16' r='3' fill='%234db8ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{--ac:#ff6b9d;--ac2:#4db8ff;--bg:#0f0a1c;--paper:#f0e9f7;--dim:#9a8fb4;--line:#2f2447}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#1d1236 0%,var(--bg) 64%);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
.wrap{width:min(100%,460px)}
.head{text-align:center;margin-bottom:8px}.logo{font-size:22px;letter-spacing:.24em;margin:0;color:var(--ac)}.sub{font-size:10px;letter-spacing:.12em;color:var(--dim);margin:3px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:12px}
.bar b{color:var(--ac);font-size:15px}.bar .stat{display:flex;gap:12px;flex-wrap:wrap}
.songbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:7px 12px;margin-bottom:8px;font-size:12px}
.songbar b{color:var(--ac2)}.songbar .lv{color:var(--dim)}
.stage{position:relative;width:min(100%,300px);height:min(64vh,460px);margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#150d28,#0b0716);touch-action:none}
.lane{position:absolute;top:0;bottom:0;width:25%;border-right:1px solid rgba(255,255,255,.06)}
.lane:nth-child(4){border-right:none}
.judge-line{position:absolute;left:0;right:0;bottom:58px;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent);box-shadow:0 0 12px var(--ac)}
.note{position:absolute;width:20%;height:20px;border-radius:6px;transform:translateX(-50%);pointer-events:none;display:flex;align-items:center;justify-content:center}.note svg{width:15px;height:15px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.hitfx{position:absolute;width:60px;height:60px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;border:2px solid #fff;opacity:.9;animation:fxpop .35s ease-out forwards}
@keyframes fxpop{to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.pad{position:absolute;bottom:0;left:0;right:0;height:58px;display:flex}
.key{flex:1;border:none;border-right:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font:inherit;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.key:last-child{border-right:none}.key.hit{background:rgba(255,255,255,.16);color:var(--paper)}
.key:nth-child(1){color:#ff6b9d}.key:nth-child(2){color:#a89ae6}.key:nth-child(3){color:#4db8ff}.key:nth-child(4){color:#5cc08a}
.combo{position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none}
.combo b{font-size:34px;color:var(--paper);text-shadow:0 2px 12px var(--ac)}
.combo small{display:block;font-size:10px;color:var(--dim);letter-spacing:.2em}
.judgetxt{position:absolute;top:52%;left:0;right:0;text-align:center;font-size:20px;font-weight:700;letter-spacing:.1em;pointer-events:none;opacity:0}
.judgetxt.show{animation:judgepop .5s ease-out}
@keyframes judgepop{0%{opacity:0;transform:translateY(8px) scale(.8)}30%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-14px) scale(1)}}
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,5,16,.92);text-align:center;padding:16px;overflow-y:auto}
.overlay[hidden]{display:none}.overlay h2{margin:0;font-size:20px;letter-spacing:.14em;color:var(--ac)}
.overlay p{margin:0;font-size:11px;color:var(--dim);line-height:1.7}
.songs{display:flex;flex-direction:column;gap:7px;width:100%;max-width:260px;margin:6px 0}
.songitem{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);color:var(--paper);font:inherit;font-size:12px;padding:10px 12px;cursor:pointer;text-align:left}
.songitem:active{background:rgba(255,107,157,.18)}
.songitem .nm{font-weight:600}.songitem .meta{font-size:10px;color:var(--dim)}
.songitem .dots{display:flex;gap:3px}.songitem .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.songitem .dots i.on{background:var(--ac)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:12px;min-height:40px;padding:0 14px;font:inherit;font-size:13px;cursor:pointer;background:var(--ac);color:#1a0a14;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:400}
.msg{text-align:center;min-height:18px;font-size:11px;margin:6px 0;color:var(--dim)}
.msg.win{color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="logo">TAP</h1><p class="sub">节 奏 拍 打 · 四 键 下 落</p></div>
  <div class="bar"><div class="stat"><span>分数 <b id="score">0</b></span><span>连击 <b id="combo">0</b></span><span>最高 <b id="best">0</b></span></div><button class="btn ghost" id="btn-info" style="min-height:30px;padding:0 10px">规则</button></div>
  <div class="songbar"><span>曲目 <b id="songname">星夜序曲</b></span><span class="lv" id="songlv">BPM 96 · 简单</span><button class="btn ghost" id="btn-select" style="min-height:28px;padding:0 8px">选曲</button></div>
  <div class="stage" id="stage">
    <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
    <div class="judge-line"></div>
    <div class="combo"><b id="comboBig"></b><small>COMBO</small></div>
    <div class="judgetxt" id="judgetxt"></div>
    <div class="pad" id="pad">
      <div class="key" data-k="0">D</div><div class="key" data-k="1">F</div><div class="key" data-k="2">J</div><div class="key" data-k="3">K</div>
    </div>
    <div class="overlay" id="overlay"><h2 id="ov-title">节奏拍打</h2><p id="ov-text">选一首曲子开始 · 音符到判定线按 D / F / J / K</p><div class="songs" id="songs"></div><div class="controls"><button class="btn" id="ov-btn">开始</button><button class="btn ghost" id="ov-btn2">每日谱面</button></div></div>
  </div>
  <div class="msg" id="msg">PERFECT +100 · GREAT +50 · MISS 断连击</div>
  <div class="controls"><button class="btn" id="btn-start">开始</button><button class="btn ghost" id="btn-mute">🔊 音效</button></div>
</div>
<div class="overlay" id="info" hidden style="position:fixed;z-index:60"><div style="width:min(90%,380px);background:#1d1236;border:1px solid var(--line);border-radius:16px;padding:22px"><h2 style="margin:0 0 10px;color:var(--ac);font-size:18px">玩法</h2><p style="font-size:12px;line-height:1.9;color:var(--dim);margin:0">音符从上方落下，到达底部判定线时按对应的 D / F / J / K（手机点下方四个键）。判定分 PERFECT / GREAT / MISS，连击越高分数加成越多。内置 3 首曲谱 + 每日固定谱面，每条轨道对应不同音高，击中即发声，还有击打音效反馈。可在下方切换静音。纯本地存档。</p><div class="controls" style="margin-top:16px"><button class="btn" id="info-close">知道了</button></div></div></div>
<script>
(function(){
'use strict';
var KEY='mg_tap.v1',$=function(i){return document.getElementById(i)};
var S=(function(){try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')return o}catch(e){}return {best:0,runs:0,daily:null}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rng(seed){var x=seed>>>0||1;return function(){x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function seedFrom(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
var stage=$('stage'),pad=$('pad'),notes=[],score=0,combo=0,maxCombo=0,running=false,raf=null,startT=0,daily=false,muted=false;
var NOTEICON="<svg viewBox='2.31 2.31 5.38 5.38' fill='currentColor' aria-hidden='true'><path d='M7 2.313a.5.5 0 0 1 .5.5v4a.875.875 0 0 1-.875.875h-.25a.875.875 0 1 1 0-1.75.125.125 0 0 0 .125-.125v-1.93c0-.254 0-.381-.072-.465l-.033-.034c-.084-.071-.211-.071-.465-.071h-.86c-.254 0-.38 0-.465.071l-.033.034c-.072.084-.072.21-.072.464v2.93a.875.875 0 0 1-.875.875h-.25a.875.875 0 1 1 0-1.75.125.125 0 0 0 .125-.125v-3a.5.5 0 0 1 .5-.5z'/></svg>";
var COLORS=['#ff6b9d','#a89ae6','#4db8ff','#5cc08a'];

// ===== 曲谱：3 首内置 + 每日固定谱 =====
var SONGS=[
  {id:'star',name:'星夜序曲',bpm:96,level:'简单',diff:1,pat:(function(){var o=[],seq=[0,1,2,3,2,1,0,2];for(var i=0;i<44;i++)o.push([i,seq[i%8]]);return o})()},
  {id:'neon',name:'霓虹心跳',bpm:124,level:'中等',diff:2,pat:(function(){var o=[];for(var i=0;i<60;i++){var b=i*0.5,lane=[0,2,1,3,2,0,3,1][i%8];o.push([b,lane]);if(i%8===7)o.push([b,3-lane])}return o})()},
  {id:'storm',name:'电光风暴',bpm:150,level:'困难',diff:3,pat:(function(){var o=[];for(var i=0;i<68;i++){var b=i*0.5,lane=Math.floor((i*7+Math.floor(i/8))%4);o.push([b,lane]);if(i%4===0)o.push([b,(lane+2)%4])}return o})()},
];
var curSong=SONGS[0];

// ===== 音效（Web Audio 合成，零音频文件） =====
var AC=null,TONES=[523.25,659.25,783.99,1046.5];
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(freq,dur,type,vol,when){if(!AC||muted)return;var t=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.15,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02)}
function playNote(lane){tone(TONES[lane],0.22,'triangle',0.13)}
function playHit(perfect){tone(perfect?1760:1320,0.05,'square',0.05)}
function playMiss(){tone(110,0.18,'sawtooth',0.09)}

var JUDGE_Y=()=>stage.clientHeight-58,SPEED=0.32;
function HUD(){$('score').textContent=score;$('combo').textContent=combo;$('comboBig').textContent=combo>1?combo:'';$('best').textContent=S.best}
function showJudge(txt,cls){var j=$('judgetxt');j.textContent=txt;j.style.color=cls==='win'?'#5cc08a':cls==='bad'?'#e0736b':'#f0e9f7';j.classList.remove('show');void j.offsetWidth;j.classList.add('show')}
function chartFromPattern(song){var ms=60000/song.bpm,lead=1600;return song.pat.map(function(p){return {lane:p[1],t:lead+p[0]*ms,hit:false,el:null,sounded:false}})}
function chartDaily(){var rand=rng(seedFrom('tap-'+today())),out=[],t=0;for(var i=0;i<64;i++){t+=rand()*220+180;out.push({lane:Math.floor(rand()*4),t:t,hit:false,el:null,sounded:false})}return out}
function startChart(mode){
  initAudio();
  if(mode==='daily'){daily=true;notes=chartDaily();$('songname').textContent='每日谱面';$('songlv').textContent='日期固定 · '+today()}
  else{daily=false;curSong=(mode&&mode.id)?mode:curSong;notes=chartFromPattern(curSong);$('songname').textContent=curSong.name;$('songlv').textContent='BPM '+curSong.bpm+' · '+curSong.level}
  S.runs++;save();score=0;combo=0;maxCombo=0;running=true;
  Array.prototype.forEach.call(stage.querySelectorAll('.note,.hitfx'),function(n){n.remove()});
  notes.forEach(function(n){
    var el=document.createElement('div');el.className='note';el.style.background=COLORS[n.lane];el.style.boxShadow='0 0 12px '+COLORS[n.lane];el.innerHTML=NOTEICON;
    el.style.left=(n.lane*25+12.5)+'%';stage.appendChild(el);n.el=el;
  });
  $('overlay').hidden=true;HUD();startT=performance.now();loop();
}
function loop(){
  if(!running)return;var now=performance.now()-startT,judge=JUDGE_Y();
  notes.forEach(function(n){
    if(n.hit||!n.el)return;
    var y=judge-(n.t-now)*SPEED;n.el.style.top=y+'px';
    if(!n.sounded&&now>=n.t){n.sounded=true;playNote(n.lane)}
    if(n.t-now<-160){n.hit=true;combo=0;n.el.remove();$('msg').className='msg';$('msg').textContent='MISS';showJudge('MISS','bad');playMiss();HUD()}
  });
  if(notes.every(function(n){return n.hit})){endGame();return}
  raf=requestAnimationFrame(loop);
}
function hit(lane){
  if(!running)return;var now=performance.now()-startT,best=null,bestD=1e9;
  notes.forEach(function(n){if(n.hit||n.lane!==lane)return;var d=Math.abs(n.t-now);if(d<bestD){bestD=d;best=n}});
  var key=pad.querySelector('.key[data-k="'+lane+'"]');key.classList.add('hit');setTimeout(function(){key.classList.remove('hit')},90);
  if(best&&bestD<160){
    best.hit=true;if(best.el)best.el.remove();
    var perfect=bestD<70;score+=perfect?100:50;combo++;if(combo>maxCombo)maxCombo=combo;
    $('msg').className='msg win';$('msg').textContent=(perfect?'PERFECT':'GREAT')+' +'+(perfect?100:50);showJudge(perfect?'PERFECT':'GREAT','win');playHit(perfect);
    var fx=document.createElement('div');fx.className='hitfx';fx.style.left=(lane*25+12.5)+'%';fx.style.top=JUDGE_Y()+'px';fx.style.borderColor=COLORS[lane];stage.appendChild(fx);setTimeout(function(){fx.remove()},360);
  }else{combo=0;$('msg').className='msg';$('msg').textContent='空击';showJudge('空击','')}
  HUD();
}
pad.querySelectorAll('.key').forEach(function(k){k.addEventListener('pointerdown',function(e){e.preventDefault();hit(+k.getAttribute('data-k'))})});
window.addEventListener('keydown',function(e){var map={d:0,f:1,j:2,k:3};var key=e.key.toLowerCase();if(map[key]!==undefined&&running){e.preventDefault();hit(map[key])}});
function endGame(){
  running=false;cancelAnimationFrame(raf);
  var isBest=score>S.best;if(isBest)S.best=score;if(daily)S.daily=today();save();
  $('ov-title').textContent='本局结束';$('ov-text').textContent='得分 '+score+' · 最大连击 '+maxCombo+(isBest?' · 新纪录！':'');
  $('ov-btn').textContent='再来一局';$('overlay').hidden=false;
}
function renderSongs(){
  $('songs').innerHTML=SONGS.map(function(s,i){var dots='';for(var d=0;d<3;d++)dots+='<i class="'+(d<s.diff?'on':'')+'"></i>';return '<button class="songitem" data-i="'+i+'"><span><span class="nm">'+s.name+'</span><br><span class="meta">BPM '+s.bpm+' · '+s.level+'</span></span><span class="dots">'+dots+'</span></button>'}).join('');
  Array.prototype.forEach.call($('songs').children,function(b){b.addEventListener('click',function(){startChart(SONGS[+b.getAttribute('data-i')])})});
}
function openSelect(){$('ov-title').textContent='节奏拍打';$('ov-text').textContent='选一首曲子 · 击中即发声';$('ov-btn').textContent='开始';renderSongs();$('overlay').hidden=false}
$('ov-btn').addEventListener('click',function(){startChart(curSong)});
$('ov-btn2').addEventListener('click',function(){startChart('daily')});
$('btn-start').addEventListener('click',function(){startChart(curSong)});
$('btn-select').addEventListener('click',openSelect);
$('btn-mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇 静音':'🔊 音效';if(!muted)initAudio()});
$('btn-info').addEventListener('click',function(){$('info').hidden=false});
$('info-close').addEventListener('click',function(){$('info').hidden=true});
renderSongs();HUD();
})();
</script>
</body>
</html>
