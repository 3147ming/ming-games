<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14110f">
<meta name="color-scheme" content="dark">
<meta name="description" content="《纸上迷城》——文字解谜 / 密室逃脱。一座纸做的、写不完的城。纯静态，零依赖。">
<title>纸上迷城 · 文字解谜</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314110f'/%3E%3Cpath d='M8 7h16v18H8z' fill='%23e8e0d0'/%3E%3Cpath d='M11 12h10M11 16h10M11 20h6' stroke='%23201b17' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../shared/screen-fit.css">
  <!-- desktop-tune -->
<style>
/* 桌面端把首屏引导层改成纸张本色，贴合「纸上迷城」主题并消除黑屏感 */
@media (min-width: 1100px) {
  #bootOverlay.boot {
    background:
      radial-gradient(62% 42% at 50% 30%, rgba(255, 246, 224, .96), transparent 72%),
      linear-gradient(160deg, #efe6d2, #d6c6a8);
    color: #2a2118;
  }
  #bootOverlay.boot h1, #bootOverlay.boot .boot-sub { color: #2a2118; }
  #bootOverlay.boot .dim { color: #5c5144 !important; }
  #bootOverlay.boot .btn.primary { background: #2a2118; color: #f3ead8; }
  #bootOverlay.boot .boot-lamp::before { border-color: #a67c3a; }
}
</style>
</head>
<body>
<div id="app" class="app">

  <header class="hud" role="banner">
    <div class="hud-left">
      <span class="room-glyph" id="roomGlyph" aria-hidden="true">囚</span>
      <span class="room-name" id="roomName">折纸囚室</span>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="btnHint" type="button" aria-label="提示">提示</button>
      <!-- 主音量：独立于静音存（papermaze.volume.v1）。静音时滑杆保留位置、整体变暗，
           百分比改显「静音」，让玩家一眼看出"不是坏了，是总闸关了"。 -->
      <div class="vol" id="volCtl">
        <input class="vol-range" id="volRange" type="range" min="0" max="100" step="1" value="100"
               aria-label="主音量" aria-valuetext="100%" />
        <span class="vol-pct" id="volPct" aria-hidden="true" autocomplete="off">100%</span>
      </div>
      <button class="icon-btn" id="btnMute" type="button" aria-label="静音开关" aria-pressed="false">♪</button>
    </div>
  </header>

  <div class="meter" role="img" aria-label="收集度"><i id="meterFill"></i></div>

  <main class="stage" id="stage" role="main">
    <p class="desc" id="desc"></p>
    <h2 class="sec-title">可查看</h2>
    <div class="hotspots" id="hotspots"></div>
    <h2 class="sec-title">出口</h2>
    <div class="exits" id="exits"></div>
  </main>

  <nav class="tabs" id="tabs" aria-label="面板" role="navigation">
    <button aria-label="背包" type="button" data-tab="bag">背包</button>
    <button aria-label="日志" type="button" data-tab="journal">日记</button>
    <button aria-label="图鉴" type="button" data-tab="codex">图鉴</button>
    <button type="button" data-tab="settings">设置</button>
  </nav>

  <section class="sheet" id="sheet" hidden aria-label="面板内容">
    <div class="sheet-head">
      <h2 id="sheetTitle">背包</h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="sheet-head">
        <h2 id="modalTitle">谜题</h2>
        <button class="icon-btn" id="modalClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="boot" id="bootOverlay">
    <div class="boot-lamp" aria-hidden="true"><i></i></div>
    <h1>纸上迷城</h1>
    <p class="boot-sub">一座纸做的、写不完的城</p>
    <p class="boot-stats dim" id="bootStats">正在点亮纸灯…</p>
    <button class="btn primary big" id="bootStart" type="button">点亮纸灯</button>
    <p aria-live="polite" class="boot-tip dim small">方向键 / WASD 移动 · 点击物件查看 · 卡关 90 秒后可按提示</p>
  </div>
</div>

<script type="module" src="./src/ui.mjs">
// 页面可见性变化时暂停/恢复游戏循环（避免后台继续消耗资源）
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    // 暂停逻辑：停止 requestAnimationFrame / setInterval
    if (typeof pauseGame === 'function') pauseGame();
  } else {
    // 恢复逻辑：重新开始游戏循环
    if (typeof resumeGame === 'function') resumeGame();
  }
});


// 页面卸载时清理游戏循环（避免后台继续消耗资源）
window.addEventListener('pagehide', function() {
  try {
    if (typeof cancelAnimationFrame === 'function' && window.__mgRAF) cancelAnimationFrame(window.__mgRAF);
  } catch(e) {}
  try {
    if (typeof clearInterval === 'function' && window.__mgIntervals) {
      for (var i = 0; i < window.__mgIntervals.length; i++) clearInterval(window.__mgIntervals[i]);
      window.__mgIntervals = [];
    }
  } catch(e) {}
});


// 全局错误捕获（非破坏性：只记录，不阻断游戏）
window.addEventListener('error', function(e) {
  try { console.error('[Game Error]', e.message, e.filename, e.lineno); } catch(err) {}
});
window.addEventListener('unhandledrejection', function(e) {
  try { console.error('[Unhandled Rejection]', e.reason); } catch(err) {}
});

</script>

<!-- PWA：Service Worker（离线可用 / 可安装到主屏） -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 离线能力不可用不影响游戏 */ });
  });
}
</script>

<script src="../shared/screen-fit.js"></script>
</body>
</html>
