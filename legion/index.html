<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E1626">
<meta name="description" content="雪国军团 —— 白天收割建造，夜里守住主城，六天六夜一关的 Roguelike 塔防。">
<title>雪国军团 · SNOW LEGION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1626'/%3E%3Crect x='9' y='12' width='14' height='11' fill='%23CFE0F2'/%3E%3Cpath d='M9 12 L16 6 L23 12 Z' fill='%237ED9C3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{
  --ac:#7ED9C3; --gold:#F0B428; --red:#FF5C6C; --paper:#EAF2FB; --dim:#8FA3BC; --line:#29384F;
  --bg:#0E1626; --snow:#E8F1FA; --panel:rgba(12,20,34,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070B12;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:var(--paper);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:relative;width:100vw;height:100vh;max-width:900px;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:rgba(5,9,16,.9);padding:3vmin}
.ov.on{display:flex}
h1,h2,h3,p{margin:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;text-align:center}
.big{font-size:clamp(22px,4vmin,36px);letter-spacing:.12em;color:#fff}
.btn{border:none;border-radius:10px;padding:1vmin 2.2vmin;font:inherit;font-weight:700;cursor:pointer;
  background:var(--ac);color:#08201C;font-size:clamp(12px,1.9vmin,16px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:500}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:default}
.hint{color:var(--dim);font-size:clamp(10px,1.5vmin,13px);line-height:1.8}
.row{display:flex;gap:1.2vmin;flex-wrap:wrap;justify-content:center}
/* 关卡选择 */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vmin;width:min(94%,760px)}
.lvcard{background:rgba(20,32,48,.92);border:1px solid var(--line);border-radius:14px;padding:1.6vmin;cursor:pointer;
  text-align:left;position:relative;overflow:hidden}
.lvcard.on{border-color:var(--ac);background:rgba(126,217,195,.12)}
.lvcard.lock{opacity:.45;cursor:not-allowed}
.lvcard b{display:block;font-size:clamp(12px,1.9vmin,16px);margin-bottom:.6vmin}
.lvcard small{color:var(--dim);font-size:clamp(9px,1.35vmin,12px);display:block;line-height:1.6}
.lvcard .stars{color:var(--gold);letter-spacing:.1em;font-size:clamp(11px,1.6vmin,14px);margin-top:.6vmin;display:block}
/* 技能卡 */
.cards{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center}
.skill{width:clamp(140px,22vmin,210px);background:linear-gradient(180deg,#1B2C42,#0F1A29);border:1px solid var(--line);
  border-radius:14px;padding:1.8vmin;cursor:pointer;text-align:left}
.skill:hover{border-color:var(--ac)}
.skill .q{font-size:clamp(9px,1.3vmin,11px);letter-spacing:.12em;color:var(--gold)}
.skill b{display:block;margin:.6vmin 0;font-size:clamp(13px,2vmin,17px)}
.skill p{font-size:clamp(10px,1.4vmin,12px);color:#BBD0E6;line-height:1.6;min-height:4em}
.skill .lv{color:var(--ac);font-size:clamp(10px,1.4vmin,12px)}
.banner{background:linear-gradient(90deg,#F0B428,#FFD873);color:#231400;font-weight:800;letter-spacing:.2em;
  padding:1vmin 3vmin;border-radius:8px;font-size:clamp(13px,2vmin,18px)}
/* 事件卡 */
.events{position:absolute;left:4%;right:4%;bottom:22%;display:flex;flex-direction:column;gap:1vmin;z-index:6}
.evcard{background:#F4F7FB;color:#16202E;border-radius:12px;padding:1.4vmin;display:flex;gap:1.2vmin;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.evcard .t{flex:1}
.evcard b{display:block;color:#B46800;font-size:clamp(11px,1.7vmin,14px)}
.evcard small{font-size:clamp(9px,1.35vmin,12px);color:#41505F;line-height:1.5}
.evcard button{border:none;border-radius:8px;background:#1E2C40;color:#fff;padding:.8vmin 1.6vmin;
  font:inherit;font-size:clamp(10px,1.5vmin,13px);cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="1600"></canvas>

  <div class="ov on" id="ov-title">
    <div class="center">
      <div class="big">雪 国 军 团</div>
      <div class="hint">白天收割麦穗、招募英雄、建塔修墙；夜里六波怪冲城，撑到天亮。</div>
      <div class="levels" id="level-list"></div>
      <div class="hint" id="title-stat"></div>
      <div class="row"><button class="btn" id="btn-start">进入雪原</button>
        <button class="btn ghost" id="btn-reset">清空存档</button></div>
    </div>
  </div>

  <div class="ov" id="ov-skill">
    <div class="center">
      <div class="banner">技 能 选 择</div>
      <div class="cards" id="skill-cards"></div>
      <div class="hint" id="skill-tip">这波操作比那巫术士的还溜…</div>
      <div class="row"><button class="btn" id="skill-take">学 到 技 能</button></div>
    </div>
  </div>

  <div class="ov" id="ov-end">
    <div class="center">
      <div class="big" id="end-title">守住了</div>
      <div class="hint" id="end-sub"></div>
      <div class="hint" id="end-body"></div>
      <div class="row"><button class="btn" id="end-retry">再来一关</button>
        <button class="btn ghost" id="end-home">回关卡</button></div>
    </div>
  </div>

  <div class="ov" id="ov-pause">
    <div class="center">
      <div class="big">暂停</div>
      <div class="hint" id="pause-info"></div>
      <div class="row"><button class="btn" id="p-resume">继续</button>
        <button class="btn ghost" id="p-quit">退出本关</button></div>
    </div>
  </div>

  <div class="events" id="events"></div>
</div>
<script>
(function () {
'use strict';
var W = 720, H = 1600;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var CONFIG = {
  days: 6, nights: 6, wavesPerNight: 6,
  cityHp: [400, 600, 850, 1150, 1500],
  cityCost: [0, 300, 700, 1400, 2600],
  dayLen: 40,
  harvest: { gold: 1, gauge: 2 },
  coinGauge: { cost: 1, gauge: 10, times: 3 },
  towers: {
    arrow: { name: '箭塔', cost: 50, hp: 300, dmg: 12, cd: 1.2, range: 260, color: '#7ED9C3' },
    frost: { name: '冰霜塔', cost: 140, hp: 260, dmg: 8, cd: 1.4, range: 240, color: '#6FD3FF', slow: 0.35 },
    flame: { name: '火焰塔', cost: 260, hp: 280, dmg: 10, cd: 1.6, range: 220, color: '#FF9C6B', splash: 3 },
    wall:  { name: '城墙', cost: 35, hp: 300, dmg: 0, cd: 0, range: 0, color: '#A9B8CC' }
  },
  heroes: [
    { id: 'mage', name: '大法师', hp: 900, dmg: 26, cd: 1.5, range: 240, cost: 200, color: '#B08BFF' },
    { id: 'blade', name: '剑圣', hp: 1400, dmg: 40, cd: 1.0, range: 70, cost: 260, color: '#FFC65C' },
    { id: 'queen', name: '冰雪女王', hp: 1000, dmg: 22, cd: 1.3, range: 220, cost: 360, color: '#6FD3FF' },
    { id: 'frostlord', name: '霜魂领主', hp: 1500, dmg: 34, cd: 1.2, range: 120, cost: 500, color: '#9FE8FF' }
  ],
  blizzard: { cd: 25, dur: 3, slow: 0.5, dps: 26, radius: 380 },
  levels: [
    { name: '初雪平原', tint: '#EAF4FF', enemy: '#8A6242' },
    { name: '霜松林地', tint: '#DFF0FF', enemy: '#7E5A3C' },
    { name: '冰封河谷', tint: '#D6ECFF', enemy: '#6E4E34' },
    { name: '风啸隘口', tint: '#E4F1FF', enemy: '#8A5A3A' },
    { name: '长夜冰原', tint: '#DCE9FA', enemy: '#7A4A30' },
    { name: '极光王座', tint: '#E8F2FF', enemy: '#6A3A28' }
  ]
};
var ENEMY_BASE = { hp: 70, dmg: 8, speed: 34 };

/* ---------- 存档 ---------- */
var SKEY = 'mg_legion.v1';
function defaultSave() {
  return { maxLevel: 1, stars: {}, bestKills: 0, clears: 0, runs: 0, heroCodex: [], endlessBest: 0, coins: 0, muted: false };
}
var save = defaultSave();
(function () {
  try { var r = localStorage.getItem(SKEY); if (r) { var o = JSON.parse(r); for (var k in save) if (o[k] !== undefined) save[k] = o[k]; } } catch (e) {}
})();
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} }

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function irnd(a, b) { return Math.floor(rnd(a, b + 1)); }
function el(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toString(); }

/* ---------- 音效 ---------- */
var AC = null, muted = !!save.muted;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function beep(f, d, t, v, to) {
  if (muted) return;
  var a = actx(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = t || 'sine'; o.frequency.value = f;
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), a.currentTime + d);
    g.gain.value = v || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02);
  } catch (e) {}
}
var SFX = {
  hit: function () { beep(220, 0.05, 'square', 0.035, 140); },
  coin: function () { beep(1100, 0.06, 'sine', 0.04); },
  build: function () { beep(260, 0.12, 'square', 0.05, 360); },
  night: function () { beep(110, 0.6, 'sawtooth', 0.07, 60); },
  ice: function () { beep(700, 0.4, 'sine', 0.05, 220); },
  win: function () { [523, 659, 784].forEach(function (f, i) { setTimeout(function () { beep(f, 0.2, 'sine', 0.06); }, i * 130); }); },
  lose: function () { [330, 260, 180].forEach(function (f, i) { setTimeout(function () { beep(f, 0.3, 'triangle', 0.07); }, i * 170); }); }
};
/* =========================================================================
 * 舞台与状态
 * ========================================================================= */
var stage = el('stage'), cv = el('cv'), ctx = cv.getContext('2d');
var DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
function fitStage() {
  var r = stage.getBoundingClientRect();
  var s = Math.min(r.width / W, r.height / H);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();
function toLogical(cx, cy) {
  var r = cv.getBoundingClientRect();
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}

var FIELD = { x0: 56, y0: 286, x1: 664, y1: 1244 };
var CITY = { x: 240, y: 96, w: 240, h: 170 };
var GAUGE = { x: 360, y: 1452, r: 138 };
var BLIZ = { x: 148, y: 1332, r: 62 };
var AUTO = { x: 648, y: 1180, r: 32 };
var L = null;
var UI = { time: 0, paused: false, ring: null, sel: null, heroPick: null, said: '', saidT: 0 };

function pine(x, y, s) {
  return { x: x, y: y, s: s };
}

function newLevel(idx) {
  var lv = {
    level: idx, day: 1, phase: 'day', timer: CONFIG.dayLen, gauge: 0, coins: 120,
    kills: 0, cityLv: 0, cityMax: CONFIG.cityHp[0], cityHp: CONFIG.cityHp[0],
    towers: [], enemies: [], shots: [], parts: [], texts: [], wheat: [],
    lord: { x: 360, y: 820, tx: 360, ty: 820, hp: 600, maxHp: 600, swing: 0, cd: 0 },
    hero: null, heroOffered: null, auto: true,
    bliz: { cd: 0, active: 0, lv: { dmg: 0, area: 0, rage: 0 } },
    wave: 0, waveT: 0, spawnQueue: [], coinUse: 0, repairs: 0, nightKills: 0,
    pines: [], decorated: false
  };
  /* 松林环 */
  var i;
  for (i = 0; i < 26; i++) {
    lv.pines.push(pine(FIELD.x0 + 10 + Math.random() * (FIELD.x1 - FIELD.x0 - 20), FIELD.y0 + 14 + Math.random() * 26, rnd(0.7, 1.1)));
    lv.pines.push(pine(FIELD.x0 + 10 + Math.random() * (FIELD.x1 - FIELD.x0 - 20), FIELD.y1 - 34 + Math.random() * 24, rnd(0.7, 1.1)));
  }
  for (i = 0; i < 10; i++) {
    lv.pines.push(pine(FIELD.x0 + 12 + Math.random() * 34, FIELD.y0 + 60 + Math.random() * (FIELD.y1 - FIELD.y0 - 120), rnd(0.7, 1)));
    lv.pines.push(pine(FIELD.x1 - 46 + Math.random() * 34, FIELD.y0 + 60 + Math.random() * (FIELD.y1 - FIELD.y0 - 120), rnd(0.7, 1)));
  }
  /* 麦穗 */
  for (i = 0; i < 9; i++) {
    lv.wheat.push({
      x: rnd(FIELD.x0 + 90, FIELD.x1 - 90), y: rnd(FIELD.y0 + 90, FIELD.y1 - 90),
      ready: true, t: rnd(0, 3)
    });
  }
  return lv;
}

function addText(x, y, txt, color, size) {
  L.texts.push({ x: x, y: y, txt: txt, color: color || '#fff', size: size || 17, t: 0, life: 1.0 });
  if (L.texts.length > 30) L.texts.shift();
}
function pop(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, 6.28), v = rnd(20, 90);
    L.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, t: 0, dur: rnd(0.3, 0.7), color: color, r: rnd(1.4, 3) });
  }
  if (L.parts.length > 140) L.parts.splice(0, L.parts.length - 140);
}

/* =========================================================================
 * 渲染
 * ========================================================================= */
function render() {
  if (!L) { ctx.fillStyle = '#0B1220'; ctx.fillRect(0, 0, W, H); return; }
  var t = UI.time;
  var lv = CONFIG.levels[L.level];

  /* 雪原 */
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, L.phase === 'night' ? '#101C33' : '#1B3352');
  sky.addColorStop(0.55, L.phase === 'night' ? '#16233C' : '#2A4A6E');
  sky.addColorStop(1, L.phase === 'night' ? '#0C1526' : '#1A3550');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  /* 雪地 */
  var sg = ctx.createLinearGradient(0, FIELD.y0, 0, FIELD.y1);
  if (L.phase === 'night') { sg.addColorStop(0, '#B9CBDE'); sg.addColorStop(1, '#8FA6BE'); }
  else { sg.addColorStop(0, '#F0F7FF'); sg.addColorStop(1, '#D6E6F6'); }
  ctx.fillStyle = sg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(FIELD.x0 - 10, FIELD.y0 - 10, FIELD.x1 - FIELD.x0 + 20, FIELD.y1 - FIELD.y0 + 20, 26);
  else ctx.rect(FIELD.x0 - 10, FIELD.y0 - 10, FIELD.x1 - FIELD.x0 + 20, FIELD.y1 - FIELD.y0 + 20);
  ctx.fill();
  /* 雪地起伏 */
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  for (var i = 0; i < 5; i++) {
    ctx.beginPath();
    var yy = FIELD.y0 + 120 + i * 190;
    ctx.moveTo(FIELD.x0 + 30, yy);
    ctx.bezierCurveTo(FIELD.x0 + 150, yy - 18, FIELD.x1 - 150, yy + 18, FIELD.x1 - 30, yy);
    ctx.stroke();
  }

  L.pines.forEach(function (p) { drawPine(p.x, p.y, p.s); });
  L.wheat.forEach(function (w) { drawWheat(w, t); });
  drawCity(t);
  L.towers.forEach(function (b) { drawTower(b, t); });
  if (L.hero) drawHeroUnit(L.hero, t);
  drawLord(t);
  L.enemies.forEach(function (e) { drawEnemy(e, t); });
  drawShots();
  drawParts();
  if (L.bliz.active > 0) drawBlizzard();
  drawTexts();
  drawHUD(t);
  if (UI.ring) drawBuildRing();
  if (UI.heroPick) drawHeroPick();
}

function drawPine(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#2E4A4A';
  ctx.fillRect(-3, -10, 6, 12);
  ctx.fillStyle = '#2A5D5A';
  for (var i = 0; i < 3; i++) {
    var w = 26 - i * 7, h = 22 - i * 4, yy = -10 - i * 13;
    ctx.beginPath(); ctx.moveTo(0, yy - h); ctx.lineTo(w, yy); ctx.lineTo(-w, yy); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  for (var k = 0; k < 3; k++) {
    var w2 = 18 - k * 5, yy2 = -14 - k * 13;
    ctx.beginPath(); ctx.moveTo(0, yy2 - 10); ctx.lineTo(w2, yy2 + 2); ctx.lineTo(-w2, yy2 + 2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawWheat(w, t) {
  ctx.save(); ctx.translate(w.x, w.y);
  var sway = Math.sin(t * 2 + w.x) * 3;
  if (!w.ready) {
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#9A8B5E'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(sway, -14); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.strokeStyle = '#C59A22'; ctx.lineWidth = 3;
  for (var i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * 6, 14); ctx.quadraticCurveTo(i * 7 + sway, 0, i * 5 + sway, -18); ctx.stroke();
    ctx.fillStyle = '#F0B428';
    for (var k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.ellipse(i * 5 + sway + Math.sin(k) * 2, -19 + k * 6.4, 4, 7, 0.2 * i, 0, 6.284); ctx.fill();
    }
  }
  ctx.restore();
}

function drawCity(t) {
  var x = CITY.x, y = CITY.y, w = CITY.w, h = CITY.h;
  ctx.save();
  /* 城墙 */
  ctx.fillStyle = '#7C8FA6'; ctx.fillRect(x, y + 40, w, h - 40);
  ctx.fillStyle = '#93A7BF'; ctx.fillRect(x + 10, y + 62, w - 20, h - 62);
  /* 城垛 */
  ctx.fillStyle = '#68798E';
  for (var i = 0; i < 6; i++) ctx.fillRect(x + 4 + i * 40, y + 26, 26, 18);
  /* 主楼 */
  ctx.fillStyle = '#A9BCD1'; ctx.fillRect(x + 62, y + 8, 116, 66);
  ctx.fillStyle = '#6E819A';
  ctx.beginPath(); ctx.moveTo(x + 58, y + 8); ctx.lineTo(x + 120, y - 30); ctx.lineTo(x + 182, y + 8); ctx.closePath(); ctx.fill();
  /* 旗 */
  ctx.strokeStyle = '#5A6B80'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 120, y - 30); ctx.lineTo(x + 120, y - 60); ctx.stroke();
  ctx.fillStyle = '#7ED9C3';
  ctx.beginPath(); ctx.moveTo(x + 122, y - 58); ctx.lineTo(x + 152, y - 50); ctx.lineTo(x + 122, y - 42); ctx.closePath(); ctx.fill();
  /* 门 */
  ctx.fillStyle = '#4A5A70';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + 96, y + 120, 48, 54, [24, 24, 0, 0]); else ctx.rect(x + 96, y + 120, 48, 54);
  ctx.fill();
  /* 窗 */
  ctx.fillStyle = 'rgba(255,220,140,.85)';
  [[x + 84, y + 34], [x + 144, y + 34], [x + 30, y + 86], [x + 196, y + 86]].forEach(function (p) {
    ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, 6.284); ctx.fill();
  });
  ctx.restore();

  /* 主城升级 */
  ctx.save();
  var upReady = L.cityLv < 4 && L.coins >= CONFIG.cityCost[L.cityLv + 1];
  ctx.fillStyle = upReady ? 'rgba(126,217,195,.95)' : 'rgba(20,32,48,.75)';
  ctx.strokeStyle = upReady ? '#DFFFF4' : 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(286, 266, 148, 30, 8) : ctx.rect(286, 266, 148, 30);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = upReady ? '#0B2A22' : 'rgba(255,255,255,.5)';
  ctx.font = '700 14px "PingFang SC",system-ui'; ctx.textAlign = 'center';

  ctx.save();
  ctx.strokeStyle = '#8A6A3A'; ctx.lineWidth = 4;

  ctx.fillText(L.hero ? '已招募' : '招募', 583, 322);
  ctx.restore();

  /* 血条（嵌在城内，避免和顶部轨道打架） */

}

function drawTower(b, t) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(30,50,70,.18)';
  ctx.beginPath(); ctx.ellipse(0, 14, 24, 8, 0, 0, 6.284); ctx.fill();
  var col = CONFIG.towers[b.type].color;
  if (b.type === 'wall') {
    ctx.fillStyle = b.hp > 0 ? '#93A7BF' : '#5A6B80';
    for (var i = 0; i < 3; i++) ctx.fillRect(-24 + i * 17, -10, 15, 22);
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-24, -10, 48, 4);
  } else {
    ctx.fillStyle = '#43566E'; ctx.fillRect(-16, -6, 32, 22);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(-16, -6); ctx.lineTo(0, -34); ctx.lineTo(16, -6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, -12); ctx.lineTo(-10, -8); ctx.closePath(); ctx.fill();
    if (b.cd > 0) {
      var p = 1 - b.cd / CONFIG.towers[b.type].cd;
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -14, 20, -1.57, -1.57 + 6.284 * p); ctx.stroke();
    }
  }
  /* 血条 */
  if (b.hp < b.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(-20, -46, 40, 5);
    ctx.fillStyle = '#7ED957'; ctx.fillRect(-20, -46, 40 * clamp(b.hp / b.maxHp, 0, 1), 5);
  }
  /* 待修复 */
  if (b.hp < b.maxHp * 0.999 && b.hp > 0) {
    ctx.fillStyle = '#FFD34D'; ctx.font = '700 16px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('修', 0, -52);
  }
  ctx.restore();
}

function drawLord(t) {

function drawHeroUnit(h, t) {

function drawEnemy(e, t) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.dead) { ctx.globalAlpha = clamp(e.fade, 0, 1); ctx.rotate(1.4); }
  var bob = e.moving ? Math.abs(Math.sin(t * 9 + e.seed)) * 2 : 0;
  ctx.translate(0, -bob);
  var col = CONFIG.levels[L.level].enemy;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
  var sw = e.attacking ? Math.sin(t * 10) * 6 : Math.sin(t * 8 + e.seed) * 5;
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-6 + sw * 0.3, -10); ctx.lineTo(-8, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(6 - sw * 0.3, -10); ctx.lineTo(8, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(1, -38); ctx.stroke();
  ctx.beginPath(); ctx.arc(1, -44, 6.5, 0, 6.284); ctx.fill();
  /* 毡帽 */
  ctx.fillStyle = '#3E4A5C';
  ctx.beginPath(); ctx.moveTo(-9, -48); ctx.lineTo(11, -48); ctx.lineTo(1, -56); ctx.closePath(); ctx.fill();
  /* 矛 */
  ctx.strokeStyle = '#6B5A46'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(12, 2); ctx.lineTo(16, -34); ctx.stroke();
  ctx.fillStyle = '#C9D4E8';
  ctx.beginPath(); ctx.moveTo(16, -34); ctx.lineTo(12, -44); ctx.lineTo(20, -44); ctx.closePath(); ctx.fill();
  if (e.slow > 0) {
    ctx.fillStyle = 'rgba(111,211,255,.35)';
    ctx.beginPath(); ctx.arc(0, -22, 20, 0, 6.284); ctx.fill();
  }
  ctx.restore();
  if (e.hp < e.maxHp && !e.dead) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(e.x - 16, e.y - 62, 32, 4);
    ctx.fillStyle = '#FF7B7B'; ctx.fillRect(e.x - 16, e.y - 62, 32 * clamp(e.hp / e.maxHp, 0, 1), 4);
  }
}

function drawShots() {
  L.shots.forEach(function (s) {
    ctx.save();
    ctx.fillStyle = s.color; ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r || 4, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(s.x - s.vx * 0.02, s.y - s.vy * 0.02, (s.r || 4) * 1.5, 0, 6.284); ctx.fill();
    ctx.restore();
  });
}
function drawParts() {
  L.parts.forEach(function (p) {
    var k = p.t / p.dur;
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.4), 0, 6.284); ctx.fill(); ctx.restore();
  });
}
function drawTexts() {
  L.texts.forEach(function (t) {
    ctx.save();
    ctx.globalAlpha = 1 - Math.pow(t.t / t.life, 2);
    ctx.font = '700 ' + t.size + 'px "PingFang SC",system-ui'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,20,34,.75)';
    ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);

}

function drawBlizzard() {
  var k = 1 - L.bliz.active / CONFIG.blizzard.dur;
  ctx.save();
  ctx.globalAlpha = 0.5 * (1 - k * 0.4);
  var g = ctx.createRadialGradient(360, 760, 40, 360, 760, 420);
  g.addColorStop(0, 'rgba(200,240,255,.35)');
  g.addColorStop(1, 'rgba(160,220,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  /* 冰环三层 */
  for (var i = 0; i < 3; i++) {
    var p = (L.bliz.active / CONFIG.blizzard.dur + i * 0.22) % 1;
    ctx.globalAlpha = (1 - p) * 0.6;
    ctx.strokeStyle = '#BFE9FF'; ctx.lineWidth = 6 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(360, 760, 60 + p * 380, 0, 6.284); ctx.stroke();
  }
  /* 雪花 */
  ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff';
  for (var s = 0; s < 40; s++) {
    var sx = (s * 137 + UI.time * 90) % W, sy = (s * 211 + UI.time * 160) % H;
    ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, 6.284); ctx.fill();
  }
  ctx.restore();
}

/* ---- HUD ---- */
function drawHUD(t) {
  /* 顶部进度轨道 */
  ctx.save();
  var y = 44, x0 = 96, x1 = 600, n = CONFIG.nights;
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (var i = 0; i <= 60; i++) {
    var px = x0 + (x1 - x0) * i / 60, py = y + Math.sin(i * 0.7) * 5;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  for (var k = 0; k < n; k++) {
    var nx = x0 + (x1 - x0) * (k + 0.5) / n;
    var boss = k === 2 || k === 5;
    ctx.fillStyle = k < L.wave ? '#7ED957' : boss ? '#B08BFF' : '#FF5C6C';
    ctx.beginPath(); ctx.arc(nx, y + Math.sin((k * 10) * 0.7) * 4, 15, 0, 6.284); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#0E1626'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(boss ? '☠' : '⚑', nx, y + 4);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '500 10px system-ui';
    ctx.fillText((k + 1) + '/6', nx, y + 30);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(660, 44, 15, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(660, 34); ctx.lineTo(660, 44); ctx.stroke();
  ctx.restore();

  /* 底部仪表 */
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(10,22,36,.5)'; ctx.lineWidth = 22;
  ctx.beginPath(); ctx.arc(GAUGE.x, GAUGE.y, GAUGE.r, Math.PI, 6.284); ctx.stroke();
  var pct = clamp(L.gauge / 100, 0, 1);
  var gg = ctx.createLinearGradient(GAUGE.x - GAUGE.r, 0, GAUGE.x + GAUGE.r, 0);
  gg.addColorStop(0, '#7ED957'); gg.addColorStop(1, '#B6F07A');
  ctx.strokeStyle = gg;
  ctx.beginPath(); ctx.arc(GAUGE.x, GAUGE.y, GAUGE.r, Math.PI, Math.PI + Math.PI * pct); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '800 34px "PingFang SC",system-ui'; ctx.textAlign = 'center';
  ctx.fillText(Math.round(L.gauge) + '%', GAUGE.x, GAUGE.y - 22);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '600 15px "PingFang SC",system-ui';
  ctx.fillText(L.phase === 'day' ? '最终攻击！' : '守城中', GAUGE.x, GAUGE.y + 4);
  ctx.restore();

  /* 金币 / 天数 */
  ctx.save();
  ctx.fillStyle = '#F0B428';
  ctx.beginPath(); ctx.arc(96, 1500, 18, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#6B4400'; ctx.font = '700 16px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('$', 96, 1506);
  ctx.fillStyle = '#FFE6A8'; ctx.font = '700 24px "PingFang SC",system-ui'; ctx.textAlign = 'left';
  ctx.fillText(fmt(L.coins), 124, 1508);
  /* 太阳 */
  ctx.fillStyle = '#FFD34D';
  ctx.beginPath(); ctx.arc(586, 1496, 13, 0, 6.284); ctx.fill();
  ctx.strokeStyle = 'rgba(255,211,77,.7)'; ctx.lineWidth = 3;
  for (var s = 0; s < 8; s++) {
    var a = s / 8 * 6.284;
    ctx.beginPath();
    ctx.moveTo(586 + Math.cos(a) * 17, 1496 + Math.sin(a) * 17);
    ctx.lineTo(586 + Math.cos(a) * 23, 1496 + Math.sin(a) * 23);
    ctx.stroke();
  }
  ctx.fillStyle = '#FFE6A8'; ctx.font = '700 22px "PingFang SC",system-ui'; ctx.textAlign = 'left';
  ctx.fillText(L.day + '/6 天', 610, 1504);
  ctx.restore();

  /* 暴风雪按钮 */
  ctx.save();
  var ready = L.bliz.cd <= 0;
  ctx.fillStyle = ready ? 'rgba(124,74,196,.95)' : 'rgba(70,58,96,.9)';
  ctx.beginPath(); ctx.arc(BLIZ.x, BLIZ.y, BLIZ.r, 0, 6.284); ctx.fill();
  ctx.strokeStyle = ready ? '#D9B8FF' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(BLIZ.x, BLIZ.y, BLIZ.r, 0, 6.284); ctx.stroke();
  ctx.fillStyle = ready ? '#F3E9FF' : 'rgba(255,255,255,.55)';
  ctx.font = '800 26px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(ready ? '❄' : Math.ceil(L.bliz.cd), BLIZ.x, BLIZ.y + 9);
  /* 等级徽章 */
  ctx.save();
  ctx.translate(BLIZ.x + 46, BLIZ.y - 40); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#F0B428'; ctx.fillRect(-9, -9, 18, 18);
  ctx.restore();
  var lvl = 1 + L.bliz.lv.dmg + L.bliz.lv.area + L.bliz.lv.rage;
  ctx.fillStyle = '#231400'; ctx.font = '700 11px system-ui';
  ctx.fillText(lvl, BLIZ.x + 46, BLIZ.y - 36);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '600 14px "PingFang SC",system-ui';
  ctx.fillText('暴风雪', BLIZ.x, BLIZ.y + BLIZ.r + 22);
  ctx.restore();

  /* 投币 */
  ctx.save();
  var coinReady = L.phase === 'day' && L.coinUse < CONFIG.coinGauge.times;
  ctx.strokeStyle = coinReady ? '#6FD3FF' : 'rgba(255,255,255,.2)'; ctx.lineWidth = 3;
  ctx.fillStyle = coinReady ? 'rgba(40,90,140,.55)' : 'rgba(40,50,66,.5)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(490, 1352, 130, 58, 12) : ctx.rect(490, 1352, 130, 58);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = coinReady ? '#DDF3FF' : 'rgba(255,255,255,.45)';
  ctx.font = '700 18px "PingFang SC",system-ui'; ctx.textAlign = 'center';
  ctx.fillText('投币', 540, 1380);
  ctx.font = '600 12px "PingFang SC",system-ui';
  ctx.fillText((CONFIG.coinGauge.times - L.coinUse) + ' / ' + CONFIG.coinGauge.times + ' 次', 540, 1400);
  ctx.restore();

  /* 自动开关 */
  ctx.save();
  ctx.fillStyle = 'rgba(18,28,42,.88)';
  ctx.beginPath(); ctx.arc(AUTO.x, AUTO.y, AUTO.r, 0, 6.284); ctx.fill();
  ctx.strokeStyle = L.auto ? '#7ED9C3' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(AUTO.x, AUTO.y, AUTO.r, 0, 6.284); ctx.stroke();
  ctx.strokeStyle = L.auto ? '#7ED9C3' : '#8FA3BC'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(AUTO.x - 9, AUTO.y + 9); ctx.lineTo(AUTO.x + 9, AUTO.y - 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(AUTO.x + 2, AUTO.y - 12); ctx.lineTo(AUTO.x + 12, AUTO.y - 2); ctx.stroke();
  ctx.fillStyle = L.auto ? '#9FE8D0' : '#8FA3BC'; ctx.font = '500 12px "PingFang SC",system-ui'; ctx.textAlign = 'center';
  ctx.fillText('自动', AUTO.x, AUTO.y + AUTO.r + 18);
  ctx.restore();

  /* 领主台词框 */
  ctx.save();
  var dy = 1046;
  ctx.fillStyle = 'rgba(255,255,255,.94)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(30, dy, 660, 66, 14); else ctx.rect(30, dy, 660, 66);
  ctx.fill();
  ctx.fillStyle = '#3E5A7C'; ctx.beginPath(); ctx.arc(66, dy + 33, 24, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#F2D7C2'; ctx.beginPath(); ctx.arc(66, dy + 30, 11, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#9FB4CC'; ctx.beginPath(); ctx.arc(66, dy + 26, 12, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#1E2A3A'; ctx.font = '600 15px "PingFang SC",system-ui'; ctx.textAlign = 'left';
  ctx.fillText('领主', 100, dy + 24);
  ctx.fillStyle = '#33455C'; ctx.font = '500 14px "PingFang SC",system-ui';
  ctx.fillText(UI.said || (L.phase === 'day' ? '趁天亮，多收几束麦子。' : '顶住，天亮就是我们的。'), 100, dy + 47);
  ctx.restore();

  /* 相位提示 */
  if (L.phase === 'dusk') {
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,34,.55)'; ctx.fillRect(0, 700, W, 76);
    ctx.fillStyle = '#FFD34D'; ctx.font = '800 30px "PingFang SC",system-ui'; ctx.textAlign = 'center';
    ctx.fillText('敌人即将来袭', W / 2, 748);
    ctx.restore();
  }
  if (L.phase === 'night') {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '700 16px "PingFang SC",system-ui'; ctx.textAlign = 'center';
    ctx.fillText('第 ' + L.day + ' 夜 · 第 ' + Math.min(L.wave, 6) + ' / 6 波', W / 2, 286);
    ctx.restore();
  }
}

    ctx.fillText('💰 ' + h.cost, bx + bw / 2, by + 226);
  });
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '500 14px "PingFang SC",system-ui';
  ctx.fillText('点卡片招募，每关限 1 名 · 点空白关闭', W / 2, 960);
  ctx.restore();
}
/* =========================================================================
 * 逻辑
 * ========================================================================= */
function say(txt, dur) { UI.said = txt; UI.saidT = dur || 3; }

function startDusk() {
  L.phase = 'dusk';
  L.timer = 2.6;
  SFX.night();
  say('敌人从林子里出来了，各就各位！');
}
function startNight() {
  L.phase = 'night';
  L.wave = 1;
  L.nightKills = 0;
  spawnWave();
}
function spawnWave() {
  var boss = (L.wave === 3 || L.wave === 6);
  var count = 4 + L.wave;
  L.spawnQueue = [];
  var scale = 1 + (L.day - 1) * 0.25;
  for (var i = 0; i < count; i++) {
    var side = irnd(0, 3);
    var x, y;
    if (side === 0) { x = rnd(FIELD.x0 + 20, FIELD.x1 - 20); y = FIELD.y0 + 16; }
    else if (side === 1) { x = rnd(FIELD.x0 + 20, FIELD.x1 - 20); y = FIELD.y1 - 16; }
    else if (side === 2) { x = FIELD.x0 + 16; y = rnd(FIELD.y0 + 40, FIELD.y1 - 40); }
    else { x = FIELD.x1 - 16; y = rnd(FIELD.y0 + 40, FIELD.y1 - 40); }
    L.spawnQueue.push({ x: x, y: y, boss: boss && i === 0, delay: 0.2 + i * 0.07 });
  }
  L.spawnT = 0;
  addText(W / 2, 340, boss ? '第 ' + L.wave + ' 波 · 精英护卫' : '第 ' + L.wave + ' 波', boss ? '#FF6B6B' : '#fff', 22);
}
function spawnEnemy(q) {
  var scale = 1 + (L.day - 1) * 0.25;
  var hp = ENEMY_BASE.hp * scale * (q.boss ? 3 : 1);
  L.enemies.push({
    x: q.x, y: q.y, hp: hp, maxHp: hp, dmg: ENEMY_BASE.dmg * (1 + (L.day - 1) * 0.18) * (q.boss ? 1.6 : 1),
    speed: ENEMY_BASE.speed + rnd(-4, 8), cd: 0, seed: rnd(0, 6.28), moving: true, attacking: false,
    slow: 0, dead: false, fade: 1, boss: !!q.boss
  });
}

function update(dt) {
  UI.time += dt;
  if (UI.saidT > 0) { UI.saidT -= dt; if (UI.saidT <= 0) UI.said = ''; }
  L.texts.forEach(function (t) { t.t += dt; t.y -= dt * 22; });
  L.texts = L.texts.filter(function (t) { return t.t < t.life; });
  for (var i = L.parts.length - 1; i >= 0; i--) {
    var p = L.parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt;
    if (p.t > p.dur) L.parts.splice(i, 1);
  }
  L.wheat.forEach(function (w) {
    w.t += dt;
    if (!w.ready && w.t > 6) { w.ready = true; w.t = 0; }
  });
  L.bliz.cd = Math.max(0, L.bliz.cd - dt);
  if (L.bliz.active > 0) {
    L.bliz.active -= dt;
    var dmg = CONFIG.blizzard.dps * (1 + L.bliz.lv.dmg * 0.5) * dt;
    L.enemies.forEach(function (e) {
      if (e.dead) return;
      e.hp -= dmg;
      e.slow = Math.max(e.slow, 0.4);
      if (e.hp <= 0) killEnemy(e);
    });
  }

  moveLord(dt);
  updateEnemies(dt);
  updateTowers(dt);
  updateHero(dt);
  updateShots(dt);

  if (L.phase === 'day') {
    L.timer -= dt;
    L.gauge = Math.min(100, L.gauge + dt * (100 / CONFIG.dayLen));
    if (Math.random() < dt * 0.06 && (!L.events || L.events.length < 2)) addEvent();
    if (L.gauge >= 100) startDusk();
  } else if (L.phase === 'dusk') {
    L.timer -= dt;
    if (L.timer <= 0) startNight();
  } else if (L.phase === 'night') {
    if (L.spawnQueue.length) {
      L.spawnT += dt;
      if (L.spawnT >= L.spawnQueue[0].delay) { L.spawnT -= L.spawnQueue[0].delay; spawnEnemy(L.spawnQueue.shift()); }
    }
    if (!L.spawnQueue.length && !L.enemies.some(function (e) { return !e.dead; })) {
      L.wave++;
      if (L.wave > CONFIG.wavesPerNight) { dawn(); }
      else { spawnWave(); }
    }
  } else if (L.phase === 'dawn') {
    L.timer -= dt;
    if (L.timer <= 0) {
      if (L.day >= CONFIG.days) { winLevel(); }
      else { L.day++; L.phase = 'day'; L.timer = CONFIG.dayLen; L.gauge = 0; L.coinUse = 0;
        L.cityHp = Math.min(L.cityMax, L.cityHp + L.cityMax * 0.12);
        openSkillChoice(); }
    }
  }
}

function dawn() {
  L.phase = 'dawn';
  L.timer = 1.6;
  var loot = 60 + L.day * 25;
  L.coins += loot;
  addText(W / 2, 620, '天亮了 · 战利品 +' + loot, '#FFD34D', 24);
  say('撑过去了。升级一下，明天更难。');
  SFX.win();
}

function moveLord(dt) {
  var p = L.lord;
  if (L.auto) {
    var target = null, bd = 1e9;
    L.enemies.forEach(function (e) {
      if (e.dead) return;
      var d = Math.hypot(e.x - p.x, e.y - p.y);
      if (d < 230 && d < bd) { bd = d; target = e; }
    });
    if (target) { p.tx = target.x; p.ty = target.y + 6; }
  }
  var dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
  if (d > 3) {
    var sp = 170 * dt;
    p.x += dx / d * Math.min(sp, d);
    p.y += dy / d * Math.min(sp, d);
  }
  p.cd -= dt;
  if (p.cd <= 0) {
    var near = null, nd = 1e9;
    L.enemies.forEach(function (e) {
      if (e.dead) return;
      var dd = Math.hypot(e.x - p.x, e.y - p.y);
      if (dd < 74 && dd < nd) { nd = dd; near = e; }
    });
    if (near) {
      p.cd = 0.75;
      p.swing = REDUCED ? 0 : -0.8;
      near.hp -= 24;
      L.parts.push({ x: near.x, y: near.y - 22, vx: 60, vy: -40, t: 0, dur: 0.22, color: '#FFFFFF', r: 3 });
      if (near.hp <= 0) killEnemy(near);
    }
  }
  if (p.swing < 0) p.swing = Math.min(0, p.swing + dt * 4);
}

function updateEnemies(dt) {
  var gate = { x: 360, y: 292 };
  L.enemies.forEach(function (e) {
    if (e.dead) { e.fade -= dt * 1.4; return; }
    if (e.slow > 0) e.slow -= dt;
    /* 优先啃挡在路上的城墙 */
    var wall = null;
    L.towers.forEach(function (b) {
      if (b.type !== 'wall' || b.hp <= 0) return;
      if (Math.hypot(b.x - e.x, b.y - e.y) < 46) wall = b;
    });
    if (wall) {
      e.attacking = true;
      e.cd -= dt;
      if (e.cd <= 0) {
        e.cd = 1.1; wall.hp -= e.dmg; pop(wall.x, wall.y, '#C9D4E8', 3);
        if (wall.hp <= 0) { wall.hp = 0; addText(wall.x, wall.y - 40, '城墙破了', '#FF7B7B', 16); }
      }
      return;
    }
    var d = Math.hypot(gate.x - e.x, gate.y - e.y);
    if (d <= 46) {
      e.attacking = true;
      e.cd -= dt;
      if (e.cd <= 0) {
        e.cd = 1.2;
        L.cityHp -= e.dmg;
        pop(360, 280, '#FF9B9B', 4);
        if (L.cityHp <= 0) { L.cityHp = 0; loseLevel(); }
      }
      return;
    }
    e.attacking = false;
    e.moving = true;
    var sp = e.speed * (e.slow > 0 ? 0.5 : 1) * dt;
    e.x += (gate.x - e.x) / d * sp;
    e.y += (gate.y - e.y) / d * sp;
  });
  L.enemies = L.enemies.filter(function (e) { return !e.dead || e.fade > 0; });
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true; e.fade = 1;
  L.kills++; L.nightKills++;
  L.coins += e.boss ? 60 : 6;
  pop(e.x, e.y - 18, '#FFE0A8', 8);
  SFX.hit();
}

function updateTowers(dt) {
  L.towers.forEach(function (b) {
    if (b.type === 'wall' || b.hp <= 0) return;
    var def = CONFIG.towers[b.type];
    b.cd -= dt;
    if (b.cd > 0) return;
    var target = null, bd = 1e9;
    L.enemies.forEach(function (e) {
      if (e.dead) return;
      var d = Math.hypot(e.x - b.x, e.y - b.y);
      if (d < def.range && d < bd) { bd = d; target = e; }
    });
    if (!target) return;
    b.cd = def.cd;
    var ang = Math.atan2(target.y - b.y - 20, target.x - b.x);
    L.shots.push({ x: b.x, y: b.y - 26, vx: Math.cos(ang) * 620, vy: Math.sin(ang) * 620,
      life: 0.5, color: def.color, dmg: def.dmg, splash: def.splash || 0, slow: def.slow || 0, r: b.type === 'frost' ? 4 : 3.4 });
  });
}

function updateHero(dt) {
  var h = L.hero;
  if (!h) return;
  if (h.hp <= 0) {
    h.revive -= dt;
    if (h.revive <= 0) { h.hp = h.maxHp; h.revive = 0; }
    return;
  }
  h.cd -= dt;
  var target = null, bd = 1e9;
  L.enemies.forEach(function (e) {
    if (e.dead) return;
    var d = Math.hypot(e.x - h.x, e.y - h.y);
    if (d < 200 && d < bd) { bd = d; target = e; }
  });
  if (target && h.cd <= 0) {
    h.cd = h.def.cd;
    var ang = Math.atan2(target.y - h.y, target.x - h.x);
    L.shots.push({ x: h.x, y: h.y - 30, vx: Math.cos(ang) * 560, vy: Math.sin(ang) * 560,
      life: 0.5, color: h.def.color, dmg: h.def.dmg, r: 5 });
  }
  /* 敌人打英雄 */
  L.enemies.forEach(function (e) {
    if (e.dead) return;
    if (Math.hypot(e.x - h.x, e.y - h.y) < 44) {
      h.hp -= e.dmg * dt * 0.5;
      if (h.hp <= 0) { h.hp = 0; h.revive = 12; addText(h.x, h.y - 60, '英雄倒下', '#FF7B7B', 16); }
    }
  });
}

function updateShots(dt) {
  for (var i = L.shots.length - 1; i >= 0; i--) {
    var s = L.shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    var hit = null;
    for (var k = 0; k < L.enemies.length; k++) {
      var e = L.enemies[k];
      if (e.dead) continue;
      if (Math.hypot(e.x - s.x, e.y - 26 - s.y) < 24) { hit = e; break; }
    }
    if (hit) {
      hit.hp -= s.dmg;
      if (s.slow) hit.slow = 2;
      if (s.splash) {
        L.enemies.forEach(function (o) {
          if (o === hit || o.dead) return;
          if (Math.hypot(o.x - hit.x, o.y - hit.y) < 70) o.hp -= s.dmg * 0.5;
        });
      }
      if (hit.hp <= 0) killEnemy(hit);
      L.shots.splice(i, 1); continue;
    }
    if (s.life <= 0) L.shots.splice(i, 1);
  }
}

function castBlizzard() {
  if (!L || L.bliz.cd > 0) return;
  L.bliz.cd = CONFIG.blizzard.cd;
  L.bliz.active = CONFIG.blizzard.dur;
  SFX.ice();
  say('暴风雪！把路冻住！');
  addText(360, 700, '暴风雪', '#BFE9FF', 30);
}

/* ---- 建造 / 收割 / 招募 ---- */
function harvest(w) {
  var p = L.lord;
  p.tx = w.x; p.ty = w.y + 16;
  w.pending = true;
}

function updateHarvest() {
  /* 走到麦穗旁自动收割 */
  L.wheat.forEach(function (w) {
    if (!w.pending || !w.ready) return;
    var p = L.lord;
    if (Math.hypot(w.x - p.x, w.y - p.y - 16) < 46) {
      w.pending = false; w.ready = false; w.t = 0;
      L.coins += CONFIG.harvest.gold;
      L.gauge = Math.min(100, L.gauge + CONFIG.harvest.gauge);
      addText(w.x, w.y - 30, '+1', '#FFD34D', 17);
      p.swing = REDUCED ? 0 : -0.7;
      SFX.coin();
    }
  });
}

function buildTower(type, x, y) {
  if (x < FIELD.x0 + 30 || x > FIELD.x1 - 30 || y < FIELD.y0 + 30 || y > FIELD.y1 - 30) {
    addText(360, 1000, '只能建在雪地上', '#FF8A8D', 18); return false;
  }
  if (L.towers.some(function (b) { return Math.hypot(b.x - x, b.y - y) < 54; })) {
    addText(360, 1000, '这里太挤了', '#FF8A8D', 18); return false;
  }
  var def = CONFIG.towers[type];
  if (L.coins < def.cost) { addText(360, 1000, '金币不足（需 ' + def.cost + '）', '#FF8A8D', 18); return false; }
  L.coins -= def.cost;
  var b = { type: type, x: x, y: y, hp: def.hp, maxHp: def.hp, cd: 0, build: 0.6 };
  L.towers.push(b);
  addText(x, y - 46, '工匠建造了' + def.name, '#9FE8D0', 16);
  SFX.build();
  return true;
}

function repairTower(b) {
  var cost = Math.round((b.maxHp - b.hp) * 0.12) + 8;
  if (L.coins < cost) { addText(b.x, b.y - 60, '金币不足', '#FF8A8D', 16); return; }
  L.coins -= cost;
  b.hp = b.maxHp;
  L.repairs++;
  addText(b.x, b.y - 46, '已修复', '#7ED957', 16);
  SFX.build();
}

function openHeroPick() {
  if (L.hero) { say('这关已经有英雄了。'); return; }
  var pool = CONFIG.heroes.slice();
  var out = [];
  for (var i = 0; i < 3 && pool.length; i++) out.push(pool.splice(irnd(0, pool.length - 1), 1)[0]);
  L.heroOffered = out;
  UI.paused = true;
}

function pickHero(def) {
  if (L.coins < def.cost) { addText(360, 1000, '金币不足', '#FF8A8D', 18); return; }
  L.coins -= def.cost;
  L.hero = { def: def, x: 360, y: 360, hp: def.hp, maxHp: def.hp, cd: 0, revive: 0 };
  L.heroOffered = null;
  UI.paused = false;
  if (save.heroCodex.indexOf(def.id) < 0) { save.heroCodex.push(def.id); persist(); }
  say(def.name + '加入了队伍。');
  SFX.build();
}

/* ---- 技能：暴风雪三条强化线 ---- */
var SKILL_POOL = [
  { id: 'dmg', name: '暴风肆虐', desc: '+30% 暴风雪伤害', q: '普通' },

];
function openSkillChoice() {

/* ---- 事件卡 ---- */
var EVENTS = [
  { id: 'gold', title: '天降异宝', text: '雪里埋着一袋金币，要不要挖？', btn: '拿去', effect: function () { L.coins += 120; } },
  { id: 'repair', title: '加固转盘到货', text: '所有受损建筑恢复 30% 生命。', btn: '修复建筑', effect: function () { L.towers.forEach(function (b) { b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.3); }); L.cityHp = Math.min(L.cityMax, L.cityHp + L.cityMax * 0.1); } },
  { id: 'hero', title: '雷暴！一位路人被你收留', text: '他愿意帮忙修一天城墙。', btn: '查看', effect: function () { L.cityHp = Math.min(L.cityMax, L.cityHp + L.cityMax * 0.15); } },
  { id: 'coin', title: '麦商路过', text: '用 40 金币换 20% 进度。', btn: '金币', effect: function () { if (L.coins >= 40) { L.coins -= 40; L.gauge = Math.min(100, L.gauge + 20); } } }
];
function addEvent() {
  var e = EVENTS[irnd(0, EVENTS.length - 1)];
  L.events = L.events || [];
  if (L.events.length >= 2) return;
  L.events.push(e);
  renderEvents();
}
function renderEvents() {
  var box = el('events'); box.innerHTML = '';
  (L.events || []).forEach(function (e, i) {
    var d = document.createElement('div');
    d.className = 'evcard';
    d.innerHTML = '<div class="t"><b>' + e.title + '</b><small>' + e.text + '</small></div>' +
      '<button>' + e.btn + '</button>';
    d.querySelector('button').onclick = function () {
      e.effect(); L.events.splice(i, 1); renderEvents(); render();
    };
    box.appendChild(d);
  });
}

/* ---- 输入 ---- */
function onDown(ev) {
  if (!L) return;
  var q = toLogical(ev.clientX, ev.clientY);

  if (L.heroOffered) {
    var list = L.heroOffered;
    for (var i = 0; i < list.length; i++) {
      var bx = 120 + i * 200, by = 640;
      if (q.x > bx && q.x < bx + 172 && q.y > by && q.y < by + 260) { pickHero(list[i]); return; }
    }
    L.heroOffered = null; UI.paused = false; return;
  }
  if (UI.paused) return;

  if (UI.ring) {
    var opts = ['arrow', 'frost', 'flame', 'wall'];
    for (var k = 0; k < 4; k++) {
      var a = -Math.PI / 2 + k * Math.PI / 2;
      var bx2 = UI.ring.x + Math.cos(a) * 66, by2 = UI.ring.y + Math.sin(a) * 66;
      if (Math.hypot(q.x - bx2, q.y - by2) < 30) {
        var rx = UI.ring.x, ry = UI.ring.y;
        UI.ring = null;
        buildTower(opts[k], rx, ry);
        return;
      }
    }
    if (Math.hypot(q.x - UI.ring.x, q.y - UI.ring.y) < 108) { UI.ring = null; return; }
    UI.ring = null;
    return;
  }

  /* 按钮 */
  if (Math.hypot(q.x - BLIZ.x, q.y - BLIZ.y) < BLIZ.r + 6) { castBlizzard(); return; }
  if (Math.hypot(q.x - AUTO.x, q.y - AUTO.y) < AUTO.r + 6) { L.auto = !L.auto; return; }
  if (q.x > 500 && q.x < 620 && q.y > 1370 && q.y < 1430) {
    if (L.phase !== 'day') { say('夜里没法投币了。'); return; }
    if (L.coinUse >= CONFIG.coinGauge.times) { say('今天的投币次数用完了。'); return; }
    if (L.coins < CONFIG.coinGauge.cost) { say('金币不够。'); return; }
    L.coins -= CONFIG.coinGauge.cost; L.coinUse++;
    L.gauge = Math.min(100, L.gauge + CONFIG.coinGauge.gauge);
    addText(560, 1400, '进度 +10%', '#9FE8D0', 16);
    return;
  }
  /* 主城升级 */
  ctx.save();
  var upReady = L.cityLv < 4 && L.coins >= CONFIG.cityCost[L.cityLv + 1];
  ctx.fillStyle = upReady ? 'rgba(126,217,195,.95)' : 'rgba(20,32,48,.75)';
  ctx.strokeStyle = upReady ? '#DFFFF4' : 'rgba(255,255,255,.22)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(286, 266, 148, 30, 8) : ctx.rect(286, 266, 148, 30);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = upReady ? '#0B2A22' : 'rgba(255,255,255,.5)';
  ctx.font = '700 14px "PingFang SC",system-ui'; ctx.textAlign = 'center';
  ctx.fillText(L.cityLv >= 4 ? '主城已满级' : '升级主城 ' + CONFIG.cityCost[L.cityLv + 1], 360, 287);
  ctx.restore();

  /* 主城升级 */
  if (q.x > 286 && q.x < 434 && q.y > 262 && q.y < 300) {
    if (L.cityLv >= 4) { say('主城已经是最高级了。'); return; }
    var cost = CONFIG.cityCost[L.cityLv + 1];
    if (L.coins < cost) { addText(360, 320, '金币不足（需 ' + cost + '）', '#FF8A8D', 17); return; }
    L.coins -= cost; L.cityLv++;
    L.cityMax = CONFIG.cityHp[L.cityLv];
    L.cityHp = Math.min(L.cityMax, L.cityHp + L.cityMax * 0.5);
    addText(360, 320, '主城升级 Lv.' + (L.cityLv + 1), '#9FE8D0', 20);
    SFX.build();
    return;
  }
  /* 招募旗 */
  if (q.x > 520 && q.x < 600 && q.y > 300 && q.y < 380) { openHeroPick(); return; }
  /* 点仪表：提前入夜 */
  if (Math.hypot(q.x - GAUGE.x, q.y - GAUGE.y) < GAUGE.r && q.y < GAUGE.y) {
    if (L.phase === 'day') { L.gauge = 100; startDusk(); }
    return;
  }

  /* 建筑修复 */
  var hitTower = null;
  L.towers.forEach(function (b) {
    if (Math.hypot(b.x - q.x, b.y - q.y) < 40) hitTower = b;
  });
  if (hitTower) { if (hitTower.hp < hitTower.maxHp) repairTower(hitTower); return; }

  /* 麦穗 */
  var hitWheat = null;
  L.wheat.forEach(function (w) {
    if (w.ready && Math.hypot(w.x - q.x, w.y - q.y) < 44) hitWheat = w;
  });
  if (hitWheat) { harvest(hitWheat); return; }

  /* 空地 → 建造环 */
  if (q.x > FIELD.x0 && q.x < FIELD.x1 && q.y > FIELD.y0 && q.y < FIELD.y1 && q.y < 1240) {
    UI.ring = { x: q.x, y: q.y };
    return;
  }
  /* 点雪地移动领主 */
  if (q.x > FIELD.x0 && q.x < FIELD.x1 && q.y > FIELD.y0 && q.y < FIELD.y1) {
    L.lord.tx = q.x; L.lord.ty = q.y;
    L.auto = false;
  }
}

cv.addEventListener('pointerdown', onDown);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
/* =========================================================================
 * 界面 / 启动
 * ========================================================================= */
var curLevel = 0;

function hideAll() { ['ov-title', 'ov-skill', 'ov-end', 'ov-pause'].forEach(function (id) { el(id).classList.remove('on'); }); }
function showOnly(id) { hideAll(); el(id).classList.add('on'); }

function renderLevels() {
  var box = el('level-list'); box.innerHTML = '';
  CONFIG.levels.forEach(function (lv, i) {
    var unlocked = i < (save.maxLevel || 1);
    var stars = save.stars['l' + i] || 0;
    var d = document.createElement('div');
    d.className = 'lvcard' + (i === curLevel ? ' on' : '') + (unlocked ? '' : ' lock');
    d.innerHTML = '<b>' + (i + 1) + '. ' + lv.name + '</b><small>' + (unlocked ? '6 天 6 夜' : '通关上一关解锁') + '</small>' +
      '<span class="stars">' + (stars ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '未通关') + '</span>';
    if (unlocked) d.onclick = function () { curLevel = i; renderLevels(); };
    box.appendChild(d);
  });
  el('title-stat').textContent = '通关 ' + save.clears + ' 关 · 最高击杀 ' + save.bestKills + ' · 英雄图鉴 ' + save.heroCodex.length + '/4';
}

function startLevel(idx) {
  L = newLevel(idx);
  L.events = [];
  el('events').innerHTML = '';
  UI.paused = false; UI.ring = null; UI.said = '';
  save.runs++;
  persist();
  hideAll();
  say('第 ' + (idx + 1) + ' 关 · ' + CONFIG.levels[idx].name + '，天亮了，先收麦子。');
}

function winLevel() {
  if (!L) return;
  L.phase = 'win';
  var ratio = L.cityHp / L.cityMax;
  var stars = ratio > 0.7 ? 3 : ratio > 0.35 ? 2 : 1;
  save.stars['l' + L.level] = Math.max(save.stars['l' + L.level] || 0, stars);
  save.maxLevel = Math.max(save.maxLevel || 1, Math.min(6, L.level + 2));
  save.clears++;
  save.bestKills = Math.max(save.bestKills, L.kills);
  save.coins += 80 + L.level * 40;
  persist();
  el('end-title').textContent = '本关通关';
  el('end-sub').textContent = CONFIG.levels[L.level].name + ' · ' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + ' · 击杀 ' + L.kills;
  el('end-body').textContent = '主城剩余 ' + Math.round(ratio * 100) + '% · 金币 ' + fmt(L.coins);
  showOnly('ov-end');
  SFX.win();
}
function loseLevel() {
  if (!L) return;
  L.phase = 'lose';
  save.coins += 30;
  persist();
  el('end-title').textContent = '主城失守';
  el('end-sub').textContent = '坚持到第 ' + L.day + ' 天 · 击杀 ' + L.kills;
  el('end-body').textContent = '安慰奖 +30 金币 · 回去把塔修好再来';
  showOnly('ov-end');
  SFX.lose();
}

function openPause() {
  UI.paused = true;
  el('pause-info').innerHTML = '第 ' + L.day + ' 天 · ' + (L.phase === 'day' ? '白天' : L.phase === 'night' ? '第 ' + L.wave + ' 波' : '过渡') +
    '<br>主城 ' + fmt(L.cityHp) + '/' + fmt(L.cityMax) + ' · 击杀 ' + L.kills + ' · 金币 ' + fmt(L.coins);
  showOnly('ov-pause');
}

el('btn-start').onclick = function () { startLevel(curLevel); };
el('btn-reset').onclick = function () {
  if (!confirm('清空雪国军团的存档？')) return;
  save = defaultSave(); persist(); renderLevels();
};
el('end-retry').onclick = function () { startLevel(L ? L.level : curLevel); };
el('end-home').onclick = function () { L = null; showOnly('ov-title'); renderLevels(); };
el('p-resume').onclick = function () { UI.paused = false; hideAll(); };
el('p-quit').onclick = function () { L = null; UI.paused = false; hideAll(); showOnly('ov-title'); renderLevels(); };

Array.prototype.forEach.call(document.querySelectorAll('#skill-cards'), function () {});
el('skill-take').onclick = function () {
  if (!UI.skillPicked) return;
  var s = UI.skillPicked;
  L.bliz.lv[s.id] = (L.bliz.lv[s.id] || 0) + 1;
  if (s.id === 'rage') CONFIG.blizzard.cd = Math.max(12, CONFIG.blizzard.cd - 2);
  addText(360, 700, s.name + ' Lv.' + L.bliz.lv[s.id], '#9FE8D0', 22);
  UI.paused = false;
  hideAll();
  render();
};
Array.prototype.forEach.call(document.querySelectorAll('#skill-cards'), function (box) {
  box.addEventListener('click', function () { el('skill-take').disabled = !UI.skillPicked; });
});

/* 技能卡点击后启用按钮（用事件委托，卡片是动态生成的） */
document.addEventListener('click', function (e) {
  var card = e.target.closest ? e.target.closest('.skillcard') : null;
  if (card) el('skill-take').disabled = !UI.skillPicked;
});

/* ---- 主循环 ---- */
var last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (L && !UI.paused && L.phase !== 'win' && L.phase !== 'lose') {
    update(dt);
    updateHarvest();
  }
  render();
}
requestAnimationFrame(loop);

renderLevels();
render();

window.legion = {
  get state() { return L; }, start: startLevel,
  dev: {
    coins: function (n) { if (L) L.coins += n; },
    night: function () { if (L) { L.gauge = 100; startDusk(); } },
    kill: function () { if (L) L.enemies.forEach(function (e) { if (!e.dead) killEnemy(e); }); },
    city: function (n) { if (L) { L.cityHp = n; } },
    day: function (n) { if (L) L.day = n; }
  }
};
})();
</script>
