<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>传统割草游戏 · 战场原型</title>
    <meta name="description" content="传统割草 —— 俯视角割草生存，升级武器，清屏快感。">
    <meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161c24'/%3E%3Cpath d='M9 23 L16 7 L23 23' stroke='%23d8a13a' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./shared/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 触屏操作层（第 3 批 P0-1）。默认 hidden，只有粗指针设备由 main.js 打开；
       手指动作被翻译成**已有的键码**，所以 controller/playerCombat 一行都不用改。 -->
  <div id="touch" class="touch" hidden>
    <div class="t-stick" id="t-stick"><i class="t-knob"></i></div>
    <div class="t-btns">
      <button aria-label="技能" type="button" class="t-b" data-code="KeyN">攻</button>
      <button aria-label="重置" type="button" class="t-b" data-code="KeyR">重</button>
      <button aria-label="冲刺" type="button" class="t-b" data-code="ShiftLeft">闪</button>
      <button type="button" class="t-b" data-code="Space">跳</button>
      <button type="button" class="t-b" data-code="KeyQ">武1</button>
      <button type="button" class="t-b" data-code="KeyE">武2</button>
      <button type="button" class="t-b" data-code="Tab">无双</button>
      <button type="button" class="t-b" data-code="KeyF">防</button>
    </div>
  </div>

  <div id="boot" class="boot">
    <div class="boot-inner">
      <h1>传统割草游戏</h1>
      <p class="boot-sub">3D 割草 · 水墨战场</p>
      <p class="boot-line">正在生成战场地形、光照、摄像机、战斗系统与敌人分层 AI…</p>
    </div>
  </div>

  <div class="hint" id="hint">
    <span class="hint-key">点击画面</span> 锁定鼠标 ·
    <span class="hint-key">WASD</span> 移动 ·
    <span class="hint-key">空格</span> 跳跃 ·
    <span class="hint-key">Shift</span> 闪避 ·
    <span class="hint-key">N/左键</span> 轻攻击 ·
    <span class="hint-key">C/右键</span> 重攻击（按住蓄力）·
    <span class="hint-key">F2</span> 招式表 ·
    <span class="hint-key">F3</span> 面板 ·
    <span class="hint-key">F5</span> 敌人状态环
  </div>

  <div class="reticle" aria-hidden="true"></div>

  <!-- 音频设置（主音量 + 静音）。★ 为什么做成常驻小控件而不是塞进暂停面板：
       本作没有标题页/设置页，暂停面板在桌面端只能靠切后台触发（没有可见入口），
       把音量藏进去等于桌面上无法调节。这颗胶囊放在右下角、避开操作提示条，
       滑杆监听 input（拖动中实时生效），M 键仍然一键静音，两边通过 AudioManager
       的 subscribe 同步 —— 不存在"键盘静音了、按钮还显示声音开"的分叉。 -->
  <div id="audio-ui" class="audio-ui" role="group" aria-label="音频设置">
    <button id="audio-mute" class="au-mute" type="button" aria-pressed="false" title="静音（M）">
      <span class="au-ico" aria-hidden="true">♪</span><span class="au-txt">声音</span>
    </button>
    <input id="audio-vol" class="au-range" type="range" min="0" max="100" step="1" value="100"
           aria-label="主音量" aria-valuetext="100%" />
    <span id="audio-vol-val" class="au-val">100%</span>
  </div>

  <!-- 模块 12：允许第三方加载器（如 vendor/three/jsm 下的 GLTFLoader）用裸 'three' 解析到同一份 three.module.js。
       相对路径导入不受影响；浏览器按解析后的 URL 去重，仍是单一 THREE 实例，零风险。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/": "./vendor/three/jsm/"
    }
  }
  </script>

  <script type="module" src="./src/main.js">
// 页面可见性变化时暂停/恢复游戏循环（避免后台继续消耗资源）
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    // 暂停逻辑：停止 requestAnimationFrame / setInterval
    if (typeof pauseGame === 'function') pauseGame();
  } else {
    // 恢复逻辑：重新开始游戏循环
    if (typeof resumeGame === 'function') resumeGame();
  }
});


// 页面卸载时清理游戏循环（避免后台继续消耗资源）
window.addEventListener('pagehide', function() {
  try {
    if (typeof cancelAnimationFrame === 'function' && window.__mgRAF) cancelAnimationFrame(window.__mgRAF);
  } catch(e) {}
  try {
    if (typeof clearInterval === 'function' && window.__mgIntervals) {
      for (var i = 0; i < window.__mgIntervals.length; i++) clearInterval(window.__mgIntervals[i]);
      window.__mgIntervals = [];
    }
  } catch(e) {}
});

</script>
</body>
</html>
