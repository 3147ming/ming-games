<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12151C">
<meta name="description" content="躺平守夜 —— 上床产金币、升门建炮台，扛过五个夜晚的猎梦者。">
<title>躺平守夜 · NIGHT WATCH</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312151C'/%3E%3Crect x='7' y='13' width='18' height='9' rx='2' fill='%23E8DCC8'/%3E%3Ccircle cx='16' cy='9' r='4' fill='%23FF5C6C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
:root{
  --ac:#FF8A3D; --red:#FF3B3B; --gold:#FFC65C; --volt:#6FD3FF; --paper:#F2EEE6; --dim:#9AA3B2;
  --line:#2C3340; --bg:#12151C; --tile:#3B4A5E; --corr:#2A2F3A; --panel:#0E1116;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07090C;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:var(--paper);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:relative;width:100vw;height:100vh;max-width:900px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 70% at 50% 0%,#1B2230 0%,#0A0D12 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:rgba(6,8,12,.9);padding:2.2vmin}
.ov.on{display:flex}
h1,h2,h3,p{margin:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;text-align:center}
.big{font-size:clamp(22px,4.2vmin,38px);letter-spacing:.1em;color:var(--paper)}
.red{color:var(--red);text-shadow:0 0 18px rgba(255,59,59,.45)}
.btn{border:none;border-radius:10px;padding:1vmin 2.2vmin;font:inherit;font-weight:700;cursor:pointer;
  background:var(--ac);color:#221000;font-size:clamp(12px,1.9vmin,16px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:500}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:.6vmin 1.2vmin;font-size:clamp(11px,1.6vmin,14px)}
.btn[disabled]{filter:grayscale(1) brightness(.65);cursor:default}
.hint{color:var(--dim);font-size:clamp(10px,1.5vmin,13px);line-height:1.8}
.row{display:flex;gap:1.2vmin;flex-wrap:wrap;justify-content:center}
/* 标题 / 商店 */
#ov-title{padding:0}
.lobby{display:flex;flex-direction:column;height:100%;padding:3vmin}
.lobby .hero{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.lobby .name{text-align:center;margin-bottom:2vmin}
.lobby .name b{display:block;font-size:clamp(24px,4.6vmin,44px);letter-spacing:.24em;color:#fff}
.lobby .name small{display:block;color:var(--dim);letter-spacing:.4em;font-size:clamp(9px,1.4vmin,12px);margin-top:.6vmin}
.shoprow{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vmin;margin-bottom:2vmin}
.shopcard{background:rgba(30,36,46,.9);border:1px solid var(--line);border-radius:12px;padding:1.4vmin;font-size:clamp(10px,1.5vmin,13px)}
.shopcard b{display:block;color:var(--gold);margin-bottom:.4vmin;font-size:clamp(12px,1.8vmin,15px)}
.shopcard small{color:var(--dim);display:block;line-height:1.6;min-height:3em}
/* 匹配 */
.match{display:flex;flex-direction:column;align-items:center;gap:1.2vmin;height:100%;justify-content:center}
.match .mode{color:var(--red);font-size:clamp(20px,3.6vmin,32px);letter-spacing:.2em;font-weight:800;
  text-shadow:0 0 2px #000,0 0 14px rgba(255,59,59,.5)}
.match .cd{color:#5BE37A;font-size:clamp(12px,1.8vmin,16px);letter-spacing:.12em}
.ghostface{font-size:clamp(52px,9vmin,92px);line-height:1;filter:drop-shadow(0 0 18px rgba(255,60,60,.45))}
.match .vs{color:var(--red);font-size:clamp(28px,5vmin,46px);font-weight:900;letter-spacing:.1em;text-shadow:0 3px 0 #3A0000}
.seats{display:grid;grid-template-columns:repeat(3,minmax(70px,1fr));gap:1.4vmin;width:min(88%,520px)}
.seat{background:rgba(26,30,38,.9);border:1px solid var(--line);border-radius:10px;padding:1vmin .6vmin;text-align:center;
  font-size:clamp(9px,1.35vmin,12px);color:var(--dim)}
.seat.me{border:2px solid #fff;color:#fff;background:rgba(60,70,86,.9)}
.seat .av{display:flex;align-items:center;justify-content:center;width:clamp(30px,4.6vmin,40px);height:clamp(30px,4.6vmin,40px);margin:0 auto .4vmin;border-radius:50%;background:#333B48;color:#D6DFEC;font-size:clamp(13px,2vmin,17px);font-weight:700}
.ready{width:min(86%,520px);border:3px solid var(--red);border-radius:12px;background:rgba(60,0,0,.35);
  color:#FF6B6B;font-size:clamp(18px,3.2vmin,28px);letter-spacing:.2em;font-weight:800;padding:1.6vmin;cursor:pointer}
.ready.on{background:var(--red);color:#fff}
/* 对局面板 */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid #333B48;
  border-radius:14px 14px 0 0;padding:1.6vmin 2vmin 2.4vmin;display:none;flex-direction:column;gap:1.2vmin;
  max-height:64%;z-index:8}
.sheet.on{display:flex}
.sheet .st{display:flex;align-items:center;justify-content:space-between}
.sheet .st b{font-size:clamp(18px,2.8vmin,26px);color:#FF9B4D;letter-spacing:.2em;
  text-shadow:-1px -1px 0 #7A3200,1px 1px 0 #7A3200}
.tabsrow{display:flex;gap:.8vmin;flex-wrap:wrap}
.tabpill{padding:.7vmin 1.4vmin;border-radius:8px;background:#1A1F27;border:1px solid var(--line);
  color:var(--dim);font-size:clamp(10px,1.5vmin,13px);cursor:pointer}
.tabpill.on{background:#EDF1F6;color:#12151C;font-weight:700}
.blist{overflow-y:auto;display:flex;flex-direction:column;gap:1vmin;padding-right:.6vmin}
.bcard{display:flex;gap:1.2vmin;align-items:center;background:#171C24;border:1px solid var(--line);
  border-radius:10px;padding:1vmin;cursor:pointer}
.bcard.lock{opacity:.5}
.bcard .ic{width:clamp(44px,7vmin,62px);height:clamp(44px,7vmin,62px);border-radius:8px;flex:none;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:clamp(18px,2.9vmin,25px);color:#CFE0F2;
  background:linear-gradient(180deg,#2A3240,#1B2029);border:1px solid #39424F}
.bcard .txt{flex:1;min-width:0}
.bcard .txt b{display:block;font-size:clamp(11px,1.7vmin,14px)}
.bcard .txt small{display:block;color:var(--dim);font-size:clamp(9px,1.35vmin,12px);line-height:1.5}
.bcard .cost{text-align:right;flex:none;font-size:clamp(10px,1.5vmin,13px)}
.bcard .cost b{display:block;color:var(--gold)}
.bcard .cost span{color:var(--volt)}
.bcard .cost small{color:#7C8698;font-size:.9em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="1600"></canvas>

  <!-- 主界面 -->
  <div class="ov on" id="ov-title">
    <div class="lobby">
      <div class="name"><b>躺平守夜</b><small>NIGHT WATCH</small></div>
      <div class="hero"><canvas id="hero-cv" width="320" height="360" style="height:min(46vh,400px);width:auto;max-width:100%"></canvas></div>
      <div class="hint" id="lobby-stat" style="text-align:center;margin-bottom:1.4vmin"></div>
      <div class="shoprow" id="shoprow"></div>
      <div class="row"><button class="btn" id="btn-play">开始匹配</button>
        <button class="btn ghost sm" id="btn-reset">清空存档</button></div>
    </div>
  </div>

  <!-- 匹配 -->
  <div class="ov" id="ov-match">
    <div class="match">
      <div class="mode">普通模式</div>
      <div class="cd" id="match-cd">匹配中 3s</div>
      <div class="ghostface"><svg viewBox="0 0 120 160" width="120" height="150" aria-hidden="true">
        <path d="M60 20 C40 20 30 36 30 56 L30 120 C30 132 38 140 48 140 L52 128 L60 140 L68 128 L72 140 C82 140 90 132 90 120 L90 56 C90 36 80 20 60 20 Z" fill="#2B1436" stroke="#6C3C86" stroke-width="3"/>
        <path d="M32 52 C32 30 44 14 60 14 C76 14 88 30 88 52 L88 74 C80 60 72 66 66 56 C58 68 46 60 38 74 Z" fill="#150A1E"/>
        <circle cx="48" cy="64" r="5" fill="#FF3B3B"/><circle cx="72" cy="64" r="5" fill="#FF3B3B"/>
        <path d="M50 90 Q60 98 70 90" stroke="#8A5AA0" stroke-width="3" fill="none"/>
      </svg></div>
      <div style="color:#FF5C6C;letter-spacing:.2em;font-size:clamp(11px,1.7vmin,14px)">猎 梦 者</div>
      <div class="vs">VS</div>
      <div class="seats" id="seats"></div>
      <button class="ready" id="btn-ready">准 备</button>
    </div>
  </div>

  <!-- 结算 -->
  <div class="ov" id="ov-end">
    <div class="center">
      <div class="big" id="end-title">守住了</div>
      <div class="hint" id="end-sub"></div>
      <div class="hint" id="end-body"></div>
      <div class="row"><button class="btn" id="end-retry">再来一局</button>
        <button class="btn ghost" id="end-home">回主界面</button></div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="ov" id="ov-pause">
    <div class="center">
      <div class="big">暂停</div>
      <div class="hint" id="pause-info"></div>
      <div class="row"><button class="btn" id="p-resume">继续</button>
        <button class="btn ghost" id="p-quit">退出</button></div>
    </div>
  </div>

  <!-- 建造 / 升级 面板 -->
  <div class="sheet" id="sheet">
    <div class="st"><b id="sheet-title">建筑</b><button class="btn ghost sm" id="sheet-close">关闭</button></div>
    <div class="tabsrow" id="sheet-tabs"></div>
    <div class="blist" id="sheet-list"></div>
  </div>
</div>
<script>
(function () {
'use strict';
var W = 720, H = 1600;
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 布局 ---------- */
var GEO = {
  COLS: 7, ROWS: 8, CELL: 92,
  X0: 36, Y0: 340,
  CORR_Y: 236, CORR_H: 96,
  AVATAR_Y: 156, RES_Y: 96
};

var CONFIG = {
  dayLen: 35,
  nightLen: 30,
  bed: [
    { name: '破旧小床', rate: 4, cost: 0 },
    { name: '简陋的床', rate: 8, cost: 60 },
    { name: '铁架床', rate: 16, cost: 160, door: 1 },
    { name: '木架床', rate: 32, cost: 420, door: 2 },
    { name: '舒服的床', rate: 65, cost: 900, door: 3 },
    { name: '弹簧床', rate: 128, cost: 1800, door: 4 }
  ],
  door: [
    { name: '木门', hp: 700, cost: 0 },
    { name: '木门·2', hp: 1100, cost: 120 },
    { name: '铁门', hp: 1500, cost: 300 },
    { name: '钢门', hp: 1900, cost: 700 },
    { name: '合金门', hp: 2300, cost: 1500 },
    { name: '圣光门', hp: 2700, cost: 3000 }
  ],
  turret: [
    { name: '帚炮台', cost: 8, atk: 4, cd: 0.9 },
    { name: '铲铲炮台', cost: 16, atk: 8, cd: 0.9 },
    { name: '鱼叉炮台', cost: 32, atk: 16, cd: 0.9 },
    { name: '喷射水枪', cost: 64, atk: 32, cd: 0.85 },
    { name: '高压水枪', cost: 128, atk: 64, cd: 0.85 },
    { name: '气泡发射器', cost: 256, atk: 128, cd: 0.8 },
    { name: '魔力气泡机', cost: 1024, volt: 32, atk: 256, cd: 0.8 },
    { name: '驱魔气泡机', cost: 2048, volt: 64, atk: 512, cd: 0.8 },
    { name: '初级激光器', cost: 4096, volt: 128, atk: 1024, cd: 0.75 },
    { name: '恶魔激光器', cost: 8192, volt: 256, atk: 2048, cd: 0.75 },
    { name: '圣光生成器', cost: 16384, volt: 512, atk: 4096, cd: 0.7 },
    { name: '圣光发射器', cost: 32768, volt: 1024, atk: 8192, cd: 0.7 },
    { name: '圣光炮台', cost: 65536, volt: 2048, atk: 16384, cd: 0.65 },
    { name: '马桶炮台', cost: 131072, volt: 3027, atk: 32768, cd: 0.6 },
    { name: '七色花炮台', cost: 262144, volt: 4096, atk: 65536, cd: 0.55 }
  ],
  money: [
    { id: 'game', name: '发霉游戏机', cost: 200, cur: 'coin', volt: 1, per: 2, desc: '每 2 秒产出 1 闪电' },
    { id: 'copper', name: '铜矿', cost: 128, cur: 'volt', coin: 8, desc: '每秒产出 8 金币' },
    { id: 'silver', name: '银矿', cost: 1024, cur: 'volt', coin: 32, desc: '每秒产出 32 金币' },
    { id: 'gold', name: '金矿', cost: 2048, cur: 'volt', coin: 128, desc: '每秒产出 128 金币' },
    { id: 'diamond', name: '钻石矿', cost: 4096, cur: 'volt', coin: 512, desc: '每秒产出 512 金币' }
  ],
  tech: [
    { id: 'repair', name: '维修台', cost: 64, desc: '每秒回复门 2% 生命，无距离限制', icon: '🔧' },
    { id: 'bubble', name: '能量罩', cost: 64, desc: '门低于 30% 时触发 3 秒无敌', icon: '🛡' },
    { id: 'atm', name: '取款机', cost: 32, desc: '炮台击杀时偷取金币，额随炮台等级', icon: '🏧' },
    { id: 'watch', name: '瞭望台', cost: 256, desc: '所有炮台射程 +20%', icon: '🔭' },
    { id: 'talisman', name: '符咒弹射器', cost: 65, desc: '30% 概率顶掉鬼的一次技能', icon: '🧿' },
    { id: 'fridge', name: '冰箱', cost: 256, desc: '鬼的攻速 −20%', icon: '❄' }
  ],
  dark: [
    { id: 'box', name: '修狗魔盒', cost: 10, cur: 'coin', desc: '随机变出道具，或免费升一级炮台', icon: '🎁' },
    { id: 'coil', name: '电磁圈', cost: 2048, desc: '定身鬼 3 秒', icon: '⚡' },
    { id: 'accel', name: '粒子加速器', cost: 512, desc: '全场炮台攻速 +15%', icon: '🚀' },
    { id: 'doorcard', name: '房门升级卡', cost: 300, cur: 'coin', desc: '立刻把门升一级（不超过上限）', icon: '🪪' }
  ],
  ghost: {
    baseHp: 260, hpPerNight: 240, bossHp: 3200,
    dmg: 14, scratchCd: 0.6,
    shockCd: 13, rageCd: 22
  }
};

/* ---------- 存档 ---------- */
var SKEY = 'mg_sleeper.v1';
function defaultSave() {
  return { maxRoom: 0, maxWave: 0, wins: 0, runs: 0, coins: 120, items: [], carry: [], muted: false };
}
var save = defaultSave();
(function load() {
  try {
    var raw = localStorage.getItem(SKEY);
    if (raw) { var o = JSON.parse(raw); for (var k in save) if (o[k] !== undefined) save[k] = o[k]; }
  } catch (e) {}
})();
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} }

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function irnd(a, b) { return Math.floor(rnd(a, b + 1)); }
function el(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toString(); }

/* ---------- 音效 ---------- */
var AC = null, muted = !!save.muted;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function beep(f, d, t, v, to) {
  if (muted) return;
  var a = actx(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = t || 'sine'; o.frequency.value = f;
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), a.currentTime + d);
    g.gain.value = v || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02);
  } catch (e) {}
}
var SFX = {
  coin: function () { beep(1000, 0.05, 'sine', 0.045); },
  build: function () { beep(220, 0.12, 'square', 0.05, 320); },
  hit: function () { beep(180, 0.06, 'square', 0.04, 120); },
  scratch: function () { beep(120, 0.09, 'sawtooth', 0.05, 70); },
  die: function () { [400, 300, 200].forEach(function (f, i) { setTimeout(function () { beep(f, 0.2, 'triangle', 0.07); }, i * 140); }); },
  night: function () { beep(90, 0.7, 'sawtooth', 0.08, 50); },
  win: function () { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { beep(f, 0.2, 'sine', 0.06); }, i * 120); }); }
};
/* =========================================================================
 * 舞台
 * ========================================================================= */
var stage = el('stage'), cv = el('cv'), ctx = cv.getContext('2d');
var DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
function fitStage() {
  var r = stage.getBoundingClientRect();
  var s = Math.min(r.width / W, r.height / H);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();

function toLogical(cx, cy) {
  var r = cv.getBoundingClientRect();
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}

/* ---------- 房间几何 ---------- */
var C = GEO.CELL, X0 = 104, Y0 = 400;
function cellX(c) { return X0 + c * C; }
function cellY(r) { return Y0 + r * C; }
function cellCenter(c, r) { return { x: cellX(c) + C / 2, y: cellY(r) + C / 2 }; }

var G = null;
var UI = { time: 0, paused: false, hover: null, shake: 0, sheet: null };

function newGame() {
  var g = {
    night: 1, phase: 'day', timer: CONFIG.dayLen, coins: 90, volt: 8,
    doorLv: 0, doorHp: CONFIG.door[0].hp, doorMax: CONFIG.door[0].hp,
    bedLv: 0, lying: false, ghost: null, speed: 1,
    cells: [], money: [], tech: [], texts: [], parts: [], shots: [],
    kills: 0, scratchAcc: 0, guide: 0, log: [], payout: 0, built: 0,
    neighbors: [
      { name: '俞红', hp: 1, max: 1 }, { name: '常富纷', hp: 1, max: 1 },
      { name: '水铬冬', hp: 1, max: 1 }, { name: '吴成', hp: 1, max: 1 }, { name: '史洪', hp: 1, max: 1 }
    ],
    ghostLevel: 1
  };
  for (var r = 0; r < GEO.ROWS; r++) for (var c = 0; c < GEO.COLS; c++) {
    g.cells.push({ c: c, r: r, kind: 'empty', wall: false });
  }
  /* 右上角挖空 2×2（L 形） */
  [0, 1].forEach(function (dr) {
    [GEO.COLS - 2, GEO.COLS - 1].forEach(function (c) {
      var cell = g.cells.filter(function (x) { return x.c === c && x.r === dr; })[0];
      if (cell) cell.wall = true;
    });
  });
  var bed = g.cells.filter(function (x) { return x.c === 2 && x.r === 3; })[0];
  if (bed) bed.kind = 'bed';
  var door = g.cells.filter(function (x) { return x.c === 0 && x.r === 3; })[0];
  if (door) door.kind = 'door';
  return g;
}

function cellAt(c, r) {
  if (c < 0 || r < 0 || c >= GEO.COLS || r >= GEO.ROWS) return null;
  return G.cells[r * GEO.COLS + c];
}
function buildable(cell) { return cell && !cell.wall && cell.kind === 'empty'; }

/* =========================================================================
 * 渲染
 * ========================================================================= */
function render() {
  var t = UI.time;
  if (!G) {
    var g0 = ctx.createLinearGradient(0, 0, 0, H);
    g0.addColorStop(0, '#171B23'); g0.addColorStop(1, '#0A0D12');
    ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);
    return;
  }
  ctx.save();
  if (UI.shake > 0) ctx.translate(rnd(-UI.shake, UI.shake), rnd(-UI.shake, UI.shake));

  drawBackdrop(t);
  drawCorridor(t);
  drawRoom(t);
  drawGhost(t);
  drawShots(t);
  drawParts();
  drawTexts();
  drawFlash();
  drawHUD(t);
  ctx.restore();
}

/* 整晚横幅：跳过夜专用，避免压在格子上看不清 */
function drawFlash() {
  if (!G || !G.flash) return;
  var f = G.flash;
  var kin = Math.min(1, f.t / 0.2);
  var kout = Math.min(1, Math.max(0, (f.dur - f.t) / 0.45));
  var a = Math.min(kin, kout);
  if (a <= 0.01) return;
  var w = 620, h = 118, x = (W - w) / 2, y = 1262 - (1 - kin) * 14;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(8,12,20,.92)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 20) : ctx.rect(x, y, w, h); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E8EDF6'; ctx.font = '700 34px "PingFang SC",system-ui';
  ctx.fillText(f.txt, W / 2, y + 50);
  ctx.fillStyle = '#8E99AB'; ctx.font = '400 18px "PingFang SC",system-ui';
  ctx.fillText(f.sub, W / 2, y + 84);
  ctx.restore();
}

function drawBackdrop(t) {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#171B23'); g.addColorStop(0.5, '#10141B'); g.addColorStop(1, '#0A0D12');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  /* 墙面砖纹 */
  ctx.strokeStyle = 'rgba(255,255,255,.022)'; ctx.lineWidth = 1;
  for (var y = 0; y < H; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (var y2 = 0; y2 < H; y2 += 64) {
    var off = (y2 / 64) % 2 ? 32 : 0;
    for (var x = -40; x < W; x += 96) {
      ctx.beginPath(); ctx.moveTo(x + off, y2); ctx.lineTo(x + off, y2 + 64); ctx.stroke();
    }
  }
}

function drawCorridor(t) {
  var y = GEO.CORR_Y, h = GEO.CORR_H;
  ctx.fillStyle = '#232833'; ctx.fillRect(0, y, W, h);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, y, W, 3);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, y + h - 4, W, 4);
  /* 砖缝 */
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
  for (var x = 0; x < W; x += 46) {
    ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y + h - 6); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0, y + h / 2); ctx.lineTo(W, y + h / 2); ctx.stroke();

  /* 邻居门（左右各 2~3 个，中间留给倒计时） */
  var spots = [56, 150, 560, 654];
  spots.forEach(function (sx, i) {
    var nb = G.neighbors[i];
    ctx.fillStyle = '#2C3542'; ctx.fillRect(sx - 26, y + 18, 52, h - 30);
    ctx.fillStyle = nb.hp > 0.3 ? '#3E7D5A' : '#7A3030';
    ctx.fillRect(sx - 22, y + 22, 44, h - 38);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(sx - 22, y + h - 40, 44, 6);
    ctx.fillStyle = '#8FE36B'; ctx.fillRect(sx - 22, y + h - 40, 44 * clamp(nb.hp, 0, 1), 6);
    ctx.fillStyle = 'rgba(220,230,245,.7)'; ctx.font = '600 15px "PingFang SC",system-ui';
    ctx.textAlign = 'center'; ctx.fillText(nb.name, sx, y + h - 6);
  });
}

function drawRoom(t) {
  /* 墙体 */
  var rx = X0 - 10, ry = Y0 - 10, rw = GEO.COLS * C + 20, rh = GEO.ROWS * C + 20;
  ctx.fillStyle = '#1A1E26'; ctx.fillRect(rx - 8, ry - 8, rw + 16, rh + 16);
  ctx.strokeStyle = '#3A4351'; ctx.lineWidth = 3; ctx.strokeRect(rx - 8, ry - 8, rw + 16, rh + 16);

  /* 地板 */
  G.cells.forEach(function (cell) {
    var x = cellX(cell.c), y = cellY(cell.r);
    if (cell.wall) {
      ctx.fillStyle = '#1E232C'; ctx.fillRect(x, y, C, C);
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.strokeRect(x + 1, y + 1, C - 2, C - 2);
      return;
    }
    ctx.fillStyle = '#3B4A5E'; ctx.fillRect(x + 1, y + 1, C - 2, C - 2);
    var g = ctx.createLinearGradient(x, y, x, y + C);
    g.addColorStop(0, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(0,0,0,.12)');
    ctx.fillStyle = g; ctx.fillRect(x + 1, y + 1, C - 2, C - 2);
    ctx.strokeStyle = 'rgba(12,16,22,.85)'; ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, C - 2, C - 2);
    if (cell.kind === 'empty' && !cell.wall) {
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + C / 2 - 11, y + C / 2); ctx.lineTo(x + C / 2 + 11, y + C / 2);
      ctx.moveTo(x + C / 2, y + C / 2 - 11); ctx.lineTo(x + C / 2, y + C / 2 + 11);
      ctx.stroke();
    }
  });

  G.cells.forEach(function (cell) {
    if (cell.kind === 'bed') drawBed(cell, t);
    else if (cell.kind === 'door') drawDoor(cell, t);
    else if (cell.kind === 'turret') drawTurret(cell, t);
    else if (cell.kind === 'money') drawMoney(cell, t);
    else if (cell.kind === 'tech' || cell.kind === 'dark') drawTech(cell, t);
  });

  drawGuide();
}

function drawBed(cell, t) {
  var x = cellX(cell.c), y = cellY(cell.r);
  ctx.save();
  ctx.translate(x, y);
  /* 床板 */
  ctx.fillStyle = '#5E4227'; ctx.fillRect(4, 10, C - 8, C - 18);
  ctx.fillStyle = '#7A5A35'; ctx.fillRect(4, 10, C - 8, 12);
  ctx.fillStyle = '#4A3320'; ctx.fillRect(4, 10, 7, C - 18);
  /* 被子 */
  var bg = ctx.createLinearGradient(0, 34, 0, C);
  bg.addColorStop(0, '#B9CDE6'); bg.addColorStop(1, '#8FA8C4');
  ctx.fillStyle = bg; ctx.fillRect(12, 34, C - 20, C - 48);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(12, 44); ctx.lineTo(C - 8, 44); ctx.stroke();
  /* 枕头 */
  ctx.fillStyle = '#F3F6FA';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(16, 18, C - 34, 22, 8) : ctx.rect(16, 18, C - 34, 22);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(16, 36, C - 34, 3);
  /* 等级角标 */
  ctx.fillStyle = 'rgba(10,14,20,.78)';
  ctx.beginPath(); ctx.arc(C - 16, C - 16, 12, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#FFC65C'; ctx.font = '700 14px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(G.bedLv + 1, C - 16, C - 11);
  /* 玩家躺床 */
  if (G.lying) {
    ctx.fillStyle = '#12151C';
    ctx.beginPath(); ctx.arc(30, 31, 9, 0, 6.284); ctx.fill();
    ctx.fillRect(38, 24, 34, 13);
    ctx.fillRect(38, 24, 12, 24);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '600 13px "PingFang SC",system-ui';
    ctx.textAlign = 'left';
    for (var i = 0; i < 2; i++) {
      var zz = (t * 0.8 + i * 0.5) % 1;
      ctx.globalAlpha = (1 - zz) * 0.8;
      ctx.fillText('z', 66 + zz * 10, 30 - zz * 18);
    }
    ctx.globalAlpha = 1;
  }
  /* 产币金光 */
  if (G.lying) {
    var pulse = 0.5 + Math.sin(t * 4) * 0.5;
    ctx.globalAlpha = 0.12 + pulse * 0.1;
    ctx.fillStyle = '#FFD34D';
    ctx.beginPath(); ctx.arc(C / 2, C / 2, 40, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawDoor(cell, t) {
  var x = cellX(cell.c), y = cellY(cell.r);
  var ratio = clamp(G.doorHp / G.doorMax, 0, 1);
  ctx.save(); ctx.translate(x, y);
  var shake = G.ghost && G.ghost.state === 'scratch' ? Math.sin(t * 40) * 2 : 0;
  ctx.translate(shake, 0);
  /* 门框 */
  ctx.fillStyle = '#242A34'; ctx.fillRect(2, 2, C - 4, C - 4);
  var col = ['#3E7D5A', '#4E8F66', '#6C7F92', '#8296AB', '#B9C6D6', '#F2E6B8'][G.doorLv] || '#3E7D5A';
  ctx.fillStyle = col; ctx.fillRect(8, 8, C - 16, C - 16);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(8, 8, C - 16, 6);
  /* 门条纹 */
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 2;
  for (var i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(8, 8 + i * (C - 16) / 4); ctx.lineTo(C - 8, 8 + i * (C - 16) / 4); ctx.stroke();
  }
  /* 把手 */
  ctx.fillStyle = '#E8DCC8'; ctx.beginPath(); ctx.arc(C - 22, C / 2, 4, 0, 6.284); ctx.fill();
  /* 血条 */
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(4, -14, C - 8, 10);
  ctx.fillStyle = ratio > 0.3 ? '#7ED957' : '#FF5C6C';
  ctx.fillRect(5, -13, (C - 10) * ratio, 8);
  ctx.fillStyle = '#fff'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(fmt(G.doorHp) + '/' + fmt(G.doorMax), C / 2, -4);
  /* 等级 */
  ctx.fillStyle = 'rgba(10,14,20,.8)'; ctx.beginPath(); ctx.arc(16, C - 16, 12, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#FFC65C'; ctx.font = '700 14px system-ui'; ctx.fillText(G.doorLv + 1, 16, C - 11);
  /* 抓痕 */
  if (G.ghost && G.ghost.state === 'scratch' && G.ghost.claw > 0) {
    ctx.strokeStyle = 'rgba(255,70,70,.85)'; ctx.lineWidth = 3;
    for (var k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.moveTo(20 + k * 14, 20 + G.ghost.claw * 10);
      ctx.lineTo(30 + k * 14, 62 + G.ghost.claw * 10);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function turretColor(lv) {
  var cols = ['#8FA3B8', '#9FB6C6', '#7ED9C3', '#6FD3FF', '#5B9DF9', '#B08BFF', '#C084FC',
    '#FF8AD8', '#FF6B9D', '#FF9C6B', '#FFC65C', '#F5E06B', '#FFEE9C', '#E8F4FF', '#FF7EDB'];
  return cols[clamp(lv, 0, 14)];
}

function drawTurret(cell, t) {
  var x = cellX(cell.c), y = cellY(cell.r);
  var lv = cell.lv || 0;
  ctx.save(); ctx.translate(x + C / 2, y + C / 2);
  /* 底座 */
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, 22, 30, 10, 0, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#2C3542';
  ctx.beginPath(); ctx.arc(0, 14, 24, 0, 6.284); ctx.fill();
  ctx.fillStyle = turretColor(lv);
  ctx.beginPath(); ctx.arc(0, 12, 18, 0, 6.284); ctx.fill();
  /* 炮管 */
  var aim = G.ghost ? Math.atan2(G.ghost.y - (y + C / 2), G.ghost.x - (x + C / 2)) : -1.2;
  ctx.save(); ctx.rotate(aim);
  ctx.fillStyle = '#1A2028'; ctx.fillRect(0, -7, 34, 14);
  ctx.fillStyle = turretColor(lv); ctx.fillRect(24, -5, 10, 10);
  ctx.restore();
  /* 等级 */
  ctx.fillStyle = 'rgba(8,12,18,.82)';
  ctx.beginPath(); ctx.arc(0, 20, 11, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#FFC65C'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(lv + 1, 0, 25);
  ctx.restore();
}

function drawMoney(cell, t) {
  var x = cellX(cell.c), y = cellY(cell.r);
  ctx.save(); ctx.translate(x + C / 2, y + C / 2);
  if (cell.key === 'game') {
    ctx.fillStyle = '#39424F'; ctx.fillRect(-26, -30, 52, 56);
    ctx.fillStyle = '#7ED9C3'; ctx.fillRect(-20, -24, 40, 22);
    ctx.fillStyle = '#0E1116'; ctx.fillRect(-13, -18, 26, 11);
    ctx.fillStyle = '#FFC65C'; ctx.beginPath(); ctx.arc(0, 16, 5, 0, 6.284); ctx.fill();
  } else {
    var col = { copper: '#C9855B', silver: '#C9D2DE', gold: '#FFC65C', diamond: '#7FE3FF' }[cell.key] || '#C9855B';
    ctx.fillStyle = '#2A3240';
    ctx.beginPath(); ctx.moveTo(-26, 20); ctx.lineTo(0, 6); ctx.lineTo(26, 20); ctx.lineTo(26, 30); ctx.lineTo(-26, 30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(-12, 6); ctx.lineTo(0, -14); ctx.lineTo(12, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(0, -8); ctx.lineTo(4, 2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawTech(cell, t) {
  var x = cellX(cell.c), y = cellY(cell.r);
  ctx.save(); ctx.translate(x + C / 2, y + C / 2);
  var dark = cell.kind === 'dark';
  ctx.fillStyle = dark ? '#3A1F3E' : '#28323E';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-26, -26, 52, 52, 9) : ctx.rect(-26, -26, 52, 52);
  ctx.fill();
  ctx.strokeStyle = dark ? '#C084FC' : '#6FD3FF'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = dark ? '#E8C6FF' : '#BFE9FF';
  ctx.font = '700 20px "PingFang SC",system-ui'; ctx.textAlign = 'center';
  ctx.fillText((cell.key || '?').slice(0, 1).toUpperCase(), 0, 7);
  ctx.restore();
}

function drawGhost(t) {
  var g = G.ghost;
  if (!g) return;
  var x = g.x, y = g.y;
  if (g.state === 'enter') {
    /* 从走廊降下来 */
  }
  ctx.save();
  ctx.translate(x, y);
  var bob = Math.sin(t * 3) * 4;
  ctx.globalAlpha = 0.9;
  /* 裙摆 */
  ctx.fillStyle = '#3A1B4E';
  ctx.beginPath();
  ctx.moveTo(-22, 20); ctx.quadraticCurveTo(-28, -10, -12, -20);
  ctx.lineTo(12, -20); ctx.quadraticCurveTo(28, -10, 22, 20);
  ctx.quadraticCurveTo(0, 30, -22, 20); ctx.fill();
  /* 身体/手臂 */
  ctx.fillStyle = '#1A0F24';
  ctx.fillRect(-10, -24 + bob, 20, 34);
  ctx.strokeStyle = '#1A0F24'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  var sw = g.state === 'scratch' ? Math.sin(t * 22) * 12 : Math.sin(t * 2) * 4;
  ctx.beginPath(); ctx.moveTo(-8, -18 + bob); ctx.lineTo(-24 - sw, -2 + bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, -18 + bob); ctx.lineTo(24 + sw, -4 + bob); ctx.stroke();
  /* 头 */
  ctx.fillStyle = '#F0E4DA';
  ctx.beginPath(); ctx.arc(0, -34 + bob, 13, 0, 6.284); ctx.fill();
  /* 头发 */
  ctx.fillStyle = '#160B1E';
  ctx.beginPath();
  ctx.arc(0, -38 + bob, 14, Math.PI, 0);
  ctx.lineTo(14, -26 + bob);
  ctx.quadraticCurveTo(4, -30 + bob, -14, -24 + bob);
  ctx.closePath(); ctx.fill();
  /* 眼睛 */
  ctx.fillStyle = '#FF3B3B';
  ctx.beginPath(); ctx.arc(-5, -34 + bob, 2.2, 0, 6.284); ctx.arc(5, -34 + bob, 2.2, 0, 6.284); ctx.fill();
  ctx.restore();

  /* 血条 + 等级 */
  var bw = 90;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - bw / 2, y - 92, bw, 9);
  ctx.fillStyle = '#FF5C6C';
  ctx.fillRect(x - bw / 2 + 1, y - 91, (bw - 2) * clamp(g.hp / g.maxHp, 0, 1), 7);
  ctx.fillStyle = '#FF7B7B'; ctx.font = '700 15px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('Lv.' + g.level, x, y - 98);
  /* 狂暴/震撼提示 */
  if (g.rage > 0) {
    ctx.fillStyle = '#FF3B3B'; ctx.font = '700 13px "PingFang SC",system-ui';
    ctx.fillText('狂暴', x, y + 42);
  }
}

function drawParts() {
  G.parts.forEach(function (p) {
    var k = p.t / p.dur;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = p.color || '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.4), 0, 6.284); ctx.fill();
    ctx.restore();
  });
}

function drawShots(t) {
  G.shots.forEach(function (s) {
    ctx.save();
    ctx.strokeStyle = s.color || '#FFD34D'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.vx * 0.03, s.y + s.vy * 0.03); ctx.stroke();
    ctx.fillStyle = s.color || '#FFD34D';
    ctx.beginPath(); ctx.arc(s.x, s.y, 3.4, 0, 6.284); ctx.fill();
    ctx.restore();
  });
}

function drawTexts() {
  G.texts.forEach(function (t) {
    ctx.save();
    ctx.globalAlpha = 1 - Math.pow(t.t / t.life, 2);
    ctx.font = '700 ' + t.size + 'px "PingFang SC",system-ui';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
    ctx.restore();
  });
}

function drawGuide() {
  var y = 340;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, y, W, 52);
  ctx.fillStyle = '#F2EEE6'; ctx.font = '600 22px "PingFang SC",system-ui'; ctx.textAlign = 'left';
  ctx.fillText(guideText(), 24, y + 34);
  var done = guideDone();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '500 16px "PingFang SC",system-ui';
  ctx.textAlign = 'right'; ctx.fillText('未完成 ' + done + '/6', W - 24, y + 33);
}

function guideText() {
  if (G.phase === 'night') return '猎梦者来了！升级门、修炮台，撑到天亮';
  if (!G.lying) return '1.点床躺下，床会持续产金币';
  if (G.doorLv === 0) return '2.点门升级木门，门碎了就完了';
  if (!G.cells.some(function (c) { return c.kind === 'turret'; })) return '3.点空地板建一座帚炮台';
  if (!G.tech.length) return '4.点空地造维修台，夜里自动修门';
  if (G.bedLv < 2) return '5.升级床，产币更快';
  return '6.活下去，撑过第 5 晚';
}
function guideDone() {
  var n = 0;
  if (G.lying) n++;
  if (G.doorLv >= 1) n++;
  if (G.cells.some(function (c) { return c.kind === 'turret'; })) n++;
  if (G.tech.length) n++;
  if (G.bedLv >= 2) n++;
  if (G.night >= 3) n++;
  return n;
}

function drawHUD(t) {
  /* 返回 */
  ctx.save();
  ctx.fillStyle = '#FF3B3B'; ctx.font = '900 46px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('‹', 24, 78);
  /* 金币 / 闪电 */
  ctx.fillStyle = '#FFC65C'; ctx.beginPath(); ctx.arc(46, 120, 15, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#8A5A00'; ctx.font = '700 16px system-ui'; ctx.textAlign = 'center'; ctx.fillText('$', 46, 126);
  ctx.fillStyle = '#FFD98A'; ctx.font = '700 26px "PingFang SC",system-ui'; ctx.textAlign = 'left';
  ctx.fillText(fmt(G.coins), 68, 129);
  /* 闪电 */
  ctx.fillStyle = '#6FD3FF';
  ctx.beginPath(); ctx.moveTo(190, 104); ctx.lineTo(178, 126); ctx.lineTo(188, 126); ctx.lineTo(182, 142);
  ctx.lineTo(198, 118); ctx.lineTo(187, 118); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#BFE9FF'; ctx.font = '700 26px "PingFang SC",system-ui';

  ctx.beginPath(); ctx.arc(520, 120, 14, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.arc(520, 114, 5, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.arc(520, 132, 8, 3.4, 6.0); ctx.stroke();
  for (var i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(586 + i * 8, 120, 2.4, 0, 6.284); ctx.fill(); }
  ctx.beginPath(); ctx.arc(660, 120, 13, 0, 6.284); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(660, 111); ctx.lineTo(660, 120); ctx.stroke();
  ctx.restore();

  /* 头像行 */
  var names = ['俞红', '常富纷', '水铬冬', '吴成', '史洪'];
  ctx.save();
  for (var a = 0; a < 6; a++) {
    var ax = 68 + a * 108, ay = 186;
    ctx.fillStyle = a === 2 ? '#3E7D5A' : '#242B36';
    ctx.beginPath(); ctx.arc(ax, ay, 30, 0, 6.284); ctx.fill();
    ctx.strokeStyle = a === 2 ? '#8FE36B' : '#39424F'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ax, ay, 30, 0, 6.284); ctx.stroke();
    ctx.fillStyle = '#C9D4E2'; ctx.font = '600 12px "PingFang SC",system-ui'; ctx.textAlign = 'center';

  }
  ctx.fillStyle = '#242B36'; ctx.beginPath(); ctx.arc(68 + 5 * 108, 186, 30, 0, 6.284); ctx.fill();
  ctx.strokeStyle = '#39424F'; ctx.beginPath(); ctx.arc(68 + 5 * 108, 186, 30, 0, 6.284); ctx.stroke();
  ctx.fillStyle = '#9AA3B2'; ctx.font = '700 22px system-ui'; ctx.fillText('☠', 68 + 5 * 108, 194);

  /* 红色倒计时 */
  if (G.phase === 'day' || G.phase === 'night') {

  /* 产出摘要 */
  ctx.save();
  var sy = 1160;
  ctx.fillStyle = 'rgba(22,27,35,.92)'; ctx.fillRect(24, sy, W - 48, 84);
  ctx.strokeStyle = '#2C3340'; ctx.lineWidth = 2; ctx.strokeRect(24, sy, W - 48, 84);

  ctx.fillStyle = '#FFD98A'; ctx.font = '700 20px "PingFang SC",system-ui';

  var mineRate = 0;

    if (d && d.coin) mineRate += d.coin;
  });
  ctx.fillStyle = '#BFE9FF'; ctx.font = '700 18px "PingFang SC",system-ui';
  ctx.fillText('矿 ' + mineRate + '/s', 320, sy + 54);

  ctx.fillText('门 Lv.' + (G.doorLv + 1) + ' · 床 Lv.' + (G.bedLv + 1), 320, sy + 26);
  ctx.restore();

  /* 底部：倍速 / 暂停 / 本局信息 */
  ctx.save();
  var by = 1482;
  ctx.fillStyle = 'rgba(20,25,33,.9)'; ctx.fillRect(0, 1420, W, H - 1420);
  ctx.strokeStyle = '#2C3340'; ctx.beginPath(); ctx.moveTo(0, 1420); ctx.lineTo(W, 1420); ctx.stroke();
  var sp = G.speed + '×';
  ctx.fillStyle = '#2C3542'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(40, by - 34, 92, 62, 12) : ctx.rect(40, by - 34, 92, 62); ctx.fill();
  ctx.fillStyle = '#F2EEE6'; ctx.font = '700 24px "PingFang SC",system-ui'; ctx.textAlign = 'center';

  ctx.fillText('第 ' + G.night + ' / 5 晚', 190, by - 6);

/* =========================================================================
 * 逻辑
 * ========================================================================= */
function addText(x, y, txt, color, size) {
  G.texts.push({ x: x, y: y, txt: txt, color: color || '#fff', size: size || 18, t: 0, life: 1.1 });
  if (G.texts.length > 40) G.texts.shift();
}
function pop(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, 6.28), v = rnd(30, 120);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, dur: rnd(0.25, 0.6), color: color, r: rnd(1.5, 3.2) });
  }
  if (G.parts.length > 120) G.parts.splice(0, G.parts.length - 120);
}

function bedRate() { return CONFIG.bed[G.bedLv].rate; }

function startNight() {
  G.phase = 'night';
  G.timer = 60;
  /* 原版策略：门等级低于全场平均时，80% 的猎梦者先去别家 */
  var avgDoor = 2;
  if (!G.skipUsed && G.doorLv < avgDoor && Math.random() < 0.8) {
    G.skipUsed = true;
    G.skipNight = true;
    G.ghost = null;
    G.timer = 10;
    G.flash = {
      txt: '猎梦者去了邻居家',
      sub: '门等级低于全场平均，它先去挑软柿子',
      t: 0, dur: 3.6
    };
    return;
  }
  G.skipNight = false;
  var isBoss = G.night >= 5;
  var hp = isBoss ? CONFIG.ghost.bossHp : CONFIG.ghost.baseHp + (G.night - 1) * CONFIG.ghost.hpPerNight;
  G.ghost = {
    x: X0 + 46, y: GEO.CORR_Y + GEO.CORR_H + 10, hp: hp, maxHp: hp,
    state: 'enter', lvl: 1, xp: 0, cd: 0.6, dmg: CONFIG.ghost.dmg * (1 + (G.night - 1) * 0.3),
    claw: 0, rage: 0, shockCd: CONFIG.ghost.shockCd, rageCd: 0, stun: 0, hitFlash: 0,
    boss: isBoss, level: 1
  };
  SFX.night();
  addText(W / 2, 520, isBoss ? '猎梦者·本体降临' : '猎梦者来了', '#FF5C6C', 30);
  UI.shake = REDUCED ? 0 : 6;
}

function endNight() {
  G.phase = 'dawn';
  G.timer = 2.4;
  var bonus = 40 + G.night * 25;
  G.coins += bonus;
  addText(W / 2, 620, '天亮了 · 奖励 ' + bonus + ' 金币', '#FFD34D', 26);
  SFX.win();
  if (G.night >= 5) { setTimeout(function () { winGame(); }, 900); }
}

function winGame() {
  if (!G) return;
  G.phase = 'win';
  save.wins++; save.runs++;
  save.coins += Math.round(G.coins * 0.4);
  save.maxWave = Math.max(save.maxWave, 5);
  persist();
  el('end-title').textContent = '守到天亮了';
  el('end-title').className = 'big';
  el('end-sub').textContent = '五晚全部撑过 · 击杀 ' + G.kills + ' 只猎梦者';
  el('end-body').textContent = '本局金币 ' + fmt(G.coins) + ' · 带回 ' + Math.round(G.coins * 0.4) + ' · 累计通关 ' + save.wins + ' 次';
  showOnly('ov-end');
  SFX.win();
}
function loseGame() {
  if (!G) return;
  G.phase = 'lose';
  save.runs++;
  var comfort = 30 + G.night * 15;
  save.coins += comfort;
  save.maxWave = Math.max(save.maxWave, G.night);
  persist();
  el('end-title').textContent = '门被挠穿了';
  el('end-sub').textContent = '撑到第 ' + G.night + ' 晚 · 击杀 ' + G.kills + ' 只';
  el('end-body').textContent = '安慰奖 +' + comfort + ' 金币 · 累计金币 ' + save.coins;
  showOnly('ov-end');
  SFX.die();
}

function upgradeCost(kind, lv) {
  if (kind === 'bed') return CONFIG.bed[clamp(lv + 1, 0, 5)].cost;
  if (kind === 'door') return CONFIG.door[clamp(lv + 1, 0, 5)].cost;
  return 0;
}

function tryUpgradeBed() {
  if (G.bedLv >= 5) { addText(360, 1200, '已是最高级', '#9AA3B2', 20); return; }
  var next = CONFIG.bed[G.bedLv + 1];
  if (next.door !== undefined && G.doorLv < next.door) {
    addText(360, 1200, '前置：门 Lv.' + (next.door + 1), '#FF8A8D', 20);
    return;
  }
  if (G.coins < next.cost) { addText(360, 1200, '金币不够（需 ' + next.cost + '）', '#FF8A8D', 20); return; }
  G.coins -= next.cost; G.bedLv++;
  addText(360, 1200, '床升级 → ' + CONFIG.bed[G.bedLv].name, '#FFD34D', 22);
  SFX.build(); persistBest();
}
function tryUpgradeDoor() {
  if (G.doorLv >= 5) { addText(360, 1200, '已是最高级', '#9AA3B2', 20); return; }
  var next = CONFIG.door[G.doorLv + 1];
  if (G.coins < next.cost) { addText(360, 1200, '金币不够（需 ' + next.cost + '）', '#FF8A8D', 20); return; }
  G.coins -= next.cost;
  var add = next.hp - G.doorMax;
  G.doorLv++; G.doorMax = next.hp; G.doorHp = next.hp;
  addText(360, 1200, '门升级 → ' + next.name, '#FFD34D', 22);
  SFX.build(); persistBest();
}
function persistBest() {
  save.maxWave = Math.max(save.maxWave, G.night);
  persist();
}

function buildTurret(cell, idx) {
  var def = CONFIG.turret[idx];
  var cost = def.cost, volt = def.volt || 0;
  if (G.coins < cost) { addText(360, 1200, '金币不够（需 ' + cost + '）', '#FF8A8D', 20); return false; }
  if (volt && G.volt < volt) { addText(360, 1200, '闪电不够（需 ' + volt + '）', '#FF8A8D', 20); return false; }
  G.coins -= cost; G.volt -= volt;
  cell.kind = 'turret'; cell.lv = idx; cell.cd = 0;
  addText(cellCenter(cell.c, cell.r).x, cellCenter(cell.c, cell.r).y - 40, '建成 ' + def.name, '#7ED957', 20);
  SFX.build();
  return true;
}
function buildMoney(cell, def) {
  if (def.cur === 'volt') { if (G.volt < def.cost) { addText(360, 1200, '闪电不够（需 ' + def.cost + '）', '#FF8A8D', 20); return false; } G.volt -= def.cost; }
  else { if (G.coins < def.cost) { addText(360, 1200, '金币不够（需 ' + def.cost + '）', '#FF8A8D', 20); return false; } G.coins -= def.cost; }
  cell.kind = 'money'; cell.key = def.id; cell.t = 0;
  addText(cellCenter(cell.c, cell.r).x, cellCenter(cell.c, cell.r).y - 40, '建成 ' + def.name, '#7ED957', 20);
  SFX.build();
  return true;
}
function buildTech(cell, def, dark) {
  if (G.volt < def.cost) { addText(360, 1200, '闪电不够（需 ' + def.cost + '）', '#FF8A8D', 20); return false; }
  G.volt -= def.cost;
  cell.kind = dark ? 'dark' : 'tech'; cell.key = def.id;
  G.tech.push(def.id);
  if (def.id === 'repair') G.hasRepair = true;
  if (def.id === 'bubble') G.hasBubble = true;
  if (def.id === 'atm') G.hasAtm = true;
  if (def.id === 'watch') G.watch = true;
  if (def.id === 'talisman') G.hasTalisman = true;
  if (def.id === 'fridge') G.hasFridge = true;
  if (def.id === 'accel') G.accel = true;
  addText(cellCenter(cell.c, cell.r).x, cellCenter(cell.c, cell.r).y - 40, '建成 ' + def.name, '#7ED957', 20);
  SFX.build();
  return true;
}

function countKind(kind) { return G.cells.filter(function (c) { return c.kind === kind; }).length; }

/* ---- 鬼 ---- */
function updateGhost(dt) {
  var g = G.ghost;
  if (!g) return;
  if (g.stun > 0) { g.stun -= dt; return; }
  var doorX = cellX(0) + C / 2, doorY = cellY(3) + C / 2;
  var standX = X0 - 34, standY = doorY;

  if (g.state === 'enter') {
    var tx = standX, ty = standY;
    var dx = tx - g.x, dy = ty - g.y, d = Math.hypot(dx, dy);
    var sp = 150;
    if (d < 4) { g.state = 'scratch'; g.cd = 0.6; }
    else { g.x += dx / d * sp * dt; g.y += dy / d * sp * dt; }
    return;
  }

  if (g.state === 'dead') return;

  /* 技能 */
  g.shockCd -= dt; g.rageCd -= dt;
  if (g.level >= 3 && g.shockCd <= 0) {
    g.shockCd = CONFIG.ghost.shockCd;
    if (G.hasTalisman && Math.random() < 0.3) {
      addText(g.x, g.y - 120, '符咒抵消', '#C084FC', 18);
    } else {
      G.cells.forEach(function (c) { if (c.kind === 'turret') c.stunT = 1.5; });
      addText(g.x, g.y - 120, '猛鬼震撼', '#FF5C6C', 20);
      UI.shake = REDUCED ? 0 : 5;
    }
  }
  if (g.level >= 6 && g.rageCd <= 0) {
    g.rageCd = CONFIG.ghost.rageCd; g.rage = 10;
    addText(g.x, g.y - 120, '猛鬼狂暴', '#FF3B3B', 20);
  }
  if (g.rage > 0) g.rage -= dt;

  /* 挠门 */
  g.cd -= dt * (g.rage > 0 ? 1.5 : 1) * (G.hasFridge ? 0.8 : 1);
  g.claw = Math.max(0, g.claw - dt * 4);
  if (g.cd <= 0) {
    g.cd = CONFIG.ghost.scratchCd;
    g.claw = 1;
    var dmg = g.dmg * (1 + (g.level - 1) * 0.06);
    G.doorHp -= dmg;
    G.scratchAcc += dmg;
    SFX.scratch();
    UI.shake = REDUCED ? 0 : 2;
    pop(doorX - 20, doorY + rnd(-20, 20), '#C9A15C', 5);
    addText(doorX, doorY - 60, '-' + fmt(dmg), '#FF8A8D', 17);
    g.xp++;
    if (g.xp >= 6 && g.level < 10) {
      g.xp = 0; g.level++;
      addText(g.x, g.y - 110, 'Lv.' + g.level, '#FF7B7B', 18);
    }
    /* 能量罩 */
    if (G.hasBubble && G.doorHp / G.doorMax < 0.3 && !G.bubbleT) {
      G.bubbleT = 3;
      addText(doorX, doorY - 100, '能量罩', '#6FD3FF', 20);
    }
    if (G.doorHp <= 0) { G.doorHp = 0; loseGame(); }
  }
}

function updateTurrets(dt) {
  var g = G.ghost;
  G.cells.forEach(function (cell) {
    if (cell.kind !== 'turret') return;
    if (cell.stunT > 0) { cell.stunT -= dt; return; }
    cell.cd -= dt * (G.accel ? 1.15 : 1);
    if (cell.cd > 0) return;
    var def = CONFIG.turret[cell.lv];
    var range = 380 * (G.watch ? 1.2 : 1);
    var c0 = cellCenter(cell.c, cell.r);
    if (!g || g.state === 'dead') return;
    var d = Math.hypot(g.x - c0.x, g.y - c0.y);
    if (d > range) return;
    cell.cd = def.cd;
    var ang = Math.atan2(g.y - c0.y, g.x - c0.x);
    G.shots.push({ x: c0.x, y: c0.y, vx: Math.cos(ang) * 700, vy: Math.sin(ang) * 700, life: 0.35,
      color: turretColor(cell.lv), dmg: def.atk });
  });
}

function updateShots(dt) {
  for (var i = G.shots.length - 1; i >= 0; i--) {
    var s = G.shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    var g = G.ghost;
    if (g && g.state !== 'dead' && Math.hypot(g.x - s.x, g.y - 24 - s.y) < 34) {
      g.hp -= s.dmg;
      g.hitFlash = 0.1;
      pop(s.x, s.y, '#FFD34D', 3);
      if (g.hp <= 0) { killGhost(); }
      G.shots.splice(i, 1); continue;
    }
    if (s.life <= 0) G.shots.splice(i, 1);
  }
}

function killGhost() {
  var g = G.ghost;
  if (!g || g.state === 'dead') return;
  g.state = 'dead';
  G.kills++;
  SFX.die();
  pop(g.x, g.y - 20, '#C084FC', 16);
  G.ghost = null;
  var gold = 60 + G.night * 30;
  G.coins += gold;
  addText(W / 2, 700, '+' + gold + ' 金币', '#FFD34D', 24);
  endNight();
}

function updateEconomy(dt) {
  if (G.lying) {
    G.coinAcc = (G.coinAcc || 0) + bedRate() * dt;
    if (G.coinAcc >= 1) {
      var n = Math.floor(G.coinAcc);
      G.coinAcc -= n; G.coins += n;
      if (Math.random() < 0.5) {
        var bed = G.cells.filter(function (c) { return c.kind === 'bed'; })[0];
        if (bed) {
          var p = cellCenter(bed.c, bed.r);
          addText(p.x + rnd(-16, 16), p.y - 20, '+' + n, '#FFD34D', 15);
        }
        if (!muted) SFX.coin();
      }
    }
  }
  G.cells.forEach(function (cell) {
    if (cell.kind !== 'money') return;
    cell.t = (cell.t || 0) + dt;
    if (cell.key === 'game') {
      if (cell.t >= 2) { cell.t = 0; G.volt += 1; }
    } else {
      var def = CONFIG.money.filter(function (m) { return m.id === cell.key; })[0];
      if (def) G.coins += def.coin * dt;
    }
  });
  if (G.hasRepair) G.doorHp = Math.min(G.doorMax, G.doorHp + G.doorMax * 0.02 * dt);
  if (G.bubbleT > 0) {
    G.bubbleT -= dt;
    if (G.bubbleT <= 0) G.doorHp = Math.max(G.doorHp, G.doorMax * 0.3);
  }
}

function update(dt) {
  if (!G || UI.paused) return;
  UI.time += dt;
  if (UI.shake > 0) UI.shake = Math.max(0, UI.shake - dt * 22);
  G.texts.forEach(function (t) { t.t += dt; t.y -= dt * 26; });
  G.texts = G.texts.filter(function (t) { return t.t < t.life; });
  if (G.flash) { G.flash.t += dt; if (G.flash.t > G.flash.dur) G.flash = null; }
  for (var i = G.parts.length - 1; i >= 0; i--) {
    var p = G.parts[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt;
    if (p.t > p.dur) G.parts.splice(i, 1);
  }

  if (G.phase === 'day') {
    G.timer -= dt;
    updateEconomy(dt);
    if (G.timer <= 0) startNight();
  } else if (G.phase === 'night') {
    G.timer -= dt;
    updateEconomy(dt);
    if (G.skipNight && !G.ghost) {
      if (G.timer <= 0) { G.skipNight = false; endNight(); }
      return;
    }
    updateTurrets(dt);
    updateGhost(dt);
    updateShots(dt);
    if (G.timer <= 0 && G.ghost) { G.ghost.rage = Math.max(G.ghost.rage, 3); G.timer = 20; }
    /* 邻居影子 */
    if (Math.random() < dt * 0.4) {
      var nb = G.neighbors[irnd(0, G.neighbors.length - 1)];
      nb.hp = Math.max(0.1, nb.hp - rnd(0.01, 0.04));
    }
  } else if (G.phase === 'dawn') {
    G.timer -= dt;
    updateEconomy(dt);
    if (G.timer <= 0 && G.night < 5) {
      G.night++; G.phase = 'day'; G.timer = CONFIG.dayLen; G.lying = false;
      G.doorHp = Math.min(G.doorMax, G.doorHp + G.doorMax * 0.15);
    }
  }
}

/* =========================================================================
 * 交互
 * ========================================================================= */
function hitCell(x, y) {
  var c = Math.floor((x - X0) / C), r = Math.floor((y - Y0) / C);
  if (c < 0 || r < 0 || c >= GEO.COLS || r >= GEO.ROWS) return null;
  return cellAt(c, r);
}

function onDown(ev) {
  if (!G || UI.paused) return;
  var q = toLogical(ev.clientX, ev.clientY);

  if (q.y < 100 && q.x < 80) { confirmQuit(); return; }
  if (q.y > 1440 && q.y < 1530) {
    if (q.x > 30 && q.x < 150) { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 4 : 1; return; }
    if (q.x > 540) { openPause(); return; }
  }
  if (q.y > GEO.CORR_Y && q.y < GEO.CORR_Y + GEO.CORR_H) return;

  var cell = hitCell(q.x, q.y);
  if (!cell) return;
  if (cell.wall) return;
  if (cell.kind === 'bed') {
    if (!G.lying) { G.lying = true; addText(cellCenter(2, 3).x, cellCenter(2, 3).y - 50, '躺平收租', '#7ED957', 18); }
    else openUpgradeSheet(cell);
    return;
  }
  if (cell.kind === 'empty') { openBuildSheet(cell); return; }
  openUpgradeSheet(cell);
}

cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

function closeSheet() {
  el('sheet').classList.remove('on');
  G.selCell = null;
}
function openBuildSheet(cell) {
  G.selCell = cell;
  sheetTab = 'base';
  openSheet('建筑');
}
function openUpgradeSheet(cell) {
  G.selCell = cell;
  sheetTab = 'base';
  openSheet(cell.kind === 'bed' ? '升级床' : cell.kind === 'door' ? '升级门' : '升级');
}

function renderTabs() {
  var box = el('sheet-tabs'); box.innerHTML = '';
  TABS.forEach(function (t) {
    var d = document.createElement('div');
    d.className = 'tabpill' + (t.id === sheetTab ? ' on' : '');
    d.textContent = t.name;
    d.onclick = function () { sheetTab = t.id; renderTabs(); renderSheetList(); };
    box.appendChild(d);
  });
}

function costHtml(cost, volt) {
  var s = '';
  if (cost) s += '<b>💰 ' + cost + '</b>';
  if (volt) s += '<span>⚡ ' + volt + '</span>';
  if (!cost && !volt) s += '<b>免费</b>';
  return s;
}

function rowHtml(icon, name, desc, cost, volt, canBuild, lockText, action) {
  var d = document.createElement('div');
  d.className = 'bcard' + (canBuild ? '' : ' lock');
  d.innerHTML = '<div class="ic">' + icon + '</div><div class="txt"><b>' + name + '</b><small>' + desc + '</small></div>' +
    '<div class="cost">' + costHtml(cost, volt) + '<small>' + (lockText || '') + '</small></div>';
  if (canBuild && action) d.onclick = action;
  return d;
}

function renderSheetList() {
  var box = el('sheet-list'); box.innerHTML = '';
  if (!G) return;
  var cell = G.selCell;

  if (sheetTab === 'base') {
    /* 选中空地时，把「建造炮台」放最前面，避免误点到升级 */
    if (!cell || cell.kind !== 'turret') {
      var t0 = CONFIG.turret[0];
      var turretCount = countKind('turret');
      box.appendChild(rowHtml('炮', '建造 ' + t0.name, '攻击 ' + t0.atk + ' / ' + t0.cd + 's · 每级攻击翻倍', t0.cost, 0,
        !!cell && buildable(cell) && turretCount < 6, cell && buildable(cell) ? '可建造 ' + turretCount + '/6' : '先选空地',
        function () { if (buildTurret(cell, 0)) renderSheetList(); }));
    }
    if (G.bedLv < 5) {
      var nb = CONFIG.bed[G.bedLv + 1];
      var needDoor = nb.door !== undefined && G.doorLv < nb.door;
      box.appendChild(rowHtml('床', '升级床 → ' + nb.name, '产币 ' + nb.rate + '/s（当前 ' + bedRate() + '/s）' +
        (needDoor ? ' · 前置：门 Lv.' + (nb.door + 1) : ''), nb.cost, 0,
        G.coins >= nb.cost && !needDoor, G.coins >= nb.cost && !needDoor ? '可升级' : (needDoor ? '前置不足' : '金币不足'),
        function () { tryUpgradeBed(); renderSheetList(); }));
    } else {
      box.appendChild(rowHtml('床', '床已满级', '产币 ' + bedRate() + '/s', 0, 0, false, '已满级'));
    }
    if (G.doorLv < 5) {
      var nd = CONFIG.door[G.doorLv + 1];
      box.appendChild(rowHtml('门', '升级门 → ' + nd.name, '血量 ' + nd.hp + '（当前 ' + fmt(G.doorMax) + '）', nd.cost, 0,
        G.coins >= nd.cost, G.coins >= nd.cost ? '可升级' : '金币不足',
        function () { tryUpgradeDoor(); renderSheetList(); }));
    } else {
      box.appendChild(rowHtml('门', '门已满级', '圣光门 ' + fmt(G.doorMax) + ' 血', 0, 0, false, '已满级'));
    }
    if (cell && cell.kind === 'turret') {
      if (cell.lv < 14) {
        var nd2 = CONFIG.turret[cell.lv + 1];
        box.appendChild(rowHtml('炮', '升级 → ' + nd2.name, '攻击 ' + nd2.atk + ' / ' + nd2.cd + 's', nd2.cost, nd2.volt || 0,
          G.coins >= nd2.cost && G.volt >= (nd2.volt || 0), '当前 Lv.' + (cell.lv + 1),
          function () {
            if (G.coins < nd2.cost || G.volt < (nd2.volt || 0)) { addText(360, 1040, '资源不足', '#FF8A8D', 18); return; }
            G.coins -= nd2.cost; G.volt -= nd2.volt || 0; cell.lv = cell.lv + 1;
            addText(360, 1040, '炮台 → ' + nd2.name, '#7ED957', 20); SFX.build(); renderSheetList();
          }));
      } else {
        box.appendChild(rowHtml('炮', '七色花炮台 · 满级', '攻击 65536 / 0.55s', 0, 0, false, '已满级'));
      }
    }
  }

  if (sheetTab === 'money') {
    CONFIG.money.forEach(function (def) {
      var cnt = G.cells.filter(function (c) { return c.kind === 'money' && c.key === def.id; }).length;
      var afford = def.cur === 'volt' ? G.volt >= def.cost : G.coins >= def.cost;
      box.appendChild(rowHtml('矿', def.name, def.desc, def.cur === 'coin' ? def.cost : 0, def.cur === 'volt' ? def.cost : 0,
        !!cell && buildable(cell) && afford && cnt < 2, cell && buildable(cell) ? '可建造 ' + cnt + '/2' : '先选空地',
        function () { if (buildMoney(cell, def)) renderSheetList(); }));
    });
  }

  if (sheetTab === 'tech') {
    CONFIG.tech.forEach(function (def) {
      var has = G.tech.indexOf(def.id) >= 0;
      box.appendChild(rowHtml('技', def.name, def.desc, 0, def.cost,
        !!cell && buildable(cell) && G.volt >= def.cost && !has, has ? '已建造' : (cell && buildable(cell) ? '可建造 0/1' : '先选空地'),
        function () { if (buildTech(cell, def, false)) renderSheetList(); }));
    });
  }

  if (sheetTab === 'dark') {
    CONFIG.dark.forEach(function (def) {
      var has = G.tech.indexOf(def.id) >= 0;
      box.appendChild(rowHtml('黑', def.name, def.desc, def.cur === 'coin' ? def.cost : 0, def.cur === 'coin' ? 0 : def.cost,
        !!cell && buildable(cell) && (def.cur === 'coin' ? G.coins >= def.cost : G.volt >= def.cost) && !has,
        has ? '已建造' : (cell && buildable(cell) ? '可建造 0/1' : '先选空地'),
        function () {
          if (def.id === 'box') {
            if (G.coins < def.cost) return;
            G.coins -= def.cost;
            if (Math.random() < 0.5) { G.coins += 120; addText(360, 1200, '魔盒开出 120 金币', '#FFD34D', 20); }
            else {
              var t = G.cells.filter(function (c) { return c.kind === 'turret'; })[0];
              if (t && t.lv < 14) { t.lv++; addText(360, 1200, '魔盒免费升一级炮台', '#7ED957', 20); }
              else { G.volt += 20; addText(360, 1200, '魔盒开出 20 闪电', '#6FD3FF', 20); }
            }
            SFX.build(); renderSheetList(); return;
          }
          if (def.id === 'doorcard') {
            if (G.coins < def.cost) return;
            G.coins -= def.cost; tryUpgradeDoor(); renderSheetList(); return;
          }
          if (buildTech(cell, def, true)) renderSheetList();
        }));
    });
  }

  if (sheetTab === 'badger') {
    if (!save.items || !save.items.length) {
      box.appendChild(rowHtml('獾', '还没有带入道具', '在主界面蜜獾商店买，最多带 3 件', 0, 0, false, ''));
    } else {
      save.items.forEach(function (it, idx) {
        var used = G.usedItems && G.usedItems.indexOf(idx) >= 0;
        box.appendChild(rowHtml('獾', it.name, it.desc, 0, 0, !used, used ? '已使用' : '可使用', function () {
          G.usedItems = G.usedItems || [];
          G.usedItems.push(idx);
          if (it.id === 'gold') { G.coins += 300; addText(360, 1200, '+300 金币', '#FFD34D', 22); }
          if (it.id === 'repair') { G.doorHp = G.doorMax; addText(360, 1200, '门已回满', '#7ED957', 22); }
          if (it.id === 'up') {
            G.cells.filter(function (c) { return c.kind === 'turret'; }).forEach(function (c) { if (c.lv < 14) c.lv++; });
            addText(360, 1200, '全场炮台 +1 级', '#7ED957', 22);
          }
          SFX.build(); renderSheetList();
        }));
      });
    }
  }
}

/* ---- 匹配 ---- */
function seatHtml() {
  var seats = [
    { n: '俞红', a: '俞' }, { n: '自己', a: '自', me: true }, { n: '常富纷', a: '常' },
    { n: '吴成', a: '吴' }, { n: '水铬冬', a: '水' }, { n: '史洪', a: '史' }
  ];
  el('seats').innerHTML = seats.map(function (s) {
    return '<div class="seat' + (s.me ? ' me' : '') + '"><span class="av">' + s.a + '</span>' + s.n + '</div>';
  }).join('');
}
function openMatch() {
  el('btn-ready').textContent = '准 备';
  el('btn-ready').classList.remove('on');
  el('match-cd').textContent = '匹配中 3s';
  seatHtml();
  showOnly('ov-match');
  matchT = 0;
}

function startRun() {
  G = newGame();
  G.usedItems = [];
  UI.paused = false;
  hideAll();
  el('sheet').classList.remove('on');
  save.runs++;
  persist();
}

var matchT = 0, matching = false;
el('btn-ready').onclick = function () {
  if (matching) return;
  matching = true;
  el('btn-ready').textContent = '已准备';
  el('btn-ready').classList.add('on');
  matchT = 0;
};

/* ---- 主界面 ---- */
function renderLobby() {
  el('lobby-stat').innerHTML = '最高撑到第 ' + Math.max(1, save.maxWave) + ' 晚 · 通关 ' + save.wins + ' 次 · 金币 ' + save.coins;
  var box = el('shoprow'); box.innerHTML = '';
  var items = [
    { id: 'gold', name: '金币袋', cost: 60, desc: '带入局内，使用后 +300 金币' },
    { id: 'repair', name: '维修令', cost: 80, desc: '带入局内，使用后门回满血' },
    { id: 'up', name: '升级券', cost: 120, desc: '带入局内，全场炮台 +1 级' }
  ];
  items.forEach(function (it) {
    var d = document.createElement('div'); d.className = 'shopcard';
    d.innerHTML = '<b>' + it.name + '</b><small>' + it.desc + '</small>' +
      '<button class="btn sm" style="margin-top:.8vmin;width:100%">买 ' + it.cost + ' 金币</button>';
    d.querySelector('button').onclick = function () {
      if (save.coins < it.cost) return;
      if (save.items.length >= 3) { alert('最多带 3 件道具'); return; }
      save.coins -= it.cost; save.items.push(it); persist(); renderLobby();
    };
    box.appendChild(d);
  });
  drawHero();
}

function drawHero() {
  var hc = el('hero-cv'); if (!hc) return;
  var g = hc.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  if (hc.width !== 320 * dpr) { hc.width = 320 * dpr; hc.height = 360 * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, 320, 360);
  /* 夜色背景 */
  var bg = g.createLinearGradient(0, 0, 0, 360);
  bg.addColorStop(0, '#1E2430'); bg.addColorStop(1, '#0C1016');
  g.fillStyle = bg; g.fillRect(0, 0, 320, 360);

  /* 窗户与月亮 */
  g.fillStyle = '#0E1622'; g.fillRect(56, 30, 208, 118);
  g.strokeStyle = '#2C3542'; g.lineWidth = 5; g.strokeRect(56, 30, 208, 118);
  g.strokeStyle = '#2C3542'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(160, 30); g.lineTo(160, 148); g.moveTo(56, 89); g.lineTo(264, 89); g.stroke();
  g.fillStyle = '#F0E6C8'; g.beginPath(); g.arc(108, 62, 16, 0, 6.284); g.fill();
  g.fillStyle = '#0E1622'; g.beginPath(); g.arc(116, 56, 14, 0, 6.284); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)';
  [[196, 52], [222, 70], [184, 108], [232, 116]].forEach(function (p) {
    g.beginPath(); g.arc(p[0], p[1], 1.6, 0, 6.284); g.fill();
  });

  /* 房间地板 */
  g.fillStyle = '#242B36'; g.fillRect(24, 176, 272, 150);
  for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) {
    var x = 30 + c * 66, y = 182 + r * 46;
    g.fillStyle = '#3B4A5E'; g.fillRect(x, y, 62, 43);
    g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(x, y, 62, 6);
  }
  /* 墙 */
  g.strokeStyle = '#3A4351'; g.lineWidth = 4; g.strokeRect(24, 176, 272, 150);

  /* 床 */
  g.fillStyle = '#5E4227'; g.fillRect(52, 238, 120, 66);
  g.fillStyle = '#7A5A35'; g.fillRect(52, 238, 120, 12);
  g.fillStyle = '#8FA8C4'; g.fillRect(60, 258, 106, 42);
  g.fillStyle = '#F3F6FA'; g.beginPath();
  if (g.roundRect) g.roundRect(64, 244, 44, 18, 7); else g.rect(64, 244, 44, 18);
  g.fill();
  /* 睡觉的人 */
  g.fillStyle = '#12151C';
  g.beginPath(); g.arc(86, 254, 9, 0, 6.284); g.fill();
  g.fillRect(94, 247, 40, 14);
  g.fillStyle = 'rgba(255,255,255,.5)'; g.font = '600 12px "PingFang SC",system-ui';
  g.fillText('z', 138, 250); g.fillText('z', 148, 241);

  /* 鬼 */
  g.save(); g.translate(246, 320); g.scale(1.05, 1.05);
  g.fillStyle = '#3A1B4E';
  g.beginPath(); g.moveTo(-26, 0); g.quadraticCurveTo(-32, -70, -14, -84);
  g.lineTo(14, -84); g.quadraticCurveTo(32, -70, 26, 0); g.quadraticCurveTo(0, 10, -26, 0); g.fill();
  g.fillStyle = '#1A0F24'; g.fillRect(-10, -84, 20, 46);
  g.strokeStyle = '#1A0F24'; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-10, -76); g.lineTo(-26, -50); g.stroke();
  g.beginPath(); g.moveTo(10, -76); g.lineTo(26, -52); g.stroke();
  g.fillStyle = '#F0E4DA'; g.beginPath(); g.arc(0, -98, 15, 0, 6.284); g.fill();
  g.fillStyle = '#160B1E'; g.beginPath(); g.arc(0, -102, 16, Math.PI, 0); g.fill();
  g.fillRect(-16, -102, 32, 10);
  g.fillStyle = '#FF3B3B'; g.beginPath(); g.arc(-6, -98, 2.6, 0, 6.284); g.arc(6, -98, 2.6, 0, 6.284); g.fill();
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = '600 12px "PingFang SC",system-ui'; g.textAlign = 'center';
  g.fillText('猎梦者', 246, 344);
  /* 金币飘字 */
  g.fillStyle = '#FFD34D'; g.font = '700 13px "PingFang SC",system-ui';
  g.fillText('+4', 120, 236);
}

/* ---- 暂停 ---- */
function openPause() {
  UI.paused = true;
  el('pause-info').innerHTML = '第 ' + G.night + ' / 5 晚 · 门 ' + fmt(G.doorHp) + '/' + fmt(G.doorMax) +
    '<br>金币 ' + fmt(G.coins) + ' · 闪电 ' + fmt(G.volt) + ' · 击杀 ' + G.kills;
  showOnly('ov-pause');
}
function confirmQuit() {
  if (G && (G.phase === 'day' || G.phase === 'night')) openPause();
  else { G = null; showOnly('ov-title'); renderLobby(); }
}

function hideAll() { ['ov-title', 'ov-match', 'ov-end', 'ov-pause'].forEach(function (id) { el(id).classList.remove('on'); }); }
function showOnly(id) { hideAll(); el(id).classList.add('on'); }

/* ---- 绑定 ---- */
el('btn-play').onclick = function () { openMatch(); };
el('btn-reset').onclick = function () {
  if (!confirm('清空躺平守夜的存档？')) return;
  save = defaultSave(); persist(); renderLobby();
};
el('sheet-close').onclick = function () { closeSheet(); };
el('end-retry').onclick = function () { startRun(); };
el('end-home').onclick = function () { G = null; showOnly('ov-title'); renderLobby(); };
el('p-resume').onclick = function () { UI.paused = false; hideAll(); };
el('p-quit').onclick = function () { G = null; UI.paused = false; hideAll(); el('sheet').classList.remove('on'); showOnly('ov-title'); renderLobby(); };

/* ---- 主循环 ---- */
var last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (matching) {
    matchT += dt;
    var left = Math.max(0, 3 - matchT);
    el('match-cd').textContent = left > 0 ? '匹配中 ' + Math.ceil(left) + 's' : '开始！';
    if (left <= 0) { matching = false; startRun(); }
  }
  if (G && !UI.paused) update(dt * (G.speed || 1));
  render();
}
requestAnimationFrame(loop);

renderLobby();
render();

window.sleeper = {
  get state() { return G; }, start: startRun, save: save,
  dev: {
    coins: function (n) { if (G) G.coins += n; save.coins += n; persist(); },
    volt: function (n) { if (G) G.volt += n; },
    night: function (n) { if (G) { G.night = n; G.phase = 'day'; G.timer = 0.2; } },
    kill: function () { if (G && G.ghost) killGhost(); },
    god: function () { if (G) { G.doorMax = 999999; G.doorHp = 999999; } },
    doorHp: function (n) { if (G) { G.doorMax = Math.max(n, 1); G.doorHp = n; } },
    speed: function (n) { if (G) G.speed = n; }
  }
};
})();
</script>
</body>
