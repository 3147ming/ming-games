<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0f12">
<meta name="description" content="深夜食堂 MIDNIGHT —— 完整模拟经营：顾客点餐、备料烹饪、摆盘上菜、星级评分。">
<title>深夜食堂 · MIDNIGHT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a0f12'/%3E%3Ctext x='16' y='23' font-size='16' text-anchor='middle' fill='%23e0736b'%3E食%3C/text%3E%3C/svg%3E">

<style>
:root{--ac:#e0736b;--ac2:#f5c26b;--bg:#1a0f12;--paper:#f5ece6;--dim:#b09a90;--line:#43272c;--win:#5cc08a;--bad:#e05c5c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#3a1c1f 0%,var(--bg) 64%);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:14px 12px calc(24px + env(safe-area-inset-bottom))}
.wrap{width:min(100%,520px)}
.head{text-align:center;margin-bottom:10px}.logo{font-size:23px;letter-spacing:.26em;margin:0;color:var(--ac)}.sub{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:4px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:12px}
.bar b{color:var(--ac2);font-size:15px}.bar .stat{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.guest{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#573036,#2a181d);display:flex;align-items:center;justify-content:center;font-size:23px;border:1px solid var(--line);flex:none}
.guest .info{flex:1;min-width:0}.guest .nm{font-size:14px;color:var(--paper);font-weight:600}.guest .sb{font-size:10px;color:var(--dim);margin-top:2px}
.pat{width:96px;flex:none;text-align:right}.pat .lb{font-size:10px;color:var(--dim);margin-bottom:4px}
.pbar{height:7px;border-radius:999px;background:#2a181d;overflow:hidden}.pbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--win),var(--ac2));transition:width .2s linear}
.pbar.warn i{background:linear-gradient(90deg,var(--ac),var(--bad))}
.reqs{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.rg{margin-bottom:7px}.rg .rl{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:4px}
.ri{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;margin:0 5px 5px 0;background:#2a181d}
.ri.sp{border-style:dashed;color:var(--ac2)}
.foodpic{width:1.45em;height:1.45em;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.foodpic img{width:100%;height:100%;object-fit:contain;display:block}
.steps{display:flex;align-items:center;justify-content:space-between;gap:2px;margin:2px 0 10px;font-size:10px;color:var(--dim)}
.steps .st{flex:1;text-align:center;padding:5px 0;border-radius:8px;transition:.2s}
.steps .st.on{background:rgba(224,115,107,.2);color:var(--ac2);font-weight:600}
.steps .st.done{color:var(--win)}
.msgtxt{text-align:center;min-height:18px;font-size:12px;margin:2px 0 8px;color:var(--dim)}
.msgtxt.win{color:var(--win)}.msgtxt.lose{color:var(--bad)}
.shelf{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.grp{width:100%;margin-bottom:8px}.grp .gl{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:5px;text-align:center}
.food{border:1px solid var(--line);border-radius:12px;background:#2a181d;color:var(--paper);font:inherit;min-width:66px;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:5px}
.food .ic{font-size:26px;line-height:1}.food.sel{border-color:var(--ac);background:rgba(224,115,107,.22);box-shadow:0 0 0 1px var(--ac) inset}
.chip{border:1px solid var(--line);border-radius:999px;background:#2a181d;color:var(--paper);font:inherit;font-size:12px;padding:7px 13px;cursor:pointer;margin:0 6px 8px 0}
.chip.sel{border-color:var(--ac2);background:rgba(245,194,107,.18);color:var(--ac2)}
.pot{height:120px;border-radius:14px;background:radial-gradient(80% 60% at 50% 30%,#5a2f2a,#2a181d);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pot .fire{font-size:40px;filter:drop-shadow(0 0 12px rgba(224,115,107,.6));animation:flame .7s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(-3px)}}
.bar-cook{height:10px;border-radius:999px;background:#1a0f12;overflow:hidden;width:80%}
.bar-cook i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .15s}
.plate{height:120px;border-radius:50%;border:5px solid #6b5a54;background:radial-gradient(circle at 50% 45%,#f5ece6,#cdbdb4);margin:6px auto;max-width:230px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.plate .slot{width:52px;height:52px;border-radius:12px;border:2px dashed rgba(90,70,60,.4);display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.35)}
.plate .slot.has{border-style:solid;border-color:var(--ac);background:rgba(224,115,107,.12);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.tray{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tray .food{min-height:54px;min-width:58px}
.result{text-align:center}.stars{font-size:34px;letter-spacing:4px;color:var(--ac2);margin:4px 0}
.breakdown{font-size:12px;color:var(--dim);line-height:1.9;text-align:left;max-width:300px;margin:6px auto}
.breakdown .ok{color:var(--win)}.breakdown .no{color:var(--bad)}
.earn{font-size:16px;color:var(--ac2);font-weight:600;margin:8px 0}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:12px;min-height:42px;padding:0 16px;font:inherit;font-size:13px;cursor:pointer;background:var(--ac);color:#1a0f12;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:400}
.btn.gold{background:var(--ac2)}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75)}
.overlay[hidden]{display:none}.overlay .inner{width:min(100%,390px);background:linear-gradient(180deg,#3a1c1f,#1a0f12);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.overlay h2{margin:0 0 10px;color:var(--ac);letter-spacing:.1em;font-size:19px}
.overlay p{font-size:12px;color:var(--dim);line-height:1.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="logo">MIDNIGHT</h1><p class="sub">深 夜 食 堂 · 模 拟 经 营</p></div>
  <div class="bar">
    <div class="stat">
      <span>金币 <b id="coin">0</b></span>
      <span>口碑 <b id="rating">—</b></span>
      <span>已接待 <b id="served">0</b></span>
      <span>最佳 <b id="best">0</b></span>
    </div>
    <button class="btn ghost" id="btn-info" style="min-height:30px;padding:0 10px">规则</button>
  </div>

  <div class="card">
    <div class="guest">
      <div class="avatar" id="avatar">🍜</div>
      <div class="info"><div class="nm" id="who">等待客人…</div><div class="sb" id="sb">营业后可接单</div></div>
      <div class="pat"><div class="lb">耐心 <span id="pat-n">—</span></div><div class="pbar" id="pbar"><i id="pat-i"></i></div></div>
    </div>
    <div class="reqs" id="reqs"></div>
  </div>

  <div class="steps" id="steps"></div>
  <div class="msgtxt" id="msg">看清订单，逐步完成出餐流程</div>
  <div class="card" id="work"></div>
  <div class="controls" id="controls"></div>
</div>

<div class="overlay" id="intro"><div class="inner">
  <h2>深夜食堂 · 开张</h2>
  <p>顾客会点主食、小吃、饮料，还可能要酱料和特殊要求。<br>你要备料 → 调味 → 烹饪 → 摆盘 → 上菜，越快越准，评分越高。<br>一晚接待 6 位客人，耐心耗尽客人会走。</p>
  <div class="controls">
    <button class="btn" id="btn-start">开始营业</button>
    <button class="btn ghost" id="btn-daily">每日营业</button>
  </div>
</div></div>

<div class="overlay" id="info" hidden><div class="inner" style="text-align:left">
  <h2>玩法说明</h2>
  <p id="info-body"></p>
  <div class="controls"><button class="btn" id="info-close">知道了</button></div>
</div></div>

<div class="overlay" id="over" hidden><div class="inner">
  <h2 id="over-title">收摊了</h2>
  <p id="over-info"></p>
  <div class="controls"><button class="btn" id="over-btn">再开一晚</button></div>
</div></div>

<script type="module">
import { heatState, HEAT_LABEL, rate, tipFor, matchSpecials, SPECIALS, PATIENCE } from './scoring.mjs';
(function(){
'use strict';
var KEY='mg_diner.v1',$=function(i){return document.getElementById(i)};
var S=(function(){try{var o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==='object')return o}catch(e){}return {best:0,runs:0,served:0,rating:0,coin:0,perfect:0,daily:null}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rng(seed){var x=seed>>>0||1;return function(){x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function seedFrom(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

var FOODS=[
  {id:'ramen',n:'拉面',cat:'main',e:'🍜',i:'assets/art/food/ramen.png',cook:2.6},
  {id:'rice',n:'炒饭',cat:'main',e:'🍚',i:'assets/art/food/rice.png',cook:2.2},
  {id:'friedchicken',n:'烤鸡',cat:'main',e:'🍗',i:'assets/art/food/friedchicken.png',cook:3.0},
  {id:'dumpling',n:'饺子',cat:'main',e:'🥟',i:'assets/art/food/dumpling.png',cook:2.4},
  {id:'skewer',n:'关东煮',cat:'snack',e:'🍢',i:'assets/art/food/skewer.png',cook:1.6},
  {id:'beer',n:'啤酒',cat:'drink',e:'🍺',i:'assets/art/food/beer.png',cook:.8}
];
var CAT={main:'主食',snack:'小吃',drink:'饮料'};
var SAUCES=['辣椒酱','番茄酱','芥末','酱油','蒜蓉','甜辣酱'];
var SPECIALS=['不要香菜','多加辣','少盐','热一点','打包带走','多放葱'];
var GUESTS=[
  {n:'加班社畜',e:'🧑‍💼'},{n:'夜归学生',e:'🧑‍🎓'},{n:'出租车司机',e:'🚕'},
  {n:'失眠诗人',e:'🧑‍🎤'},{n:'代驾小哥',e:'🛵'},{n:'巡夜警察',e:'👮'},
  {n:'代购大姐',e:'🛍️'},{n:'失意歌手',e:'🎤'},{n:'加班程序员',e:'💻'},{n:'夜跑达人',e:'🏃'}
];
var PHASES=[{k:'prep',n:'备料'},{k:'season',n:'调味'},{k:'cook',n:'烹饪'},{k:'plate',n:'摆盘'},{k:'result',n:'上菜'}];

var FOODIMG={};
function foodImg(idx){if(!(idx in FOODIMG)){var im=new Image();im.onload=function(){render()};im.src=FOODS[idx].i||'';FOODIMG[idx]=im}var im=FOODIMG[idx];return im&&im.complete&&im.naturalWidth>0?im:null}
function pic(idx){var im=foodImg(idx);return im?'<img src="'+im.src+'" alt="">':FOODS[idx].e}
function byId(id){for(var i=0;i<FOODS.length;i++)if(FOODS[i].id===id)return i;return -1}

var coin=0,servedNight=0,totalNight=6,daily=false,rand=rng(Date.now()|0);
var order=null,selFoods=[],selSauces=[],selSpecials=[],plated=[];
var phase='prep',step=0,patienceLeft=0,patienceMax=1,patienceAt=0;
var cookTimer=null,cookStart=0,cookDur=2.6,cookDone=false,tickTimer=null,cookProgress=0;
var lastResult=null,lottery=[],guestIdx=0;

function pick(a){return a[Math.floor(rand()*a.length)]}
function pickN(a,n){var b=a.slice(),o=[];while(o.length<n&&b.length)o.push(b.splice(Math.floor(rand()*b.length),1)[0]);return o}
function HUD(){
  $('coin').textContent=coin;
  $('served').textContent=(S.served||0);
  $('best').textContent=S.best||0;
  $('rating').textContent=S.served?'★'+(S.rating||0).toFixed(1):'—';
}
function makeOrder(){
  var mains=FOODS.filter(function(f){return f.cat==='main'});
  var snacks=FOODS.filter(function(f){return f.cat==='snack'});
  var drinks=FOODS.filter(function(f){return f.cat==='drink'});
  var lv=Math.min(3,Math.floor(servedNight/2));
  var foods=[];
  var nMain=(lv>=2&&rand()<.35)?2:1;
  pickN(mains,nMain).forEach(function(f){foods.push(f.id)});
  if(rand()<.45+lv*.12)foods.push(pick(snacks).id);
  if(rand()<.5+lv*.1)foods.push(pick(drinks).id);
  var sauces=pickN(SAUCES,(lv>=1&&rand()<.55)?1+Math.floor(rand()*2):(rand()<.3?1:0));
  var specials=pickN(SPECIALS,(lv>=2&&rand()<.55)?1+Math.floor(rand()*2):(rand()<.35?1:0));
  var complexity=foods.length+sauces.length+specials.length;
  patienceMax=38+complexity*8;
  patienceLeft=patienceMax;patienceAt=Date.now();
  var g=GUESTS[guestIdx%GUESTS.length];
  order={guest:g,foods:foods,sauces:sauces,specials:specials,idx:servedNight+1};
  selFoods=[];selSauces=[];selSpecials=[];plated=[];
  step=0;phase='prep';cookDone=false;lastResult=null;
  clearInterval(cookTimer);
  $('avatar').textContent=g.e;
  $('who').textContent=g.n;
  $('sb').textContent='第 '+(servedNight+1)+' / '+totalNight+' 位客人 · 点 '+foods.length+' 样';
}
function setMsg(t,c){$('msg').textContent=t;$('msg').className='msgtxt'+(c?' '+c:'')}
function renderSteps(){
  $('steps').innerHTML=PHASES.map(function(p,i){
    var cls=i<step?'done':(i===step?'on':'');
    return '<div class="st '+cls+'">'+(i+1)+' '+p.n+'</div>';
  }).join('');
}
function renderReqs(){
  if(!order){$('reqs').innerHTML='';return}
  function foodLine(ids){return ids.map(function(id){var k=byId(id);return '<span class="ri"><span class="foodpic">'+pic(k)+'</span>'+FOODS[k].n+'</span>'}).join('')}
  var html='';
  if(order.foods.length)html+='<div class="rg"><div class="rl">点的餐</div>'+foodLine(order.foods)+'</div>';
  if(order.sauces.length)html+='<div class="rg"><div class="rl">酱料</div>'+order.sauces.map(function(s){return '<span class="ri">'+s+'</span>'}).join('')+'</div>';
  if(order.specials.length)html+='<div class="rg"><div class="rl">特殊要求</div>'+order.specials.map(function(s){return '<span class="ri sp">'+s+'</span>'}).join('')+'</div>';
  $('reqs').innerHTML=html;
}
function renderPatience(){
  var r=Math.max(0,Math.min(1,patienceLeft/patienceMax));
  $('pat-i').style.width=(r*100)+'%';
  $('pat-n').textContent=Math.ceil(patienceLeft)+'s';
  $('pbar').className='pbar'+(r<.35?' warn':'');
}
function shelfHTML(){
  var html='';
  ['main','snack','drink'].forEach(function(c){
    var arr=FOODS.map(function(f,i){return {f:f,i:i}}).filter(function(o){return o.f.cat===c});
    html+='<div class="grp"><div class="gl">'+CAT[c]+'</div><div class="shelf">'+arr.map(function(o){
      return '<button class="food'+(selFoods.indexOf(o.i)>=0?' sel':'')+'" data-f="'+o.i+'"><span class="ic">'+pic(o.i)+'</span>'+o.f.n+'</button>';
    }).join('')+'</div></div>';
  });
  return html;
}
function bindFoods(){
  Array.prototype.forEach.call($('work').querySelectorAll('[data-f]'),function(b){
    b.addEventListener('click',function(){
      var i=+b.getAttribute('data-f'),k=selFoods.indexOf(i);
      if(k>=0)selFoods.splice(k,1);else selFoods.push(i);
      render();
    });
  });
}
function renderWork(){
  var w=$('work'),c=$('controls');
  if(phase==='prep'){
    w.innerHTML=shelfHTML();
    bindFoods();
    setMsg('按订单点选食材：主食必选，小吃/饮料看客人要不要');
    c.innerHTML='<button class="btn" id="next">下一步：调味</button><button class="btn ghost" id="skip">换客</button>';
    $('next').onclick=function(){if(!selFoods.length){setMsg('至少选一样主食再继续','lose');return}step=1;phase='season';render()};
    $('skip').onclick=customerLeaves;
  }else if(phase==='season'){
    var sh=SAUCES.map(function(s){return '<button class="chip'+(selSauces.indexOf(s)>=0?' sel':'')+'" data-s="'+s+'">'+(selSauces.indexOf(s)>=0?'✓ ':'')+s+'</button>'}).join('');
    var sp=SPECIALS.map(function(s){return '<button class="chip'+(selSpecials.indexOf(s)>=0?' sel':'')+'" data-p="'+s+'">'+(selSpecials.indexOf(s)>=0?'✓ ':'')+s+'</button>'}).join('');
    w.innerHTML='<div class="grp"><div class="gl">酱料（客人点了的要加上）</div>'+sh+'</div><div class="grp"><div class="gl">特殊要求（按客人要求勾选处理）</div>'+sp+'</div>';
    Array.prototype.forEach.call(w.querySelectorAll('[data-s]'),function(b){b.onclick=function(){var s=b.getAttribute('data-s'),k=selSauces.indexOf(s);if(k>=0)selSauces.splice(k,1);else selSauces.push(s);render()}});
    Array.prototype.forEach.call(w.querySelectorAll('[data-p]'),function(b){b.onclick=function(){var s=b.getAttribute('data-p'),k=selSpecials.indexOf(s);if(k>=0)selSpecials.splice(k,1);else selSpecials.push(s);render()}});
    setMsg('按客人的酱料与特殊要求勾选，勾对才得分');
    c.innerHTML='<button class="btn" id="next">下一步：开火</button><button class="btn ghost" id="back">上一步</button>';
    $('next').onclick=function(){step=2;phase='cook';startCook()};
    $('back').onclick=function(){step=0;phase='prep';render()};
  }else if(phase==='cook'){
    w.innerHTML='<div class="pot"><div class="fire">🔥</div><div class="bar-cook"><i id="cookbar"></i></div><div style="font-size:11px;color:var(--dim)" id="cooktx">烹饪中…</div></div>';
    setMsg('火候需要时间，耐心条仍在走，抓紧下一步');
    c.innerHTML='<button class="btn" id="next" disabled>下一步：摆盘</button>';
    $('next').onclick=function(){cookProgress=(Date.now()-cookStart)/1000/cookDur;step=3;phase='plate';render()};
    updateCookBar();
  }else if(phase==='plate'){
    var slots=selFoods.map(function(fi,k){return '<div class="slot'+(k<plated.length?' has':'')+'" data-k="'+k+'">'+(k<plated.length?pic(fi):'')+'</div>'}).join('');
    var tray=selFoods.map(function(fi,k){return '<button class="food'+(plated.indexOf(k)>=0?' sel':'')+'" data-t="'+k+'" '+(plated.indexOf(k)>=0?'disabled':'')+'><span class="ic">'+pic(fi)+'</span>'+FOODS[fi].n+'</button>'}).join('');
    w.innerHTML='<div class="plate">'+slots+'</div><div class="tray">'+tray+'</div>';
    Array.prototype.forEach.call(w.querySelectorAll('[data-t]'),function(b){b.onclick=function(){var k=+b.getAttribute('data-t');if(plated.indexOf(k)<0){plated.push(k);render()}}});
    setMsg('把做好的餐点一一摆上盘，然后上菜');
    c.innerHTML='<button class="btn gold" id="serve" '+(plated.length<selFoods.length?'disabled':'')+'>上菜评分</button><button class="btn ghost" id="back">回烹饪</button>';
    $('serve').onclick=evaluate;
    $('back').onclick=function(){step=2;phase='cook';startCook()};
  }else if(phase==='result'&&lastResult){
    var r=lastResult;
    var stars='';for(var i=0;i<5;i++)stars+=i<r.stars?'★':'☆';
    var lines=
      '<div class="breakdown">'+
      '<div class="'+(r.foodOK?'ok':'no')+'">'+(r.foodOK?'✓':'✗')+' 餐点：'+r.foodDetail+'</div>'+
      '<div class="'+(r.sauceOK?'ok':'no')+'">'+(r.sauceOK?'✓':'✗')+' 酱料：'+r.sauceDetail+'</div>'+
      '<div class="'+(r.specialOK?'ok':'no')+'">'+(r.specialOK?'✓':'✗')+' 特殊要求：'+r.specialDetail+'</div>'+
      '<div>火候 <b style="color:'+(r.heat==='perfect'?'#5cc08a':r.heat==='raw'?'#d6ab58':'#d0574d')+'">'+HEAT_LABEL[r.heat]+'</b> · 耐心剩余 '+Math.ceil(patienceLeft)+'s'+(r.patienceBonus?'（时间加成）':'')+'</div>'+
      (r.parts?'<div style="font-size:10px;opacity:.8;margin-top:4px">口味 '+r.parts.taste+' / 摆盘 '+r.parts.plate+' / 速度 '+r.parts.speed+' / 要求 '+r.parts.req+'</div>':'')+
      '</div>';
    w.innerHTML='<div class="result"><div class="stars">'+stars+'</div>'+lines+'<div class="earn">+'+r.coin+' 金币'+(r.tip?' · 小费 +'+r.tip:'')+'</div></div>';
    setMsg(r.stars>=4?'客人很满意！':'客人勉强点头…',r.stars>=4?'win':'');
    var isLast=servedNight>=totalNight;
    c.innerHTML='<button class="btn" id="next">'+(isLast?'收摊结算':'下一位客人')+'</button>';
    $('next').onclick=function(){if(isLast)closeShop();else{servedNight++;makeOrder();render()}};
  }
}
function startCook(){
  clearInterval(cookTimer);
  cookDur=Math.max(1.2,Math.min(3.2,selFoods.reduce(function(a,k){return a+FOODS[k].cook},0)/Math.max(1,selFoods.length)+.4));
  cookStart=Date.now();cookDone=false;cookProgress=0;render();
  cookTimer=setInterval(function(){
    var p=(Date.now()-cookStart)/1000/cookDur;
    if(p>=1){p=1;clearInterval(cookTimer);cookDone=true;var b=$('next');if(b){b.disabled=false;var t=$('cooktx');if(t)t.textContent='出锅！可以摆盘了'}}
    var bar=$('cookbar');if(bar)bar.style.width=(p*100)+'%';
  },100);
}
function updateCookBar(){
  var raw=(Date.now()-cookStart)/1000/cookDur;
  var p=Math.min(1,raw);
  var bar=$('cookbar');if(bar){bar.style.width=(p*100)+'%';
    var st=heatState(raw);
    bar.style.background=st==='perfect'?'linear-gradient(90deg,#3fa06f,#5cc08a)':st==='raw'?'linear-gradient(90deg,#a07f3f,#d6ab58)':'linear-gradient(90deg,#8a2d25,#d0574d)';
  }
}
function sameSet(a,b){if(a.length!==b.length)return false;var x=a.slice().sort(),y=b.slice().sort();for(var i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true}
function listDetail(want,got,names){
  var miss=want.filter(function(v){return got.indexOf(v)<0});
  var extra=got.filter(function(v){return want.indexOf(v)<0});
  var parts=[];
  if(!miss.length&&!extra.length)parts.push('全对');
  if(miss.length)parts.push('缺 '+miss.map(names).join('、'));
  if(extra.length)parts.push('多 '+extra.map(names).join('、'));
  return parts.join('，')||'—';
}
function evaluate(){
  clearInterval(cookTimer);
  var foodOK=sameSet(order.foods.map(byId),selFoods);
  var sauceOK=sameSet(order.sauces,selSauces);
  var specialOK=sameSet(order.specials,selSpecials);
  var pRatio=Math.max(0,Math.min(1,patienceLeft/patienceMax));
  // 火候三态：正好/欠火/过火
  var heat=heatState(cookProgress||1);
  // 要求命中：酱料 1 项 + 特殊要求 N 项
  var spec=matchSpecials(order.specials,selSpecials);
  var reqHit=(sauceOK?1:0)+spec.hitCount;
  var reqTotal=1+order.specials.length;
  // 四维加权：口味40（餐点+火候）/ 摆盘20（已上齐=1）/ 速度25 / 要求15
  var graded=rate({foodOK:foodOK,heat:heat,platedRatio:1,patienceRatio:pRatio,reqHit:reqHit,reqTotal:reqTotal});
  var stars=graded.stars;
  var base=stars*4+order.foods.length*2;
  var tip=tipFor(stars,base);
  var coinGain=base+tip;
  coin+=coinGain;servedNight++;
  S.served=(S.served||0)+1;S.coin=(S.coin||0)+coinGain;
  S.rating=((S.rating||0)*(S.served-1)+stars)/S.served;
  if(stars>=5)S.perfect=(S.perfect||0)+1;
  var nightScore=coin+servedNight*3;
  if(nightScore>(S.best||0))S.best=nightScore;
  save();HUD();
  lastResult={
    stars:stars,coin:base,tip:tip,patienceBonus:pRatio>.5,score:graded.score,parts:graded.parts,heat:heat,
    foodOK:foodOK,foodDetail:listDetail(order.foods.map(byId),selFoods,function(k){return FOODS[k].n}),
    sauceOK:sauceOK,sauceDetail:listDetail(order.sauces,selSauces,function(s){return s}),
    specialOK:specialOK,specialDetail:listDetail(order.specials,selSpecials,function(s){return s})
  };
  step=4;phase='result';render();
}
function customerLeaves(){
  clearInterval(cookTimer);
  servedNight++;
  S.served=(S.served||0)+1;
  S.rating=Math.max(0,((S.rating||0)*(S.served-1)+1)/S.served);
  save();HUD();
  if(servedNight>=totalNight){closeShop();return}
  makeOrder();render();
  setMsg('客人等不及走了，口碑下降…','lose');
}
function start(isDaily){
  daily=!!isDaily;coin=0;servedNight=0;guestIdx=0;
  rand=rng(daily?seedFrom('diner-'+today()):(Date.now()|0));
  S.runs=(S.runs||0)+1;if(daily)S.daily=today();save();
  $('intro').hidden=true;$('over').hidden=true;
  makeOrder();render();HUD();
  clearInterval(tickTimer);
  tickTimer=setInterval(function(){
    if(!order||phase==='result')return;
    patienceLeft=Math.max(0,patienceMax-(Date.now()-patienceAt)/1000);
    renderPatience();
    if(patienceLeft<=0)customerLeaves();
  },200);
}
function closeShop(){
  clearInterval(tickTimer);clearInterval(cookTimer);
  var nightScore=coin+servedNight*3;
  if(nightScore>(S.best||0))S.best=nightScore;
  save();HUD();
  $('over-title').textContent=daily?'今日营业结算':'收摊了';
  $('over-info').innerHTML='今晚收入 <b style="color:var(--ac2)">'+coin+'</b> 金币<br>接待 '+servedNight+' 位客人 · 本晚 '+nightScore+' 分<br>当前口碑 <b style="color:var(--ac2)">★'+(S.rating||0).toFixed(1)+'</b>'+(nightScore>=S.best?' · 新纪录！':'');
  $('over').hidden=false;
}
function render(){renderSteps();renderReqs();renderPatience();renderWork();HUD()}
$('btn-start').onclick=function(){start(false)};
$('btn-daily').onclick=function(){start(true)};
$('btn-info').onclick=function(){$('info-body').textContent='顾客会点主食（必选）、小吃/饮料（看情况），还可能点酱料并提特殊要求。流程：①备料选食材 → ②调味勾酱料和要求 → ③等烹饪完成 → ④把餐点摆上盘 → ⑤上菜。评分看餐点/酱料/要求是否全对，以及剩余耐心；越快越准星级越高，金币和小费越多。耐心耗尽客人会走，口碑下降。一晚 5 位客人，结束结算。每日营业按日期固定订单。';$('info').hidden=false};
$('info-close').onclick=function(){$('info').hidden=true};
$('over-btn').onclick=function(){start(false)};
HUD();renderSteps();
for(var i=0;i<FOODS.length;i++)foodImg(i);
window.__DINNER__={
  get order(){return order},get phase(){return phase},foods:FOODS,
  get state(){return {servedNight:servedNight,totalNight:totalNight,coin:coin,selFoods:selFoods.slice(),selSauces:selSauces.slice(),selSpecials:selSpecials.slice(),cookProgress:cookProgress,lastResult:lastResult}},
  setFoods:function(ids){selFoods=ids.map(byId).filter(function(i){return i>=0});render()},
  setSauce:function(a){selSauces=a.slice();render()},setSpecial:function(a){selSpecials=a.slice();render()}
};
})();
</script>
