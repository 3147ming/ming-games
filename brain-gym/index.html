<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}

.grid{display:grid;gap:8px;max-width:380px;margin:0 auto}

.ptitle{font-size:20px;font-weight:800;margin-bottom:12px}

.rules ol{padding-left:20px}
.rules b{color:#f4511e}

.jgpad{display:flex;justify-content:center;width:100%;flex-wrap:wrap;gap:8px}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px;margin:12px auto}
.pad button{padding:14px 0;font-size:18px;border:1px solid #e0dccc;background:#fff;border-radius:12px;cursor:pointer;font-weight:600;box-shadow:0 2px 4px rgba(90,70,20,.05)}
.pad button:active{background:#ffe082}
.buf{max-width:360px;margin:10px auto;background:#fff;border:2px solid #f3e6c8;border-radius:12px;padding:10px;text-align:center;font-size:26px;font-weight:700;letter-spacing:4px;min-height:50px;color:#f4511e}
.nums{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}

.numtile.sel{border-color:#ff9800;background:#fff3e0}
.ops{display:flex;gap:10px;justify-content:center;margin:8px 0}

.opbtn.sel{border-color:#ff9800;background:#fff3e0}
.target{background:#fff;border:2px solid #ffe082;border-radius:14px;padding:10px;font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.target.hit{background:#c8e6c9;border-color:#66bb6a}
.vwrap{font-family:Consolas,'Courier New',monospace;background:#fff;border:1px solid #eee7d8;border-radius:14px;padding:16px 12px;max-width:300px;margin:0 auto}
.vrow{display:flex;justify-content:flex-end;font-size:34px;line-height:1.5}
.vrow .d{width:26px;text-align:center}
.vrow .op{width:26px;text-align:center;color:#f4511e;font-weight:700}

.vline{border-top:3px solid #555;margin:6px auto;max-width:240px}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;max-width:340px;margin:10px auto}

.sgrid{display:grid;gap:2px;margin:0 auto;width:max-content}

.tboard{position:relative;width:320px;height:320px;margin:0 auto;background:linear-gradient(180deg,#fff,#fdfaf3);border:1px solid #eee7d8;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(90,70,20,.06)}
.dotwrap{position:relative;width:300px;height:300px;margin:0 auto}
.dot{position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #90a4ae;cursor:pointer;z-index:2;box-shadow:0 2px 5px rgba(0,0,0,.12)}

.rrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}

.rslot.bad{border-style:solid;border-color:#e57373;background:#ffcdd2}
.rslot.lit{border-color:#ffb300;background:#fff8e1}
.ringwrap{position:relative;width:340px;height:340px;margin:0 auto}
.swatch{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.2)}
/* ---- 对色入库（轨道分拣 · 未来之光风格） ---- */
.nextprev{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:#6b6250;margin:-4px auto 12px;background:#fff8ec;border:1px solid #f0dfa8;border-radius:20px;padding:6px 14px;width:max-content}
.npc{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#3a352c;background:#fff;border:1px solid #ece4d2;border-radius:12px;padding:3px 8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.npc i{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid rgba(0,0,0,.18);box-shadow:inset 0 -3px 4px rgba(0,0,0,.18)}
.railboard{position:relative;width:560px;height:560px;margin:0 auto;background:linear-gradient(180deg,#fdfbf6,#efe6d2);border:2px solid #dfd2b2;border-radius:20px;overflow:hidden;box-shadow:inset 0 1px 0 #fff,0 6px 18px rgba(90,70,20,.12)}

.railsw{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;cursor:pointer;user-select:none;z-index:3;filter:drop-shadow(0 3px 5px rgba(60,45,15,.35));transition:transform .16s ease}
.railsw:active{transform:scale(.9)}

/* 货物：立体彩色箱子 */
.crate{position:absolute;width:34px;height:34px;left:0;top:0;border-radius:6px;border:2px solid rgba(0,0,0,.32);z-index:2;box-shadow:inset 0 4px 5px rgba(255,255,255,.42),inset 0 -6px 8px rgba(0,0,0,.26),0 4px 8px rgba(0,0,0,.3)}
.crate::before{content:'';position:absolute;left:-2px;top:-2px;right:-2px;height:9px;border-radius:6px 6px 0 0;background:rgba(255,255,255,.28)}

/* 仓库：带屋顶的立体库房 */
.wh{position:absolute;width:72px;height:98px;margin:-49px 0 0 -36px;z-index:1;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))}
.wh .roof{position:absolute;left:0;right:0;top:8px;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-bottom:26px solid rgba(30,26,18,.62);z-index:1}

.wh .door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:26px;height:36px;background:rgba(0,0,0,.35);border-radius:4px 4px 0 0;z-index:2}

/* 工厂出料口 */
.fac{position:absolute;width:76px;height:54px;margin:-27px 0 0 -38px;background:linear-gradient(180deg,#7c8b9d,#4a5568);border-radius:10px 10px 4px 4px;border:3px solid #33404e;z-index:1;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 -10px 14px rgba(0,0,0,.25)}

/* ---- 像素拼图（固定尺寸稳定格子，杜绝闪烁） ---- */
.pxgrid{display:grid;grid-template-columns:repeat(5,58px);gap:6px;margin:0 auto;width:max-content}

/* ---- 2048 ---- */
.t2048{position:relative;width:336px;height:336px;background:#bbada0;border-radius:14px;margin:0 auto;box-shadow:0 6px 16px rgba(90,70,20,.2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}

.t2bg{position:absolute;width:74px;height:74px;border-radius:8px;background:rgba(238,228,218,.35)}

.dpad .dd{grid-column:2;grid-row:3}
.dpad .dr{grid-column:3;grid-row:2}
.dpad .dmid{grid-column:2;grid-row:2;font-size:19px}

.pond{position:relative;width:360px;height:360px;margin:0 auto;background:radial-gradient(circle at 50% 28%,#8fd3f0,#3a7ca5 72%,#2b5f80);border-radius:20px;border:3px solid #24506e;overflow:hidden;box-shadow:inset 0 0 46px rgba(0,25,50,.45),0 6px 16px rgba(20,60,90,.25)}

.fish.hungry::after{content:'！';position:absolute;top:-16px;right:-4px;background:#fffbe6;color:#e65100;font-weight:800;font-size:13px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #ffb300;animation:bob .9s infinite;z-index:3}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.foodtray{display:flex;gap:14px;justify-content:center;margin-top:44px}
.foodbtn{width:62px;height:62px;border-radius:16px;border:3px solid rgba(0,0,0,.22);cursor:pointer;position:relative;box-shadow:0 3px 9px rgba(0,0,0,.22);transition:.12s}
.foodbtn.sel{outline:4px solid #ffd54f;transform:scale(1.1)}
.foodbtn small{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#6b6250;font-size:12px;font-weight:700}
/* ---- 反应测试 ---- */
.rxcircle{width:225px;height:225px;border-radius:50%;margin:18px auto;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;cursor:pointer;user-select:none;transition:background .08s;box-shadow:0 12px 32px rgba(0,0,0,.28);text-align:center;line-height:1.4}
/* ---- 点石成金 ---- */
.dots-grid{display:grid;gap:14px;background:linear-gradient(135deg,#3a2e6e,#1f1846);padding:14px;border-radius:18px;margin:0 auto;box-shadow:0 10px 28px rgba(60,40,120,.4);width:max-content}
.dots-cell{position:relative;border-radius:8px;background:#221a4a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff}
.dots-slash{position:absolute;width:100%;height:6px;border-radius:3px;background:linear-gradient(90deg,#ff8a65,#ffd54f);box-shadow:0 0 12px rgba(255,213,79,.7);transform-origin:center center;transition:opacity .4s}
.dots-slash.h{top:50%;left:5%;right:5%;transform:translateY(-50%)}
.dots-slash.d1{top:6%;left:6%;width:130%;height:5px;transform:rotate(45deg);transform-origin:left center}
.dots-slash.d2{top:6%;right:6%;width:130%;height:5px;transform:rotate(-45deg);transform-origin:right center}
.dots-hole{position:absolute;width:14px;height:14px;background:#0a0618;border-radius:50%;box-shadow:inset 0 0 4px rgba(0,0,0,.9)}
.dots-hole.tl{top:-5px;left:-5px}.dots-hole.tr{top:-5px;right:-5px}.dots-hole.bl{bottom:-5px;left:-5px}.dots-hole.br{bottom:-5px;right:-5px}
.dots-ball{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff5252 40%,#b71c1c);box-shadow:0 0 10px rgba(255,82,82,.8);z-index:5;transition:all .5s cubic-bezier(.3,1.4,.5,1)}
.dots-ball.gone{transition:all .9s cubic-bezier(.7,-.2,.4,1.5)}
/* ---- 魔法符石 ---- */
.mf-wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:14px 0}
.mf-box{position:relative}
.mf-canvas{position:relative;border-radius:14px}
.mf-piece{position:absolute;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#222;cursor:pointer;border:1px solid rgba(0,0,0,.05);transition:transform .35s}
.mf-piece.sel{outline:3px solid #ffd54f;outline-offset:-3px;transform:scale(1.06)}
.mf-pal{display:flex;flex-wrap:wrap;gap:6px;max-width:240px;justify-content:center;margin-top:10px}
.mf-sym{width:38px;height:38px;border-radius:9px;border:2px solid #7c5cff;background:#fff;color:#7c5cff;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
.mf-sym:hover{background:#ede7ff;transform:translateY(-2px)}
.mf-sym.used{opacity:.3;pointer-events:none}
.mf-feedback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:900;color:#222;background:rgba(255,255,255,.95);padding:4px 7px;border-radius:6px;pointer-events:none;animation:mfpop .9s forwards}
@keyframes mfpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
/* ---- 回旋迷宫 ---- */
.smaze{position:relative;background:linear-gradient(135deg,#2a1f5e,#0e0930);border-radius:14px;margin:0 auto;box-shadow:0 8px 24px rgba(20,10,60,.5);overflow:hidden}
.smaze-rot{width:100%;height:100%;position:absolute;inset:0;transition:transform .4s}
.smaze-wall{position:absolute;background:#fff}
.smaze-goal{position:absolute;background:radial-gradient(circle,#ff5252,#b71c1c);border-radius:50%;box-shadow:0 0 16px rgba(255,82,82,.8)}
.smaze-trap{position:absolute;background:radial-gradient(circle,#000,#444);border-radius:50%;box-shadow:inset 0 0 6px #000}
.smaze-ball{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7c5cff 50%,#3a2e6e);box-shadow:0 0 14px rgba(124,92,255,.8);transition:all .35s;z-index:5}
.smaze-arrows{display:flex;justify-content:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.smaze-arrows button{width:54px;height:54px;border-radius:14px;border:none;background:linear-gradient(135deg,#7c5cff,#5e40cc);color:#fff;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(94,64,204,.4);transition:.15s}
.smaze-arrows button:active{transform:scale(.92)}
.smaze-gravity{font-size:14px;color:#fff;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:8px;display:inline-block}
.smaze-scene{position:relative;margin:8px auto 0;background:#241a4d;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(20,10,60,.4)}
.smaze-inner{position:relative;width:100%;height:100%;transition:transform .38s}
.smw{position:absolute;inset:3px;background:linear-gradient(135deg,#9a93b8,#6f6a8c);border-radius:8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.smt{position:absolute;inset:7px;background:radial-gradient(circle,#000,#3a3a3a);border-radius:50%;box-shadow:inset 0 0 8px #000}
.smg{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#ff5252,#b71c1c);box-shadow:0 0 14px rgba(255,82,82,.85)}
.smb{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#7c5cff 50%,#3a2e6e);box-shadow:0 0 12px rgba(124,92,255,.8);transition:top .18s,left .18s;z-index:5}
.smaze-grav{font-size:14px;color:#fff;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:8px;display:block;width:max-content;margin:6px auto}
/* ---- 点阵封锁 ---- */
.db-grid{position:relative;background:linear-gradient(135deg,#1f1645,#0a0628);border-radius:14px;margin:0 auto;box-shadow:0 8px 24px rgba(20,10,60,.4)}
.db-node{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6);transform:translate(-50%,-50%);cursor:pointer;z-index:2;transition:.1s}
.db-node.hot{background:#ffeb3b;box-shadow:0 0 16px #ffeb3b;transform:translate(-50%,-50%) scale(1.4)}
.db-node.sel{background:#7c5cff;box-shadow:0 0 16px #7c5cff}
.db-node.target{background:#ff5252;box-shadow:0 0 14px #ff5252;width:18px;height:18px}
.db-node.enclosed{outline:3px solid #66bb6a;outline-offset:-3px;background:#66bb6a;box-shadow:0 0 14px #66bb6a}
.db-edge{position:absolute;height:5px;background:#7c5cff;border-radius:3px;transform-origin:0 50%;box-shadow:0 0 10px rgba(124,92,255,.7);pointer-events:none;z-index:1}
.db-edge.invalid{background:#ff5252;box-shadow:0 0 10px rgba(255,82,82,.7)}
/* ---- 双雄争霸 ---- */
.dual-wrap{display:flex;gap:8px;margin:12px auto;justify-content:center;max-width:680px}
.dual-side{flex:1;background:linear-gradient(135deg,#f4f0ff,#fff);border-radius:18px;padding:10px;border:3px solid #d9d0ff;position:relative;min-height:300px}
.dual-side.attack{border-color:#ff7043;background:linear-gradient(135deg,#fff5ef,#fff)}
.dual-name{font-weight:800;color:#5e40cc;text-align:center;margin-bottom:6px;font-size:14px}
.dual-side.attack .dual-name{color:#ff5722}
.dual-sco{text-align:center;font-size:22px;font-weight:900;color:#5e40cc;margin:4px 0}
.dual-side.attack .dual-sco{color:#ff5722}
.dual-canv{position:relative;height:200px;border-radius:12px;background:#fff;overflow:hidden;border:2px solid #e3d9ff}
.dual-side.attack .dual-canv{border-color:#ffd0bf;background:#fffaf5}
.dual-target{position:absolute;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;border-radius:12px;cursor:pointer;user-select:none;transition:transform .1s}
.dual-target:active{transform:scale(.94)}
.dual-vs{font-size:36px;font-weight:900;color:#7c5cff;align-self:center}
/* ---- 快问快答 ---- */
.qq-prog{height:8px;background:#e3d9ff;border-radius:4px;overflow:hidden;margin:10px auto;max-width:480px}
.qq-prog-fill{height:100%;background:linear-gradient(90deg,#7c5cff,#5e40cc);transition:width .3s}
.qq-card{max-width:480px;margin:14px auto;padding:22px;background:linear-gradient(135deg,#fff,#f4f0ff);border-radius:18px;box-shadow:0 8px 24px rgba(124,92,255,.18)}
.qq-q{font-size:22px;font-weight:800;color:#2a1f5e;text-align:center;margin:8px 0 18px}
.qq-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qq-opt{padding:14px;border-radius:12px;background:#fff;border:2px solid #d9d0ff;font-weight:700;color:#5e40cc;font-size:16px;cursor:pointer;transition:.15s}
.qq-opt:hover{background:#ede7ff;transform:translateY(-2px)}
.qq-opt.right{background:#66bb6a;color:#fff;border-color:#43a047}
.qq-opt.wrong{background:#ef5350;color:#fff;border-color:#e53935}
.qq-bn{display:inline-block;padding:4px 11px;border-radius:8px;background:#7c5cff;color:#fff;font-size:13px;font-weight:700;margin-right:6px}
/* ---- 番茄钟 ---- */
.tc-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 18px;margin:8px auto;max-width:380px;background:linear-gradient(160deg,#fff6f0,#f3eeff);border-radius:26px;box-shadow:0 12px 30px -10px rgba(124,92,255,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.tc-ring{position:relative;width:240px;height:240px;filter:drop-shadow(0 8px 18px rgba(255,122,89,.35))}
.tc-ring.pulse{animation:tcpulse 2.4s ease-in-out infinite}
@keyframes tcpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.tc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tc-ring circle.bg{fill:none;stroke:#efe7ff;stroke-width:13}
.tc-ring circle.fg{fill:none;stroke:url(#tcgrad);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.tc-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#2a1f5e}
.tc-time{font-size:52px;letter-spacing:-2px;line-height:1}
.tc-phase{font-size:15px;margin-top:8px;padding:4px 12px;border-radius:20px;font-weight:700}
.tc-phase.pf{background:rgba(255,122,89,.16);color:#e0532f}
.tc-phase.pb{background:rgba(86,140,255,.16);color:#2f6fe0}
.tc-presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:7px 14px;border-radius:20px;border:2px solid #e6ddff;background:#fff;font-weight:800;font-size:13px;color:#6a4bd6;cursor:pointer;transition:.15s}
.chip:hover{background:#7c5cff;color:#fff;border-color:#7c5cff;transform:translateY(-2px)}
.tc-set{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.7);padding:8px 14px;border-radius:14px;flex-wrap:wrap;justify-content:center}
.tc-set label{font-size:13px;color:#5e40cc;font-weight:700}
.tc-set input{width:52px;padding:6px;border:2px solid #d9d0ff;border-radius:8px;font-weight:800;font-size:16px;color:#5e40cc;text-align:center;background:#fff}
.tc-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tc-ctrl button{padding:11px 20px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.15);transition:.15s}
.tc-ctrl button.go{background:linear-gradient(135deg,#66bb6a,#2e7d32)}
.tc-ctrl button.pause{background:linear-gradient(135deg,#ffa726,#ef6c00)}
.tc-ctrl button.stop{background:linear-gradient(135deg,#ef5350,#c62828)}
.tc-ctrl button.music{background:linear-gradient(135deg,#7c5cff,#5e40cc)}
.tc-ctrl button.music.on{box-shadow:0 0 0 3px rgba(124,92,255,.4),0 5px 14px rgba(0,0,0,.15)}
.tc-ctrl button:hover{transform:translateY(-2px)}
.tc-stat{font-size:13px;color:#6a4bd6;background:rgba(124,92,255,.1);padding:8px 14px;border-radius:10px;text-align:center;font-weight:700}
.tc-music{width:100%;margin-top:4px;background:rgba(255,255,255,.6);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.tm-title{font-weight:800;color:#5e40cc;font-size:15px}
.tm-label{font-size:12px;color:#9b8fd6;font-weight:700;margin-top:2px}
.tm-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#5e40cc;font-weight:700}
.tm-row input[type=range]{flex:1;accent-color:#7c5cff}
.ambgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amb{padding:10px 6px;border-radius:12px;border:2px solid #e6ddff;background:#fff;font-weight:700;font-size:13px;color:#6a4bd6;cursor:pointer;transition:.15s}
.amb.on{background:linear-gradient(135deg,#7c5cff,#5e40cc);color:#fff;border-color:#7c5cff}
.amb:hover{transform:translateY(-2px)}
.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app{padding:10px 4px;border-radius:12px;border:2px solid #ffe0c2;background:#fff7ef;font-weight:700;font-size:12px;color:#c0622e;cursor:pointer;transition:.15s}
.app:hover{background:#ff8a3d;color:#fff;border-color:#ff8a3d;transform:translateY(-2px)}
/* ---- 消音闪念 ---- */
.ms-round{position:relative;width:300px;height:300px;border-radius:50%;background:linear-gradient(135deg,#ede7ff,#fff);margin:10px auto;box-shadow:inset 0 0 30px rgba(124,92,255,.12)}
.ms-cue{position:absolute;border-radius:8px;background:linear-gradient(135deg,#7c5cff,#5e40cc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;box-shadow:0 4px 10px rgba(124,92,255,.4);transition:opacity .25s}
.ms-cue.flash{animation:flash .4s}
@keyframes flash{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.18)}100%{opacity:0;transform:scale(.85)}}
/* ---- 数字迷图（非逻辑涂色） ---- */
.nono-wrap{display:flex;justify-content:center;margin:8px 0}
.nono-grid{position:relative;display:grid;background:#1a1330;padding:0;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.25);gap:1px;border:1px solid #1a1330}
.nono-cell{background:#fff;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-size:13px;font-weight:800;color:#333;position:relative;transition:background .08s}
.nono-cell.filled{background:#3a2e6e}
.nono-cell.marked{color:#ff5252}
.nono-hint{background:#1a1330;color:#fff;font-size:12px;line-height:1.2;padding:2px 4px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;text-align:right;gap:1px;font-weight:700}
.nono-hint.col{writing-mode:vertical-rl;text-orientation:upright;align-items:flex-end;justify-content:flex-end;flex-direction:column}
.nono-corner{background:#1a1330}
.nono-padbar{display:flex;justify-content:center;gap:8px;margin:8px 0}
.nono-padbar button{padding:8px 18px;border-radius:10px;border:none;color:#fff;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.nono-padbar .fill{background:linear-gradient(135deg,#3a2e6e,#5e40cc)}
.nono-padbar .mark{background:linear-gradient(135deg,#ff7043,#e64a19)}
.nono-padbar .clear{background:linear-gradient(135deg,#7e7e7e,#424242)}
/* ---- 双雄争霸 赛车版 ---- */
.dual-road{position:relative;width:320px;height:480px;margin:8px auto;background:linear-gradient(180deg,#3a4a6e,#1a2842);border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4);border:2px solid #2a3a58}
.dual-lane{position:absolute;top:0;bottom:0;width:33.33%;border-right:1px dashed rgba(255,255,255,.18)}
.dual-lane:last-child{border-right:none}
.dual-lane.highlight{background:rgba(255,255,255,.07)}
.dual-stripe{position:absolute;top:0;bottom:0;left:50%;width:3px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.4) 0 12px,transparent 12px 24px)}
.dual-barrier,.dual-coin{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dual-barrier{height:24px;background:repeating-linear-gradient(45deg,#ffb300 0 8px,#ff7043 8px 16px,#1a1330 16px 24px);border:2px solid #1a1330;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.dual-coin{width:30px;height:30px;background:radial-gradient(circle at 35% 30%,#fff,#ffd54f 40%,#f9a825);border:2px solid #f57f17;color:#5d2906;font-size:18px;font-weight:900;box-shadow:0 0 14px rgba(255,213,79,.7)}
.dual-car{position:absolute;bottom:14px;width:46px;height:74px;border-radius:12px 12px 6px 6px;z-index:5;transition:left .18s cubic-bezier(.3,1.5,.5,1);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.dual-car.red{background:linear-gradient(180deg,#ff5252,#b71c1c 60%,#7f0000);border:2px solid #5d0000}
.dual-car.blue{background:linear-gradient(180deg,#42a5f5,#0d47a1 60%,,#002171);border:2px solid #001f5f}
.dual-car::before{content:'';position:absolute;top:8px;left:6px;right:6px;height:14px;background:rgba(255,255,255,.4);border-radius:4px}
.dual-car::after{content:'';position:absolute;bottom:8px;left:8px;right:8px;height:18px;background:rgba(0,0,0,.3);border-radius:4px}
.dual-ctrl{display:flex;justify-content:center;gap:8px;margin:10px 0}
.dual-ctrl button{padding:9px 22px;border:none;border-radius:10px;color:#fff;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.dual-ctrl .left{background:linear-gradient(135deg,#ef5350,#b71c1c)}
.dual-ctrl .right{background:linear-gradient(135deg,#42a5f5,#0d47a1)}
.dual-ctrl .mute{background:linear-gradient(135deg,#7c5cff,#5e40cc)}
/* ---- 三消 · 符石 ---- */
.m3-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px}
.m3-grid{display:grid;gap:4px;background:linear-gradient(135deg,#3a2e6e,#1f1846);padding:8px;border-radius:16px;box-shadow:0 10px 24px rgba(60,40,120,.4);position:relative}
.m3-cell{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;user-select:none;position:relative;transition:transform .18s,opacity .22s;background:rgba(255,255,255,.05);box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.m3-cell:hover{transform:scale(1.06)}
.m3-cell.sel{outline:3px solid #ffd54f;outline-offset:-3px;transform:scale(1.08)}
.m3-cell.hint{animation:m3pulse 1s infinite}
@keyframes m3pulse{0%{box-shadow:inset 0 0 0 rgba(255,213,79,0)}50%{box-shadow:inset 0 0 18px rgba(255,213,79,.8)}100%{box-shadow:inset 0 0 0 rgba(255,213,79,0)}}
.m3-gem{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 2px 6px rgba(255,255,255,.3)}
.m3-gem[data-t='fire']{background:linear-gradient(135deg,#ff8a65,#e53935)}
.m3-gem[data-t='water']{background:linear-gradient(135deg,#4fc3f7,#1976d2)}
.m3-gem[data-t='wood']{background:linear-gradient(135deg,#81c784,#388e3c)}
.m3-gem[data-t='light']{background:linear-gradient(135deg,#ffd54f,#f9a825)}
.m3-gem[data-t='dark']{background:linear-gradient(135deg,#9575cd,#4527a0)}
.m3-gem[data-t='heart']{background:linear-gradient(135deg,#f48fb1,#c2185b)}
.m3-gem.special{animation:m3shine 1.5s infinite}
@keyframes m3shine{0%{transform:scale(1)}50%{transform:scale(1.15);box-shadow:0 0 22px rgba(255,215,0,.9)}100%{transform:scale(1)}}
.m3-cell.dropping{animation:m3drop .3s}
@keyframes m3drop{0%{transform:translateY(-100%)}100%{transform:translateY(0)}}
.m3-cell.cleared{animation:m3clear .3s forwards}
@keyframes m3clear{0%{transform:scale(1);opacity:1}50%{transform:scale(1.4)}100%{transform:scale(.6);opacity:0}}
.m3-cell.empty{background:transparent;cursor:default;box-shadow:none}
.m3-cell.target{border:2px dashed rgba(255,255,255,.5)}
.m3-task{background:rgba(124,92,255,.12);border:1.5px solid rgba(124,92,255,.35);border-radius:12px;padding:8px 14px;font-size:13px;color:#5e40cc;font-weight:700;display:flex;gap:14px;align-items:center}
.m3-task span b{color:#ff5252;font-size:18px;margin:0 4px}
/* ---- 锯齿数独 jigsaw ---- */
.jg{position:relative;background:linear-gradient(135deg,#3a2e6e,#1f1846);padding:6px;border-radius:14px;display:inline-block;box-shadow:0 10px 24px rgba(60,40,120,.4)}
.jg-cell{width:42px;height:42px;border:1px solid rgba(255,255,255,.22);background:#fff;color:#222;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.jg-cell.given{background:#f5f0ff;color:#5e40cc}
.jg-cell.sel{background:#fff8e1;outline:3px solid #ffd54f;outline-offset:-3px}
.jg-cell.err{color:#ff5252;animation:jgerr .4s}
@keyframes jgerr{0%{background:#ffcdd2}100%{background:#fff}}
/* ---- 对角线数独 ---- */
.sudogrid{display:inline-block;background:linear-gradient(135deg,#5e3da5,#2d1a64);padding:6px;border-radius:14px;box-shadow:0 10px 24px rgba(60,40,120,.4)}
.sudogrid .sx-c{width:42px;height:42px;border:1px solid rgba(255,255,255,.22);background:#fff;color:#222;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.sudogrid .sx-c.given{background:#f5f0ff;color:#5e40cc}
.sudogrid .sx-c.sel{background:#fff8e1;outline:3px solid #ffd54f;outline-offset:-3px}
.sudogrid .sx-c.diag{background:linear-gradient(135deg,#fff8e1,#fffaee)}

/* ---- 三消 符石 ---- */
.ms-board{position:relative;width:min(432px,100%);aspect-ratio:1/1;margin:10px auto;background:#1a1330;border-radius:12px}
.ms-gem{position:absolute;width:12.5%;height:12.5%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,5.5vw,24px);cursor:pointer;transition:transform .18s,opacity .18s,left .18s,top .18s;user-select:none;box-sizing:border-box;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.3)}
.ms-gem.sel{outline:4px solid #ffd54f;outline-offset:-4px;transform:scale(1.08)!important}
.ms-gem.filled{background:#3a2e6e!important;color:#fff}
.ms-gem.marked{background:#bca8e6!important;color:#5e40cc;font-size:18px}
.ms-gem.hint{color:#aaa;font-size:11px}
.ms-gem.diag{background:rgba(255,213,79,.18)}

/* ---- 拼图复原 ---- */
.mo-cv{position:relative}
.mo-cell{transition:transform .35s;cursor:pointer}
.mo-cell:hover{background:rgba(255,213,79,.18)!important}

/* ---- 数字迷图 ---- */
.nono-bar{display:flex;gap:8px;justify-content:center;margin:10px 0}
.nono-h{font-size:11px;color:#fff;background:transparent;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;padding:2px;line-height:1.2;overflow:hidden}
.nono-h.col{flex-direction:column;justify-content:flex-end}
.nono-h.row{justify-content:flex-end}
.nono-c{background:#fff;cursor:pointer;user-select:none;position:relative;transition:background .08s}
.nono-c.filled{background:#3a2e6e}
.nono-c.marked{background:#7c5cff;color:#fff;text-align:center;line-height:30px;font-weight:800}
.nono-corner{background:transparent}

/* ---- 双雄争霸：双车同步 ---- */
.ds-road{position:relative;width:100%;max-width:340px;margin:8px auto;background:linear-gradient(180deg,#1c2038,#23284a);border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(20,20,50,.45);touch-action:none}
.ds-divider{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,#f5d90a 0 14px,#2a2f52 14px 28px);z-index:2}
.ds-car{position:absolute;width:56px;height:74px;border-radius:12px 12px 6px 6px;z-index:5;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.ds-car.red{left:11%;background:linear-gradient(180deg,#ff5252,#b71c1c 60%,#7f0000)}
.ds-car.blue{right:11%;background:linear-gradient(180deg,#42a5f5,#0d47a1 60%,#002171)}
.ds-barrier{position:absolute;height:24px;border-radius:8px;background:repeating-linear-gradient(45deg,#ff5252 0 12px,#ffd740 12px 24px);box-shadow:0 3px 8px rgba(0,0,0,.4);z-index:4}
.ds-coin{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd740 60%,#ffab00);box-shadow:0 0 10px rgba(255,215,64,.9);z-index:4;display:flex;align-items:center;justify-content:center;font-size:16px;color:#8a6100;font-weight:800}

/* ---- 连线作战 ---- */
.flow-grid{display:grid;gap:3px;max-width:420px;margin:0 auto;background:#fff;border:2px solid #eee7d8;border-radius:16px;padding:6px;box-shadow:0 4px 14px rgba(90,70,20,.08)}
.flow-cell{aspect-ratio:1;border-radius:8px;background:#f2f1f8;position:relative;cursor:pointer}
.flow-cell.occ{background:#dcd8ef}
.flow-dot{position:absolute;inset:22%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 -2px 3px rgba(0,0,0,.2)}
.flow-dot.sel{box-shadow:0 0 0 4px rgba(124,92,255,.5),0 2px 6px rgba(0,0,0,.3)}
/* ---- 火眼金睛·文字（斯特鲁普） ---- */
.stroop-card{max-width:340px;margin:10px auto;background:#fff;border:2px solid #eee7d8;border-radius:22px;padding:36px 20px;text-align:center;box-shadow:0 4px 14px rgba(90,70,20,.08)}
.stroop-word{font-size:72px;font-weight:800;letter-spacing:6px;line-height:1.1}
.ansrow{display:flex;gap:14px;justify-content:center;margin-top:18px}
.ansbtn{flex:1;max-width:150px;padding:18px 0;font-size:20px;font-weight:800;border:2px solid #eee7d8;border-radius:18px;cursor:pointer;transition:.12s;background:#fff}
.ansbtn:active{transform:scale(.94)}
.ansbtn.yes{background:#e8f7ee;border-color:#66bb6a;color:#2e7d32}
.ansbtn.no{background:#fdecea;border-color:#ef5350;color:#c62828}
/* ---- 点石成金·光线（反射） ---- */
.refl-board{position:relative;max-width:420px;margin:0 auto;background:#14162b;border-radius:18px;padding:6px;box-shadow:0 6px 20px rgba(20,20,50,.4)}
.refl-grid{display:grid;gap:3px}
.refl-cell{aspect-ratio:1;background:#262947;border-radius:7px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.refl-cell.wall{background:#14162b;cursor:default}
.refl-mirror{width:78%;height:78%;border-radius:6px;transition:.15s}
.refl-mirror.m0{background:linear-gradient(135deg,#8a8fc0 45%,#ffd54f 46%,#ffd54f 54%,#8a8fc0 55%)}
.refl-mirror.m1{background:linear-gradient(45deg,#8a8fc0 45%,#ffd54f 46%,#ffd54f 54%,#8a8fc0 55%)}
.refl-src,.refl-rcv{position:absolute;width:20px;height:20px;border-radius:50%;z-index:2}
.refl-src{background:radial-gradient(circle at 40% 35%,#fff,#ffe082 60%,#ffb300);box-shadow:0 0 12px 3px rgba(255,213,79,.8)}
.refl-rcv{background:#2e324f;border:2px solid #7c8ad4;box-shadow:0 0 0 3px rgba(124,138,212,.25)}
.refl-rcv.lit{background:radial-gradient(circle at 40% 35%,#fff,#a5f3c8 60%,#34d399);border-color:#34d399;box-shadow:0 0 14px 4px rgba(52,211,153,.8)}
.refl-relay{width:74%;height:74%;border-radius:8px;position:relative;cursor:pointer;opacity:.95;transition:.15s}
.refl-relay::after{content:'\27F3';position:absolute;right:-3px;bottom:-3px;font-size:10px;filter:grayscale(.2)}
.refl-cell.relaycell{cursor:pointer}
/* ---- 魔法符石·记忆（八角星） ---- */
.oct-wrap{position:relative;width:300px;height:300px;margin:0 auto}
.petal{position:absolute;width:74px;height:74px;border-radius:16px;background:#fff;border:2px solid #d8d4ec;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 2px 6px rgba(80,70,160,.1)}
.petal.blank{background:#2b2b40;border-color:#2b2b40;cursor:pointer}
.petal.ok{background:#e8f7ee;border-color:#66bb6a}
.petal.wrong{background:#fdecea;border-color:#ef5350}
.oct-center{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#a855f7);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 4px 10px rgba(124,92,255,.5)}
.symopts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.symopt{width:58px;height:58px;border-radius:14px;border:2px solid #eee7d8;background:#fff;font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.symopt:active{transform:scale(.9)}
.symopt.sel{border-color:#7c5cff;background:#f0edff}

/* ---- 杀手数独 / 武士数独 ---- */
.cagesum{position:absolute;left:2px;top:0;font-size:10px;font-weight:700;color:#7a4a00;pointer-events:none;line-height:1}
.sam-wrap{overflow-x:auto;display:flex;justify-content:center}
.sam-blank{background:transparent!important;border:none!important;box-shadow:none!important;cursor:default!important}

/* ---- 点石成金（记忆木棍 + 推算落洞） ---- */
.dg-wrap{position:relative;margin:0 auto;max-width:100%}
.dg-grid{position:absolute;display:grid;gap:6px}
.dg-cell{position:relative;border-radius:8px;background:#221a4a;display:flex;align-items:center;justify-content:center}
.dg-stick{position:absolute;width:80%;height:6px;background:linear-gradient(90deg,#ff8a65,#ffd54f);border-radius:3px;box-shadow:0 0 10px rgba(255,213,79,.7);transition:opacity .35s}
.dg-stick.s1{transform:rotate(45deg)}
.dg-stick.s2{transform:rotate(-45deg)}
.dg-stick.hide{opacity:0}
.dg-hole{position:absolute;width:16px;height:16px;border-radius:50%;background:#0a0618;border:2px solid #6b5bb5;box-shadow:inset 0 0 5px rgba(0,0,0,.9);z-index:6}
.dg-hole.pick{cursor:pointer;border-color:#ffd54f;box-shadow:0 0 10px rgba(255,213,79,.6)}
.dg-hole.entry{border-color:#4fc3f7;box-shadow:0 0 14px rgba(79,195,247,.9)}
.dg-hole.right{background:#43a047;border-color:#66bb6a}
.dg-hole.wrong{background:#e53935;border-color:#ef5350}
.ssz-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ssz-board{display:grid;gap:3px;background:#2b2440;padding:8px;border-radius:14px;box-shadow:0 8px 24px rgba(20,10,60,.4)}
.ssz-cell{width:42px;height:42px;border-radius:8px;background:#f3eee2;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.ssz-cell.w{background:#3a3450;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.ssz-goal{box-shadow:inset 0 0 0 3px currentColor}
.ssz-pc{position:absolute;width:30px;height:30px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:all .18s}
.ssz-pc.on{outline:3px solid #fff;outline-offset:1px}
.ssz-ctrl{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px;margin-top:4px}
.ssz-ctrl button{border:none;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#5e40cc);color:#fff;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(94,64,204,.4)}
.ssz-ctrl button:active{transform:scale(.92)}
.ssz-ctrl .sp{visibility:hidden}
.skz-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.skz-board{display:grid;gap:2px;background:#1f2a36;padding:8px;border-radius:12px;box-shadow:0 8px 24px rgba(10,20,30,.4)}
.skz-cell{width:40px;height:40px;border-radius:6px;background:#d9e2ea;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.skz-cell.w{background:#3a4452}
.skz-cell.t{background:#fff3cf;box-shadow:inset 0 0 0 3px #ffb300}
.skz-cell.b{background:#cfe9ff}
.skz-cell.bon{background:#c6f0cf}
.skz-player{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f4511e 60%,#b3370f);box-shadow:0 2px 5px rgba(0,0,0,.35);transition:all .15s}
.skz-box{position:absolute;width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#ffb74d,#f57c00);box-shadow:0 2px 5px rgba(0,0,0,.3);transition:all .15s}
.skz-box.on{background:linear-gradient(135deg,#aed581,#689f38)}
.dg-ball{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff5252 40%,#b71c1c);box-shadow:0 0 10px rgba(255,82,82,.85);z-index:9;transition:left .28s linear,top .28s linear}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px;max-width:460px;margin:14px auto}
.lvbtn{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #e3d9c2;border-radius:14px;background:#fff;cursor:pointer;color:#6b6250;box-shadow:0 2px 6px rgba(90,70,20,.07);transition:.15s}
.lvbtn span{position:absolute;bottom:3px;right:6px;font-size:12px;font-weight:700;opacity:.75}
.lvbtn.next{border-color:#7c5cff;background:linear-gradient(135deg,#7c5cff,#5e40cc);color:#fff;box-shadow:0 6px 16px -4px rgba(124,92,255,.6)}
.lvbtn.cleared{border-color:#66bb6a;color:#2e7d32;background:#eef7ee}
.lvbtn.skipped{border-color:#ffb300;color:#e65100;background:#fff8e1}
.lvbtn.locked{opacity:.4;cursor:not-allowed;background:#f3efe6}
.lvbtn:not(.locked):hover{transform:translateY(-3px);box-shadow:0 8px 18px -6px rgba(124,92,255,.5)}

/* ===== 连线作战：终点高亮 / 起点选中 ===== */
.flow-cell.tgt{outline:3px dashed #ffb300;outline-offset:-3px;animation:flpulse .75s infinite alternate}
@keyframes flpulse{from{box-shadow:inset 0 0 0 0 rgba(255,179,0,.55)}to{box-shadow:inset 0 0 14px 3px rgba(255,179,0,.5)}}
.flow-cell.selcell{outline:3px solid #fff;outline-offset:-3px}
.flow-dot.tgt{transform:scale(1.22);box-shadow:0 0 0 4px rgba(255,179,0,.9),0 0 16px rgba(255,179,0,.75)}
.flow-dot.sel{transform:scale(1.15);box-shadow:0 0 0 4px rgba(255,255,255,.95),0 0 14px rgba(0,0,0,.35)}
.flow-grid{width:100%;max-width:420px;margin:0 auto;touch-action:none}
/* ===== 双雄争霸：多任务分区 ===== */
.mt-wrap{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:520px;margin:0 auto}
.mt-zone{position:relative;flex:1 1 0;min-width:96px;height:360px;border-radius:16px;overflow:hidden;border:3px solid #d9cfb8;background:linear-gradient(180deg,#f7f2e6,#efe6d3);user-select:none;touch-action:none;transition:border-color .12s,transform .12s}
.mt-zone.act{border-color:#7c5cff;transform:translateY(-3px);box-shadow:0 8px 20px -6px rgba(124,92,255,.55)}
.mt-zone .mt-key{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#8a7f66;letter-spacing:1px;z-index:3;pointer-events:none}
.mt-half{position:absolute;left:0;right:0;height:50%;text-align:center;line-height:1;font-size:26px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.mt-half.up{top:0;background:linear-gradient(180deg,rgba(124,92,255,.16),rgba(124,92,255,.03))}
.mt-half.dn{bottom:0;background:linear-gradient(0deg,rgba(255,112,67,.16),rgba(255,112,67,.03))}
.mt-mid{position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,#c9bfa6 0 6px,transparent 6px 12px);z-index:2}
.mt-puck{position:absolute;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 10px rgba(0,0,0,.28);z-index:5;transition:top .05s linear}
.mt-obj{position:absolute;width:34px;height:34px;margin-left:-17px;left:50%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;z-index:4}
.mt-obj.bad{background:radial-gradient(circle at 35% 30%,#ff8a65,#c62828);box-shadow:0 0 8px rgba(198,40,40,.6)}
.mt-obj.good{background:radial-gradient(circle at 35% 30%,#fff59d,#f9a825);box-shadow:0 0 8px rgba(249,168,25,.7)}
.mt-hint{text-align:center;font-size:13px;color:#6b6250;margin:6px 0}
@media(max-width:520px){.mt-zone{height:320px;min-width:88px}.mt-puck{width:38px;height:38px;margin-left:-19px}}

.mt-half.on{filter:brightness(1.06)}
.mt-half.up.on{background:linear-gradient(180deg,rgba(124,92,255,.42),rgba(124,92,255,.1))}
.mt-half.dn.on{background:linear-gradient(0deg,rgba(255,112,67,.42),rgba(255,112,67,.1))}
/* ===== 新增热门小游戏通用 ===== */
.arc-box{position:relative;margin:0 auto;background:#1b2030;border-radius:12px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 2px #2c3448}
.arc-row{display:flex}
.arc-c{width:16px;height:16px;box-sizing:border-box;border:1px solid #26304a}
@media(max-width:520px){.arc-c{width:13px;height:13px}}
.arc-ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.arc-ctrl button{min-width:56px;height:46px;font-size:20px;border-radius:12px;border:2px solid #d9cfb8;background:#fff;cursor:pointer}
.arc-ctrl button:active{background:#efe9db}
.ms-grid{display:grid;gap:2px;justify-content:center;margin:8px auto}
.ms-c{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border-radius:5px;background:#b9c4d4;cursor:pointer;user-select:none;touch-action:manipulation;color:#37474f}
@media(max-width:520px){.ms-c{width:27px;height:27px;font-size:13px}}
.ms-c.open{background:#eceff1;color:#263238}
.ms-c.flag{background:#ffe082}
.ms-c.boom{background:#e53935;color:#fff}
/* 扫雷自由缩放：棋盘放进可平移容器，放大后可拖动查看 */
.ms-wrap{width:100%;max-width:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:2px 0}
.ms-bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ms-zoomlab{display:inline-flex;align-items:center;justify-content:center;min-width:54px;font-weight:800;font-size:14px;color:#6b6250}
/* ===== 皮肤调色板（街机游戏共用，商城可换） ===== */
:root{--sk1:#00bcd4;--sk2:#ffeb3b;--sk3:#9c27b0;--sk4:#4caf50;--sk5:#f44336;--sk6:#2196f3;--sk7:#ff9800;--skpat:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 3px,transparent 3px 7px)}
/* ===== 背景主题（玩家自选，全局生效） ===== */
body.bg-default{background:linear-gradient(180deg,#fdf9f0,#f4edde 320px,#f4edde)}
body.bg-aurora{background:radial-gradient(1200px 600px at 20% -10%,#3a2a8a 0,transparent 60%),radial-gradient(900px 500px at 90% 10%,#7b3ff2 0,transparent 55%),linear-gradient(160deg,#1a1040,#2a1c66 60%,#4a2f9e)}
body.bg-sunset{background:radial-gradient(900px 500px at 80% -10%,#ffd36e 0,transparent 55%),linear-gradient(160deg,#ff9a5a,#ff5e7e 55%,#c8326b)}
body.bg-ocean{background:radial-gradient(900px 500px at 15% -10%,#7fe9e0 0,transparent 55%),linear-gradient(160deg,#0d3b66,#1d7fa0 55%,#3fd0c9)}
body.bg-forest{background:radial-gradient(900px 500px at 85% -10%,#bff0c0 0,transparent 55%),linear-gradient(160deg,#0f3d2e,#2e7d52 55%,#7bc47f)}
body.bg-candy{background:radial-gradient(900px 500px at 20% -10%,#fff0fb 0,transparent 55%),linear-gradient(160deg,#ffd9ec,#ffb3d9 55%,#c79bff)}
body.bg-night{background:radial-gradient(2px 2px at 20% 30%,#fff 0,transparent 100%),radial-gradient(2px 2px at 70% 60%,#fff 0,transparent 100%),radial-gradient(2px 2px at 40% 80%,#fff 0,transparent 100%),linear-gradient(160deg,#0b1026,#1b2347 55%,#2d3a6b)}
body.bg-mint{background:radial-gradient(900px 500px at 80% -10%,#e8fff8 0,transparent 55%),linear-gradient(160deg,#e0fff7,#a8f0e0 55%,#6fd6c4)}
body.bg-rose{background:radial-gradient(900px 500px at 15% -10%,#fff4ea 0,transparent 55%),linear-gradient(160deg,#fff0e6,#ffd1b3 55%,#f7a072)}
body.bg-sky{background:linear-gradient(160deg,#aee1ff,#cdeffd 55%,#eaf7ff)}
body.bg-graphite{background:radial-gradient(900px 500px at 80% -10%,#5a6473 0,transparent 55%),linear-gradient(160deg,#2b2f36,#3c424d 55%,#545b68)}
body.bg-bloom{background:radial-gradient(900px 500px at 20% -10%,#ffe0ef 0,transparent 55%),linear-gradient(160deg,#ffd9ec,#ffc2dd 55%,#d9b3ff)}
body.bg-graphite #hd{background:linear-gradient(120deg,#90a4ae,#607d8b 55%,#455a64)}
/* 深色背景时顶部栏与卡片保持对比 */
body.bg-aurora #hd,body.bg-night #hd{background:linear-gradient(120deg,#ffb300,#ff8f00 55%,#f4511e)}
/* ===== 画布自适应屏幕 ===== */
canvas{display:block;margin:0 auto;max-width:100%;height:auto;touch-action:none;border-radius:14px;background:rgba(255,255,255,.06)}
/* ===== 顶栏金币 ===== */
.coin-badge{margin-left:auto;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
/* ===== 外观/商城弹窗 ===== */
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0 4px}
.bg-opt{height:60px;border-radius:12px;cursor:pointer;border:3px solid transparent;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bg-opt.sel{border-color:#f4511e}
.bg-opt span{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.shop-tabs{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.shop-tab{border:2px solid #e5ddc9;background:#fff;border-radius:999px;padding:7px 18px;font-size:14px;font-weight:700;cursor:pointer;color:#5c554a}
.shop-tab.sel{border-color:#f4511e;background:#fff3ea;color:#f4511e}
.shop-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.shop-card{background:#faf6ec;border:1px solid #efe6d0;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.shop-card .sc-title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.shop-card .sc-desc{font-size:12px;color:#8b8371;line-height:1.6;min-height:34px}
.shop-card .sc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.swatch{display:flex;gap:3px}
.swatch i{width:16px;height:16px;border-radius:4px;display:inline-block}
.sc-buy{border:1px solid #f4511e;background:#f4511e;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.sc-buy:disabled{opacity:.5;cursor:default;background:#bbb;border-color:#bbb}
.sc-own{font-size:12px;color:#2e7d32;font-weight:700}
.sc-use{border:1px solid #2e7d32;background:#fff;color:#2e7d32;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
/* ===== 游戏内道具栏 ===== */
.itembar{display:flex;gap:8px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.itembtn{border:1px solid #e5ddc9;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;color:#5c554a;box-shadow:0 2px 5px rgba(90,70,20,.08);display:flex;align-items:center;gap:5px}
.itembtn:disabled{opacity:.45;cursor:default}
/* ===== 街机方块立体感 ===== */
.arc-c{border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 5px rgba(0,0,0,.28)}
.ms-c.open{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
/* ===== 控件过渡与悬停 ===== */
.hbtn{transition:filter .15s,transform .12s}
.hbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.hbtn:active{transform:translateY(0)}
.coin-badge{transition:transform .18s}
.coin-badge.bump{transform:scale(1.18)}
.itembtn{transition:transform .12s,box-shadow .12s}
.itembtn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(90,70,20,.18)}
.sc-buy,.sc-use{transition:filter .12s,transform .12s}
.sc-buy:hover,.sc-use:hover{filter:brightness(1.06);transform:translateY(-1px)}
.shop-card{transition:transform .15s,box-shadow .15s}
.shop-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(0,0,0,.35)}
.bg-opt{transition:transform .15s,border-color .12s}
.bg-opt:hover{transform:translateY(-2px)}
/* ===== 护盾复活全屏闪光 ===== */
@keyframes shieldFlash{0%{opacity:0}18%{opacity:.8}100%{opacity:0}}
.shield-flash{position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(33,150,243,.55),rgba(124,77,255,.32) 48%,transparent 74%);box-shadow:inset 0 0 0 7px rgba(124,77,255,.5);animation:shieldFlash .6s ease-out}
/* ===== 小屏弹窗单列 ===== */
@media(max-width:380px){.shop-list{grid-template-columns:1fr}.bg-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
/* ===== 暂停按钮（游戏中显示） ===== */
.hbtn.paused{background:#f4511e;color:#fff;border-color:#f4511e}
@media(max-width:520px){.hbtn{font-size:13px;padding:6px 9px}}
/* 分数 / 连击实时浮窗 */
.score-float{position:absolute;top:8px;right:8px;z-index:42;background:rgba(18,22,40,.5);color:#fff;padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;line-height:1.25;pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .12s}
.score-float .cb{font-size:12px;opacity:.85;color:#ffd54f}
/* 游戏中：分数浮标与连击提示压在吸顶栏下方（--hdh 为 JS 实测顶栏高度），
   否则 top:8px 会盖住顶栏右侧按钮 */
body.ingame .score-float{top:calc(var(--hdh,64px) + 8px)}
body.ingame .combo-pop{top:calc(var(--hdh,64px) + 30px)}
.combo-pop{position:absolute;top:52px;right:8px;z-index:43;color:#ffd54f;font-weight:900;font-size:18px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.45);animation:cpe .5s ease forwards}
@keyframes cpe{0%{transform:translateY(6px) scale(.8);opacity:0}30%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-4px) scale(1);opacity:0}}
@media(max-width:520px){.score-float{font-size:13px;padding:5px 9px}.combo-pop{font-size:16px}}
/* ---- 移动端自适应：窄屏顶栏压缩，避免标题逐字换行/按钮溢出 ---- */
@media(max-width:420px){
  #hd{gap:6px;padding:10px 10px}
  #hdTitle{font-size:14px}
  .hbtn{padding:6px 9px;font-size:12.5px}
  .coin-badge{font-size:12px}
}
/* 游戏中顶栏恒定单行：按钮多时会换行成两排、吃掉几十像素高度把画面下压，
   这里禁止换行并让按钮区自身横向滚动，标题按剩余宽度收缩省略。 */
#hd.nowrap{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#hd.nowrap::-webkit-scrollbar{display:none}
#hd.nowrap #hdTitle{flex:1 1 auto;min-width:44px;font-size:15px;text-align:left}
#hd.nowrap .hbtn{flex:0 0 auto}
#hd.nowrap .coin-badge{margin-left:4px;flex:0 0 auto}
/* 窄屏游戏内：钱包与低频按钮收进「⋯」，顶栏只保留 菜单/重开/暂停，避免溢出被截断 */
#hd.nowrap .coin-badge{display:none!important}
#hd.nowrap #btnBg,#hd.nowrap #btnShop,#hd.nowrap #btnStats{display:none}
#hd.more #btnBg,#hd.more #btnShop,#hd.more #btnStats{display:inline-block}
#hd.more .coin-badge{display:flex!important}
#hd.more{flex-wrap:wrap}
#btnMore{display:none;flex:0 0 auto}
#hd.nowrap #btnMore{display:inline-block}
</style>

<script>
// ===== 安全存档（localStorage 被禁用时自动降级为内存存档，游戏照常可玩） =====
var S=(function(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch(e){var m={};return{getItem:function(k){return m[k]!==undefined?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]}}}})();
var TIMERS=[];
/* 全局拦截 setInterval/setTimeout：裸用定时器也会纳入 TIMERS，
   由 stopTimers() 统一清理，杜绝切游戏后后台定时器泄漏（含递归自调度如 refreshTot）。 */
var _setInterval=setInterval,_setTimeout=setTimeout;
setInterval=function(fn,ms){var t=_setInterval(fn,ms);TIMERS.push(t);return t};
setTimeout=function(fn,ms){var t=_setTimeout(fn,ms);TIMERS.push(t);return t};
function later(f,ms){return setTimeout(f,ms);}
var GAME_PAUSED=false;
/* 暂停期间累计的墙钟时长(ms)。所有「用时/倒计时」必须走 nowClock()=Date.now()-PAUSED_ACC，
   否则暂停时长会被计入成绩，恢复后显示的时间还会突然跳变。 */
var PAUSED_ACC=0,PAUSE_AT=0;
function nowClock(){return Date.now()-PAUSED_ACC}
function every(f,ms){return setInterval(function(){if(GAME_PAUSED)return;f()},ms);}
function stopTimers(){for(var i=0;i<TIMERS.length;i++){clearTimeout(TIMERS[i]);clearInterval(TIMERS[i])}TIMERS=[];stopDocLS()}
/* 全局监听器注册表：document 上的监听器无法靠 document.onkeydown=null 清除，
   必须由 onDoc() 登记、随 stopTimers()（每局 start/退出都会调用）统一摘除，
   否则反复切游戏会无限累积监听器并残留上一局的闭包。 */
var DOC_LS=[];
function onDoc(t,f){if(document.addEventListener)document.addEventListener(t,f);DOC_LS.push([t,f]);return f}
function stopDocLS(){for(var i=0;i<DOC_LS.length;i++){try{if(document.removeEventListener)document.removeEventListener(DOC_LS[i][0],DOC_LS[i][1])}catch(e){}}DOC_LS=[]}

function fitCell(n,base,gap){gap=gap||0;var vw=document.documentElement.clientWidth||390;
var avail=Math.min(vw,640)-42;var v=Math.floor((avail-(n-1)*gap)/n);
return Math.max(13,Math.min(base,v))}
if(typeof MUSICK!=='undefined'&&MUSICK)try{MUSICK.stop()}catch(e){}

/* 视口高度实测：CSS 的 100vh / height:100% 在移动端会因地址栏而偏高或断链，
   统一用 JS 写入 --vh（可视高度）与 --hdh（顶栏实测高度）供 #stage.fill 计算。 */
function bindHead(){
  var m=$('btnMore');if(!m)return;
  m.onclick=function(){
    var hd=$('hd');if(!hd)return;

bindHead();
function syncVH(){
  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight||640;
  var hd=$("hd");
  var hh=hd&&hd.getBoundingClientRect?hd.getBoundingClientRect().height:64;

  if(r&&r.style){r.style.setProperty("--vh",Math.round(vh)+"px");r.style.setProperty("--hdh",Math.round(hh)+"px")}

syncVH();
window.addEventListener("resize",syncVH);

function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
// ===== 通用 UI 构件：消除各游戏重复的「遮罩 + 面板 + 标题」拼装代码 =====
function overlayPanel(title){var ov=h('div','overlay');var p=h('div','panel');if(title)p.appendChild(h('div','ptitle',title));return {ov:ov,p:p}}
// 统一方块上色：背景色 + 皮肤纹理(var(--skpat)) + 边框，供俄罗斯方块/贪吃蛇复用（原两处各 3 行重复）
function paintCell(el,color){if(color){el.style.backgroundColor=color;el.style.backgroundImage='var(--skpat)';el.style.borderColor='rgba(0,0,0,.3)'}else{el.style.backgroundColor='';el.style.backgroundImage='';el.style.borderColor='#26304a'}}
// 重开当前游戏并复位暂停/分数浮窗/连击状态；「结束页-再来一次」与顶栏「重开」按钮共用，保证行为一致
/* 画布高度求解。
   反面教材：早期版本用「视口 − 画布自身 top − padding」推算，只统计了画布【上方】的占用，
   而摇杆 / 道具栏 / body 底部留白都在画布【下方】，于是舞台整体被顶出视口（贪吃蛇溢出 162px）。
   且画布容器是 flex:1 1 auto —— basis 取内容高度，[画布高度→内容→basis→容器高度] 形成自锁。
   正确做法：可用 = 视口 − 舞台顶 − 舞台内外边距 − 其它兄弟实占(含 margin) − 间隙，
   再写回容器显式高度并用真实矩形做闭环校正吸收估算误差。 */
function fitCanvasH(el,st,minH){minH=minH||180;
 var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||640;
 if(!st||!el||!el.getBoundingClientRect)return minH;
 var H=minH;
 try{
  var cs=window.getComputedStyle?window.getComputedStyle(st):null;
  var pt=0,pb=0,bt=0,bb=0,gap=0;
  if(cs){pt=parseFloat(cs.paddingTop)||0;pb=parseFloat(cs.paddingBottom)||0;
   bt=parseFloat(cs.borderTopWidth)||0;bb=parseFloat(cs.borderBottomWidth)||0;
   var gp=parseFloat(cs.rowGap);gap=isFinite(gp)?gp:0;}
  var stTop=st.getBoundingClientRect().top;
  var others=0,nOther=0;
  for(var i=0;i<st.children.length;i++){
   var sib=st.children[i];if(sib===el)continue;
   try{
    var sc=window.getComputedStyle(sib);
    if(!sc||sc.display==='none'||sc.position==='absolute'||sc.position==='fixed')continue;
    var rr=sib.getBoundingClientRect();
    if(!rr||!rr.height)continue;
    others+=rr.height+(parseFloat(sc.marginTop)||0)+(parseFloat(sc.marginBottom)||0);
    nOther++;
   }catch(e){}
  }
  var avail=vh-stTop-pt-pb-bt-bb-others-gap*nOther-8;
  if(isFinite(avail)&&avail>minH)H=Math.round(avail);
  if(!isFinite(H)||H<minH)H=minH;
  el.style.height=H+'px';
 }catch(e){}
 /* 闭环校正：目标是「舞台底 + body 底部留白」不越过视口；最多 3 轮，且只减不增 */
 try{
  var bpad=0;try{var bcs=window.getComputedStyle?window.getComputedStyle(document.body):null;if(bcs)bpad=parseFloat(bcs.paddingBottom)||0}catch(e){}
  for(var k=0;k<3;k++){
   var sr=st.getBoundingClientRect();
   var over=Math.round(sr.bottom+bpad-vh+8);
   if(over<=0)break;
   var cur=el.getBoundingClientRect().height;
   var nh=Math.max(minH,Math.round(cur-over));
   if(nh>=Math.round(cur))break;
   el.style.height=nh+'px';
  }
 }catch(e){}
 try{var rz=el.getBoundingClientRect();if(rz&&rz.height>0)H=Math.round(rz.height)}catch(e){}
 return Math.max(minH,Math.round(H));
}

function ri(n){return Math.floor(Math.random()*n)}
function rrange(a,b){return a+ri(b-a+1)}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

var ENDLESS_GAMES={quiz:1,reacttest:1,pixel:1,flashnum:1,accu:1,colortone:1,eagle:1,quick:1,dual:1,blitz:1,tiles:1};

  if(!id||score==null||isNaN(score))return false;
  var k='bt_'+id,old=+(S.getItem(k)||0),rec;
  if(low){rec=old>0?score<old:score>0}else{rec=score>old&&score>0}

function setLive(id,score,low){if(score==null||isNaN(score))return;if(!LIVE||LIVE.id!==id){LIVE={id:id,score:score,low:!!low}}
  else{var _pv=LIVE.score;LIVE.score=low?Math.min(LIVE.score,score):Math.max(LIVE.score,score);LIVE.low=!!low;if(LIVE.score>_pv)bumpCombo()}
  updateScoreFloat()}
/* 中途退出补记成绩：只有游戏从未自行上报（setLive）时才去 HUD 里猜。
   原实现对 HUD 内所有 <b> 取最大值，会把倒计时(⏱)、目标值(2048 的『目标 2048』)、
   关卡号、『已用秒数』当成成绩写进最佳记录，直接污染战绩。
   现改为：① 已有上报就不再猜；② 逐个 span 过滤掉计时/生命/目标/最优/剩余/关卡等非成绩项；
   ③ 每个 span 只取第一个 <b>，避开『点亮 <b>0</b>/<b>2</b>』这类分母。 */
function probeLive(){if(!CURRENT||CURRENT.low)return;
  if(LIVE&&LIVE.id===CURRENT.id)return;
  var st=$('stage');if(!st||!st.querySelector)return;

   ---------------------------------------------------------------------
   ① 反向生成：从"所有箱子都已在目标上"的已解状态倒着【拉】箱子，
      因此生成出的每一关 100% 可解，不再靠随机碰撞碰运气；
   ② 真实求解：内置 A* 求解器算出【最优推动数】作为核心难度指标，
      用"最优推动数 + 死角陷阱数"来筛关，而不是"箱子越多越难"；
   ③ 困难档刻意【缩小地图到 7×7、减少箱子到 2~3 个】，
      改用内部墙体布局 + 死角陷阱 + 更长的推理链来制造真正难度；

/* A* 求"最少推动次数"。启发式 = 每个箱子到最近目标的曼哈顿距离之和（可采纳） */
function sokSolve(rows,cap){

      for(var k=0;k<4;k++){var v=aa[k];if(v<0||wall[v]||stamp[v]===mk)continue;

/* 死角陷阱数：内部非目标格中"两面成直角"的格子数 —— 越多越需要提前规划 */
function sokTraps(rows){
  var H=rows.length,W=rows[0].length,n=0;
  /* 只统计离边界 >=2 的内部格：外圈四角是天然的，不算"设计出来的陷阱" */
  for(var r=2;r<H-2;r++)for(var c=2;c<W-2;c++){
    var ch=rows[r].charAt(c)||' ';if(ch==='#'||ch==='.'||ch==='*'||ch==='+')continue;
    var u=(rows[r-1].charAt(c)==='#'),d=(rows[r+1].charAt(c)==='#');
    var l=(rows[r].charAt(c-1)==='#'),rr=(rows[r].charAt(c+1)==='#');
    if((u||d)&&(l||rr))n++}

}
/* 反向拉箱生成候选关卡：内部墙体 + 连通性校验 + 目标不落死角 */
function genSokCand(T,rnd){
  var W=T.W,H=T.H,B=T.B,r,c,i;
  function ri(n){return Math.floor(rnd()*n)}
  var D4=[[-1,0],[1,0],[0,-1],[0,1]];
  var wall=[];
  for(r=0;r<H;r++){wall.push([]);for(c=0;c<W;c++)wall[r].push(r===0||c===0||r===H-1||c===W-1)}
  var inner=[];for(r=1;r<H-1;r++)for(c=1;c<W-1;c++)inner.push([r,c]);
  for(i=inner.length-1;i>0;i--){var j=ri(i+1);var t=inner[i];inner[i]=inner[j];inner[j]=t}
  /* 内部墙体：制造走廊、死角与绕行需求 —— 困难的"巧妙布局"主要来自这里 */
  for(i=0;i<T.walls&&i<inner.length;i++){

    if(rnd()<0.5){var dd=[[0,1],[1,0]][ri(2)];var nr=cl[0]+dd[0],nc=cl[1]+dd[1];
      if(nr>0&&nr<H-1&&nc>0&&nc<W-1)wall[nr][nc]=true}}
  var free=[];for(r=1;r<H-1;r++)for(c=1;c<W-1;c++)if(!wall[r][c])free.push([r,c]);
  if(free.length<B*3+6)return null;
  /* 连通性：内部空格必须全连通，否则生成出来的图不成立 */
  var seen={},st=[free[0]],cnt=0;seen[free[0][0]+','+free[0][1]]=1;cnt=1;
  while(st.length){var u=st.pop();
    for(var k=0;k<4;k++){var nr2=u[0]+D4[k][0],nc2=u[1]+D4[k][1];
      if(nr2<1||nr2>=H-1||nc2<1||nc2>=W-1||wall[nr2][nc2])continue;
      var kk=nr2+','+nc2;if(seen[kk])continue;seen[kk]=1;cnt++;st.push([nr2,nc2])}}

  var pool=free.filter(function(x){return !corner(x[0],x[1])});
  if(pool.length<2*B+3)return null;
  for(i=pool.length-1;i>0;i--){var j2=ri(i+1);var t2=pool[i];pool[i]=pool[j2];pool[j2]=t2}

  var box=rest.slice(0,B),pl=rest[rest.length-1];
  /* 便宜的预筛：箱子到最近目标的总跨度太小说明关卡太直白，直接淘汰省求解开销 */
  var span=0;
  for(i=0;i<B;i++){var bd=1e9;
    for(var t4=0;t4<B;t4++){var dd2=Math.abs(box[i][0]-tgt[t4][0])+Math.abs(box[i][1]-tgt[t4][1]);if(dd2<bd)bd=dd2}

  var boxSet={},tgtSet={};
  for(i=0;i<B;i++){boxSet[box[i][0]+','+box[i][1]]=1;tgtSet[tgt[i][0]+','+tgt[i][1]]=1}

      else if(isT)line+='.';

}
function genSok(diff,lv,seed){
  var T=sokTier(diff,lv),t0=nowClock(),best=null,bestSc=-1,bestP=0;
  for(var a=0;a<T.tries;a++){
    if(nowClock()-t0>T.budget)break;
    var rnd=mulberry32(((seed||1)*2654435761^(diff+1)*40503^(lv+1)*97^a*131)>>>0);
    var rows=genSokCand(T,rnd);
    if(!rows)continue;
    var p=sokSolve(rows,20000);
    if(p<2)continue;                       /* 无解或一步了事 —— 淘汰 */
    var tr=sokTraps(rows);
    /* 有 cap（简单/中等）：靠近目标难度即收，避免一路取到最难的样本；
       无 cap（困难）：继续按"推动越多越好"择优 */
    var sc=T.cap?(p*2+tr*3-Math.abs(p-T.cap)*12+(p>=T.minP?80:0)+(tr>=T.minTrap?20:0))
                :(p*10+tr*4+(p>=T.minP?120:0)+(tr>=T.minTrap?30:0));
    if(sc>bestSc){bestSc=sc;best=rows;bestP=p}
    if(p>=T.minP&&tr>=T.minTrap&&(!T.cap||Math.abs(p-T.cap)<=1))break;
  }
  if(best){SOKLASTPAR=bestP;return best}
  /* 兜底：放宽墙体与跨度再来一轮，保证一定能出关 */
  var T2={W:T.W,H:T.H,B:T.B,walls:Math.max(0,T.walls-1),minSpan:2,minP:2,minTrap:0,tries:30,budget:320};
  t0=nowClock();best=null;bestSc=-1;bestP=0;
  for(var a2=0;a2<T2.tries;a2++){
    if(nowClock()-t0>T2.budget)break;
    var rnd2=mulberry32(((seed||1)*22695477^(lv+3)*79^a2*61)>>>0);
    var r2=genSokCand(T2,rnd2);
    if(!r2)continue;
    var p2=sokSolve(r2,20000);
    if(p2<2)continue;
    if(p2>bestP){bestP=p2;best=r2}
    if(p2>=4)break;
  }
  if(best){SOKLASTPAR=bestP;return best}
  SOKLASTPAR=6;
  return ['#######','#.    #','#  $  #','#  @  #','#  $  #','#    .#','#######'];
}

var PROG=(function(){try{return JSON.parse(S.getItem('bt_prog')||'{}')}catch(e){return{}}})();
function progSave(){try{S.setItem('bt_prog',JSON.stringify(PROG))}catch(e){}}
function progGet(g,d){return (PROG[g]&&PROG[g][d])||{cleared:0,skip:0}}
function progSet(g,d,o){PROG[g]=PROG[g]||{};PROG[g][d]=o;progSave();}
function levelCleared(g,d,lv){var p=progGet(g,d);if(lv>p.cleared)p.cleared=lv;progSet(g,d,p);}
function levelSkipped(g,d,lv){var p=progGet(g,d);if(lv>p.skip)p.skip=lv;progSet(g,d,p);}

var dr=cd==='u'?-1:cd==='d'?1:0;
var dc=cd==='r'?1:cd==='l'?-1:0;
var nr=r+dr,nc=c+dc;
if(nr<0)return{path:path,es:'t',ei:c};
if(nr>=N)return{path:path,es:'b',ei:c};
if(nc<0)return{path:path,es:'l',ei:r};
if(nc>=N)return{path:path,es:'r',ei:r};
r=nr;c=nc;path.push({r:r,c:c})}

/* 同调滑块：BFS 求【最优步数】。三块同步滑动，状态空间 = 位置组合，规模很小可精确求解。
   难度不再靠"从第几关开始"偷懒，而是按真实最优步数把关卡分层。 */
function syncSolve(rows,cap){
  cap=cap||120000;
  var N=rows.length,NC=N*N,r,c,i;
  var wall=new Array(NC),st=[-1,-1,-1],gl=[-1,-1,-1];
  for(r=0;r<N;r++)for(c=0;c<N;c++){var ch=rows[r].charAt(c)||' ';
    if(ch==='#')wall[r*N+c]=true;
    if(ch>='1'&&ch<='3')st[+ch-1]=r*N+c;
    if(ch>='A'&&ch<='C')gl[ch.charAt?ch.charCodeAt(0)-65:0]=r*N+c}
  var start=[],goal=[];
  for(i=0;i<3;i++)if(st[i]>=0&&gl[i]>=0){start.push(st[i]);goal.push(gl[i])}
  var P=start.length;if(!P)return -1;
  var D=[[-1,0],[1,0],[0,-1],[0,1]];
  function enc(ps){var v=0;for(var z=0;z<P;z++)v=v*NC+ps[z];return v}
  function slide(ps0,dr,dc){
    var ord=[];for(var z=0;z<P;z++)ord.push({i:z,k:(((ps0[z]/N)|0)*dr+(ps0[z]%N)*dc)});
    ord.sort(function(a,b){return b.k-a.k});
    var occ={},res=ps0.slice();
    for(var z2=0;z2<P;z2++)occ[ps0[z2]]=1;
    for(var t=0;t<P;t++){var o=ord[t];var p=res[o.i];delete occ[p];
      for(;;){var r2=((p/N)|0)+dr,c2=(p%N)+dc;
        if(r2<0||r2>=N||c2<0||c2>=N)break;var nk=r2*N+c2;
        if(wall[nk])break;if(occ[nk])break;p=nk}
      res[o.i]=p;occ[p]=1}
    return res}
  var s0=enc(start),g0=enc(goal);
  if(s0===g0)return 0;
  var seen={};seen[s0]=0;
  var q=[start],hd=0,exp=0;
  while(hd<q.length){
    var cur=q[hd++];if(++exp>cap)return -1;
    var dist=seen[enc(cur)];
    for(var d=0;d<4;d++){
      var ns=slide(cur,D[d][0],D[d][1]);
      var nk2=enc(ns);
      if(seen[nk2]!=null)continue;
      if(nk2===g0)return dist+1;
      seen[nk2]=dist+1;q.push(ns)}}
  return -1;
}

function genPool(n,pool){var idx=shuffle(pool.map(function(_,i){return i})).slice(0,Math.min(n,pool.length));
 return idx.map(function(i){var item=pool[i],ans=item[1];
  var wrongs=shuffle(pool.filter(function(p){return p[1]!==ans}).map(function(p){return p[1]})).slice(0,3);
  var opts=shuffle([ans].concat(wrongs));
  return {q:item[0],a:ans,opts:opts}})}
function genMath(n){var out=[];for(var i=0;i<n;i++){var op=ri(3),a,b,ans;
 if(op===0){a=ri(40)+1;b=ri(40)+1;ans=a+b}
 else if(op===1){a=ri(40)+10;b=ri(a);ans=a-b}
 else{a=ri(11)+2;b=ri(11)+2;ans=a*b}
 var q=op===0?(a+' + '+b+' = ?'):op===1?(a+' − '+b+' = ?'):(a+' × '+b+' = ?');
 var wrongs=shuffle([ans+1,ans-1,ans+2,ans-2,ans+3].filter(function(x){return x!==ans})).slice(0,3);
 var opts=shuffle([String(ans)].concat(wrongs.map(String)));
 out.push({q:q,a:String(ans),opts:opts})}
 return out}
